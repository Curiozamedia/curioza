.jour h2{font:18px Anton,sans-serif;letter-spacing:.05em;margin:0 0 8px;text-transform:uppercase}.jour h2 small{color:var(--doux);font:600 12px Montserrat}

 dimanche soir. Certaines t'ont marqué plus que tu ne le pensais. Swipe pour les revoir toutes.\n\nLa dernière est celle que tu as sûrement répétée à ton tour 👀\n\nQuelle phrase de tes parents tu redis aujourd'hui sans t'en rendre compte ? 👇\n\n💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux rire en famille.\n\n📤 Partage-le à un ami, lui demander s'il se reconnaît aussi dans ces phrases.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #generation2000", "medias": ["medias/2026-10-12/2026-10-15_0800_carro/01.jpg", "medias/2026-10-12/2026-10-15_0800_carro/02.jpg", "medias/2026-10-12/2026-10-15_0800_carro/03.jpg", "medias/2026-10-12/2026-10-15_0800_carro/04.jpg", "medias/2026-10-12/2026-10-15_0800_carro/05.jpg", "medias/2026-10-12/2026-10-15_0800_carro/06.jpg", "medias/2026-10-12/2026-10-15_0800_carro/07.jpg", "medias/2026-10-12/2026-10-15_0800_carro/08.jpg"], "couverture": "medias/2026-10-12/2026-10-15_0800_carro/01.jpg"}, {"id": "2026-10-15_1100_carro", "jour": "jeudi", "date": "2026-10-15", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Et si les animaux de compagnie avaient la taille d'un immeuble en pleine ville (malaise drôle garanti)", "contenu": {"titre_couverture": "Et si ton [chat] faisait 80 mètres de haut ?", "sous_titre": "Imagine tes animaux à la taille d'un immeuble, on te spoile déjà la fin", "slides": [{"titre": "Il dort sur [ton] immeuble", "texte": "Ton chat pourrait bien s'installer sur le toit de la tour voisine. Les *antennes* feraient office de moustaches, et personne n'oserait lui demander de descendre."}, {"titre": "Le *livreur* passe par la [gamelle]", "texte": "Un chien géant aurait besoin d'une gamelle immense, de la taille d'une piscine. Le livreur, lui, devrait sortir l'échelle pour déposer les croquettes."}, {"titre": "Balade en *laisse* géante", "texte": "Promener un lapin géant demand -12/2026-10-15_1100_carro/01.jpg"}, {"id": "2026-10-15_1300_devin", "jour": "jeudi", "date": "2026-10-15", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 7 + 6 × 6 − 8 = ?", "reponse": "35 (piège : 70)", "legende": "La réponse n'est pas 70 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-12/2026-10-15_1300_devin/reel.mp4"], "couverture": "medias/2026-10-12/2026-10-15_1300_devin/couverture.jpg"}, {"id": "2026-10-15_1400_carro", "jour": "jeudi", "date": "2026-10-15", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "pays", "concept": "Le duel France vs Italie : le petit-déjeuner", "contenu": {"titre_couverture": "Le duel France vs Italie : le *petit-déjeuner* [CAFÉ] à la française", "sous_titre": "Tartine ou biscotti, qui gagne ce matin ?", "slides": [{"titre": "Le [café] du matin", "texte": "En France, on trempe sa tartine dans un bol de café au lait. En Italie, on avale souvent un *espresso* debout, en quelques secondes."}, {"titre": "Le [croissant] fait la loi", "texte": "Le croissant français se mange souvent en pause. Le cornetto italien se savoure volontiers au comptoir, avec un *cappuccino*."}, {"titre": "Sucré ou *salé* ?", "texte": "Ici, le petit-déj penche vers le sucré. En Italie aussi, mais manger debout au bar surprend souvent les visiteurs."}, {"titre": "L'orange *pressée* contre le jus", "texte": "Le jus d'orange en brique, c'est notre standard. En Italie, beaucoup préfèrent presser l'orange à la main, sous les yeux de celui qui la boit."}, {"titre": "Le petit-déj *en famille* ou *en solo* ?", "texte": "Chez nous, on prend souvent son petit-déj seul, les yeux dans le bol. En Italie, la discussion démarre parfois avant même le premier café."}, {"titre": "Le duel est [serré]", "texte": "Pas de vainqueur absolu : la France aime la tartine, l'Italie aime le café vite fait. Et toi, tu fais partie de quel camp ce matin ?"}], "question_fin": "Tu es team *tartine* ou team *espresso* ?"}, "sujet": "Le duel France vs Italie : le petit-déjeuner", "legende": "Tartine ou espresso, il faut choisir ce matin ☕\n\nOn compare le petit-déj français et italien en six rounds : café, viennoiseries, sucré contre salé, jus d'orange et façon de manger. Chaque slide pose une question sur nos habitudes du matin.\n\nLa dernière slide tranche le duel… mais pas forcément comme tu l'attends 👀\n\nQuel camp tu choisis, tartine ou espresso debout ? ☕\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu débattras de ton petit-déj avec des potes.\n\n📤 Partage-le à un ami, celui qui boit son café debout en trois secondes et qui doit voir ça ☕.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #petitdejeuner #France #Italie", "medias": ["medias/2026-10-12/2026-10-15_1400_carro/01.jpg", "medias/2026-10-12/2026-10-15_1400_carro/02.jpg", "medias/2026-10-12/2026-10-15_1400_carro/03.jpg", "medias/2026-10-12/2026-10-15_1400_carro/04.jpg", "medias/2026-10-12/2026-10-15_1400_carro/05.jpg", "medias/2026-10-12/2026-10-15_1400_carro/06.jpg", "medias/2026-10-12/2026-10-15_1400_carro/07.jpg", "medias/2026-10-12/2026-10-15_1400_carro/08.jpg"], "couverture": "medias/2026-10-12/2026-10-15_1400_carro/01.jpg"}, {"id": "2026-10-15_1700_carro", "jour": "jeudi", "date": "2026-10-15", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Phénomènes naturels qui semblent truqués mais sont réels", "contenu": {"titre_couverture": "Ça a l'air [truqué] ? Pourtant c'est *100% réel*, et ça se passe sur Terre", "sous_titre": "La nature a sans doute plus d'imagination que ton logiciel de retouche", "slides": [{"titre": "LES *NUAGES* EN FORME D'ONDE", "texte": "Parfois, des nuages en rouleaux alignés traversent le ciel, et on dirait des vagues géantes. Aucun photomontage n'est nécessaire."}, {"titre": "LE LAC QUI *SE COLORE*", "texte": "Certains lacs salés prennent des teintes roses ou rouges selon les micro-organismes qui y vivent. Ce n'est pas un filtre, c'est la chimie du lieu."}, {"titre": "LA DUNE QUI *CHANTE*", "texte": "Dans certaines dunes, le sable peut émettre un son grave, parfois comparé à un ronflement, quand il glisse. Un concert naturel sans musicien."}, {"titre": "UN ARC-EN-CIEL *BLANC*", "texte": "Quand les gouttelettes sont très fines, l'arc-en-ciel peut apparaître presque blanc. Une idée simple : moins de gouttes, moins de couleurs."}, {"titre": "LA MER QUI *SE RETIRE*", "texte": "Sur certaines plages, la marée peut révéler un chemin de pierres en quelques heures. La mer fait le travail, et le résultat ressemble à un décor de cinéma."}, {"titre": "DES LUEURS *DANS LA NUIT*", "texte": "Des lumières vertes ou violettes peuvent danser dans le ciel polaire. C'est l'aurore, liée aux particules du vent solaire qui frappent la haute atmosphère."}], "question_fin": "Lequel te paraît le plus *impossible* à croire ?"}, "sujet": "Phénomènes naturels qui semblent truqués mais sont réels", "legende": "La nature se moque des filtres 🌍\n\nNuages en vagues, lacs roses, dunes qui chantent : tout est réel. Swipe pour voir les phénomènes que tu crois retouchés.\n\nLa dernière slide est celle que personne n'attend 👀\n\nTu aurais deviné lequel était vrai ? 🤔\n\n💾 Enregistre ce carrousel pour pour retrouver ces phénomènes quand tu croiseras un doute 📌.\n\n📤 Partage-le à un ami, à celui qui pense que tout est trafiqué sur Internet 😏.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #nature #insolite #saviezvous", "medias": ["medias/2026-10-12/2026-10-15_1700_carro/01.jpg", "medias/2026-10-12/2026-10-15_1700_carro/02.jpg", "medias/2026-10-12/2026-10-15_1700_carro/03.jpg", "medias/2026-10-12/2026-10-15_1700_carro/04.jpg", "medias/2026-10-12/2026-10-15_1700_carro/05.jpg", "medias/2026-10-12/2026-10-15_1700_carro/06.jpg", "medias/2026-10-12/2026-10-15_1700_carro/07.jpg", "medias/2026-10-12/2026-10-15_1700_carro/08.jpg"], "couverture": "medias/2026-10-12/2026-10-15_1700_carro/01.jpg"}, {"id": "2026-10-15_2000_carro", "jour": "jeudi", "date": "2026-10-15", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Vacances chez les grands-parents : ce qu'on y faisait (1985-2005)", "contenu": {"titre_couverture": "CHEZ MAMIE ET PAPY, [TOUT] ÉTAIT *PERMIS* SAUF…", "sous_titre": "Les vacances d'avant, version campagne", "slides": [{"titre": "Le [téléphone] à fil du salon", "texte": "Chez mamie, on n'appelait pas pour rien. Le combiné était relié au mur par un fil si long qu'on pouvait faire les cent pas dans le couloir."}, {"titre": "Les *volets* fermés à midi", "texte": "Pour garder la fraîcheur, mamie fermait les volets en plein été. Résultat : une maison dans la pénombre, et des siestes qui semblaient durer une éternité."}, {"titre": "Le *cahier* de recettes décousu", "texte": "Pas de blog ni d'appli : la recette du gâteau était écrite à la main, tachée de beurre, coincée entre deux pages de vieux journaux."}, {"titre": "La *boîte* de jeux qui sentait le grenier", "texte": "Le plateau de jeu était incomplet, les dés étaient usés et il manquait toujours un pion. On jouait quand même, parce qu'il pleuvait et que l'ennui était le vrai ennemi."}, {"titre": "Le *baladeur* prêté pour la route", "texte": "Sur la départementale, on se disputait la cassette du trajet. Rembobiner au crayon à bille, c'était une science que personne n'a jamais vraiment enseignée."}, {"titre": "Le *jardin* sans écran ni wifi", "texte": "Cabanes dans les haies, confitures à la cuisine, lectures sur le transat. Aujourd'hui on appelle ça une déconnexion, à l'époque c'était juste l'été."}], "question_fin": "Quel souvenir de chez mamie te donne le plus *envie de pleurer* ?"}, "sujet": "Vacances chez les grands-parents, ce qu'on y faisait (1985-2005)", "legende": "Chez mamie, on ne savait pas qu'on était heureux 🏡\n\nTéléphone à fil, volets fermés, cahier de recettes tâché : les vacances chez les grands-parents avaient leurs règles, et elles ne s'écrivaient nulle part. Swipe pour retrouver ce qu'on faisait sans y penser.\n\nLes dernières slides parlent d'un objet que tu as forcément oublié dans une boîte à chaussures 👀\n\nTu avais quel rituel chez tes grands-parents ? 👇\n\n💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux replonger dans ton enfance.\n\n📤 Partage-le à un ami, il va reconnaître sa propre enfance dans ces images.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #vacancesdenfance", "medias": ["medias/2026-10-12/2026-10-15_2000_carro/01.jpg", "medias/2026-10-12/2026-10-15_2000_carro/02.jpg", "medias/2026-10-12/2026-10-15_2000_carro/03.jpg", "medias/2026-10-12/2026-10-15_2000_carro/04.jpg", "medias/2026-10-12/2026-10-15_2000_carro/05.jpg", "medias/2026-10-12/2026-10-15_2000_carro/06.jpg", "medias/2026-10-12/2026-10-15_2000_carro/07.jpg", "medias/2026-10-12/2026-10-15_2000_carro/08.jpg"], "couverture": "medias/2026-10-12/2026-10-15_2000_carro/01.jpg"}, {"id": "2026-10-15_2100_diapo", "jour": "jeudi", "date": "2026-10-15", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Animaux de compagnie grands comme des immeubles en ville", "accroche": "Animaux géants : le *voisin* sera [furieux] !", "legende": "Imagine ton chat grand comme un immeuble... le voisin ne dormirait plus 🐱🏙️\n\nTon animal de compagnie géant, il dormirait sur quel immeuble de ta ville ? 👇\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#culturegenerale #curiosites #animauxdecompagnie #insolite #reelsfrance", "medias": ["medias/2026-10-12/2026-10-15_2100_diapo/reel.mp4"], "couverture": "medias/2026-10-12/2026-10-15_2100_diapo/couverture.jpg", "source": "2026-10-15_1100_carro"}, {"id": "2026-10-16_0800_carro", "jour": "vendredi", "date": "2026-10-16", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Métiers qui n'existent pas mais qu'on aimerait voir", "contenu": {"titre_couverture": "Les [MÉTIERS] qui n'existent *pas* encore, mais qu'on rêve de voir", "sous_titre": "Swipe si tu voudrais postuler 👇", "slides": [{"titre": "[Berceur] de nuages", "texte": "Son job, à en rêver : rassurer les cumulus qui stressent avant la pluie. Il *chantonne* doucement, et on aimerait croire qu'ils lâchent leur averse à l'heure prévue."}, {"titre": "*Correcteur* de rêves", "texte": "Chaque matin, il relit les rêves de la nuit et corrige les fins bâclées. Un *scénario* qui tourne mal ? Il réécrit la fin avant ton réveil."}, {"titre": "[Gardien] des chaussettes perdues", "texte": "Il patrouille la machine à laver et ramène les chaussettes égarées. Certains disent qu'il *planque* aussi les clés, mais ça reste une *théorie*."}, {"titre": "*Trieur* de silences", "texte": "Dans les grandes villes, il classe les silences par qualité : silence de bibliothèque, silence de forêt, silence de fin de dîner gênant. Il te dira lequel *te* manque."}], "question_fin": "Lequel de ces métiers aurais-tu *envie* d'exercer ?"}, "sujet": "Métiers impossibles qu'on aimerait voir exister", "legende": "Un métier qui n'existe pas, et pourtant tu le voudrais 🤔\n\nBerceur de nuages, correcteur de rêves, gardien des chaussettes perdues... On a imaginé des jobs absurdes qui auraient pourtant bien leur place dans nos journées. Swipe pour découvrir les quatre.\n\nLe dernier métier est le plus étrange de tous, et il pourrait bien te toucher 👀\n\nQuel métier inventé tu prendrais tout de suite ? 😏\n\n💾 Enregistre ce carrousel pour retrouver ces idées absurdes quand tu veux rire ou inspirer un projet.\n\n📤 Partage-le à un ami, qui doit absolument savoir quel job il rêve d'avoir 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #humour", "medias": ["medias/2026-10-12/2026-10-16_0800_carro/01.jpg", "medias/2026-10-12/2026-10-16_0800_carro/02.jpg", "medias/2026-10-12/2026-10-16_0800_carro/03.jpg", "medias/2026-10-12/2026-10-16_0800_carro/04.jpg", "medias/2026-10-12/2026-10-16_0800_carro/05.jpg", "medias/2026-10-12/2026-10-16_0800_carro/06.jpg"], "couverture": "medias/2026-10-12/2026-10-16_0800_carro/01.jpg"}, {"id": "2026-10-16_1100_carro", "jour": "vendredi", "date": "2026-10-16", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Galères technologiques d'avant : attendre, rembobiner, charger", "contenu": {"titre_couverture": "LA VIE SANS *ÇA* : ÇA FAISAIT PARTIE DU QUOTIDIEN", "sous_titre": "Si tu as grandi entre 1985 et 2005, tu sais de quoi on parle", "slides": [{"titre": "ATTENDRE, ÇA *FORMAIT* LE CARACTÈRE", "texte": "Pour voir une photo, il fallait finir la pellicule, la porter au labo et attendre plusieurs jours. Le suspense était gratuit, mais tu peux nous dire si c'était épuisant."}, {"titre": "REMBOBINER, C'ÉTAIT *UN VRAI SPORT*", "texte": "Une cassette vidéo qui s'emmêle, un crayon glissé dans le boîtier pour la rembobiner à la main : chaque location avait sa petite galère."}, {"titre": "CHARGER, C'ÉTAIT *UNE AFFAIRE D'ÉTAT*", "texte": "Un téléphone à 5 % pendant une heure, le câble à trouver, la prise à partager : on jouait à l'économie d'énergie sans le savoir."}, {"titre": "LE *MODEM* QUI t": "Aliments géants posés dans des paysages naturels, angle original", "legende": "Et si ton petit-déj squattait la montagne ? 🥖\n\nUne baguette en travers d'un col, une meule de fromage au bord d'un lac, une cerise sur une falaise : la nature version buffet XXL. Swipe, c'est plus absurde à chaque slide.\n\nLa dernière slide est celle qui fait le plus rire (ou flipper) 👀\n\nTu gardes quel aliment géant, ou tu fuis ? 😅\n\n💾 Enregistre ce carrousel pour le prochain pique-nique qui part en vrille.\n\n📤 Partage-le à un ami, celui qui rêve de manger une montagne de fromage 🧀.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #absurde #insolite #illustrationIA", "medias": ["medias/2026-10-12/2026-10-17_0800_carro/01.jpg", "medias/2026-10-12/2026-10-17_0800_carro/02.jpg", "medias/2026-10-12/2026-10-17_0800_carro/03.jpg", "medias/2026-10-12/2026-10-17_0800_carro/04.jpg", "medias/2026-10-12/2026-10-17_0800_carro/05.jpg", "medias/2026-10-12/2026-10-17_0800_carro/06.jpg"], "couverture": "medias/2026-10-12/2026-10-17_0800_carro/01.jpg"}, {"id": "2026-10-17_1100_carro", "jour": "samedi", "date": "2026-10-17", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "pays", "concept": "Le duel France vs Espagne : les transports du quotidien", "contenu": {"titre_couverture": "Le duel France vs Espagne : [les trajets] que tu fais *sans y penser*", "sous_titre": "Métro, bus, sieste et horaires : qui gagne ?", "slides": [{"titre": "[Le métro] contre le tram", "texte": "En France, on se bouscule souvent sur le quai. En Espagne, beaucoup prennent le tram en *flânant* et regardent les façades défiler. Question de tempo, peut-être."}, {"titre": "Horaires *à la carte*", "texte": "Le Français vérifie l'horaire du dernier train. L'Espagnol, lui, a peut-être déjà repéré la terrasse du prochain *apéro*. Chacun son rythme, à chacun de voir."}, {"titre": "Le *vélo* qui gagne", "texte": "À Séville comme à Bordeaux, le vélo prend de la place. Idée à creuser : et si on pédalait plus souvent qu'on ne râle dans les bouchons ?"}, {"titre": "La *sieste* des transports", "texte": "En France, on reste souvent debout dans le bus. En Espagne, la pause de midi a la cote. Le vrai duel : qui profite du trajet pour souffler ?"}], "question_fin": "Lequel de ces trajets te donne le plus *envie* de changer tes habitudes ?"}, "sujet": "Le duel France vs Espagne : les transports du quotidien", "legende": "Métro ou tram, qui gagne vraiment ? 🚋\n\nOn compare la France et l'Espagne sur des gestes simples du quotidien : prendre le métro, consulter les horaires, pédaler, se poser dans le bus. Certains trajets donnent un vrai sentiment de liberté, et c'est peut-être là que le duel se joue.\n\nLa dernière slide pourrait bien te faire réviser ta pause de midi 👀\n\nTu es team métro bondé ou team tram qui flâne ? 🤔\n\n💾 Enregistre ce carrousel pour les prochains trajets et ne pas oublier ces petites différences.\n\n📤 Partage-le à un ami, celui qui se plaint toujours de ses transports et qui pourrait enfin rire un peu 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #france #espagne #transportsencommun", "medias": ["medias/2026-10-12/2026-10-17_1100_carro/01.jpg", "medias/2026-10-12/2026-10-17_1100_carro/02.jpg", "medias/2026-10-12/2026-10-17_1100_carro/03.jpg", "medias/2026-10-12/2026-10-17_1100_carro/04.jpg", "medias/2026-10-12/2026-10-17_1100_carro/05.jpg", "medias/2026-10-12/2026-10-17_1100_carro/06.jpg"], "couverture": "medias/2026-10-12/2026-10-17_1100_carro/01.jpg"}, {"id": "2026-10-17_1300_devin", "jour": "samedi", "date": "2026-10-17", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 9 + 9 × 9 − 9 = ?", " quand même. Se tromper de route faisait partie du voyage, et personne n'en faisait un drame."}], "question_fin": "Lequel t'a le plus [fait sourire] ? Et lequel te manque *vraiment* ?"}, "sujet": "Choses normales il y a 20-30 ans, aujourd'hui disparues", "legende": "Tu te souviens de ça ? 📼\n\nDes objets qui semblaient éternels, et qui ont disparu sans prévenir. Certains te paraîtront absurdes, d'autres te manqueront plus que tu ne l'imagines. Swipe pour replonger dans ton enfance.\n\nLa dernière slide est celle que personne n'a vu venir 👀\n\nQuel objet d'avant tu regrettes le plus ? Dis-le en commentaire 👇\n\n💾 Enregistre ce carrousel pour te rappeler ces souvenirs quand tu veux replonger dans les années 90.\n\n📤 Partage-le à un ami, à quelqu'un qui a grandi avec des cassettes et des cabines téléphoniques 📞.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #annees2000", "medias": ["medias/2026-10-12/2026-10-17_1400_carro/01.jpg", "medias/2026-10-12/2026-10-17_1400_carro/02.jpg", "medias/2026-10-12/2026-10-17_1400_carro/03.jpg", "medias/2026-10-12/2026-10-17_1400_carro/04.jpg", "medias/2026-10-12/2026-10-17_1400_carro/05.jpg", "medias/2026-10-12/2026-10-17_1400_carro/06.jpg", "medias/2026-10-12/2026-10-17_1400_carro/07.jpg"], "couverture": "medias/2026-10-12/2026-10-17_1400_carro/01.jpg"}, {"id": "2026-10-17_1700_carro", "jour": "samedi", "date": "2026-10-17", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Inventions nées d'un accident ou d'une erreur, angle surprenant", "contenu": {"titre_couverture": "Les [erreurs] qui ont changé le monde", "sous_titre": "Des ratés, des bêtises, et pourtant des *inventions* géniales", "slides": [{"titre": "Le *micro-ondes* par accident", "texte": "Selon une anecdote souvent racontée, un ingénieur travaillant sur des radars aurait remarqué que le chocolat fondait dans sa poche. Cette histoire est peut-être une légende, mais elle a inspiré le four à *micro-ondes*."}, {"titre": "Le *Post-it* qui collait mal", "texte": "Un chercheur voulait une colle très forte et obtient une colle qui se décolle. Des années plus tard, cette faiblesse devient le *bloc-notes* adhésif."}, {"titre": "Un *remède* cardiaque devenu autre chose", "texte": "À l'origine, ce médicament était étudié pour le cœur. Les essais ont révélé un effet secondaire inattendu, et le produit a été réorienté vers une tout autre utilisation."}, {"titre": "La *vulcanisation* du caoutchouc", "texte": "On raconte que Charles Goodyear aurait laissé tomber du caoutchouc sur un poêle chaud et découvert qu'il ne collait plus. Ce hasard, s'il est vrai, a rendu le *caoutchouc* utilisable pour les pneus."}, {"titre": "Le *plastique* né d'essais ratés", "texte": "Le premier plastique entièrement synthétique naît d'essais chimiques imparfaits et de patience. Un hasard bien dirigé, et l'ère du plastique commence."}], "question_fin": "Laquelle de ces erreurs te semble la plus *folle* ?"}, "sujet": "Inventions nées d'un accident ou d'une erreur", "legende": "Des bêtises de labo qui ont changé ta vie 🧪\n\nPas besoin d'être génie pour rater une expérience. Ici, les ratés ont donné naissance au micro-ondes, au Post-it et au pneu. Swipe pour voir l'histoire complète.\n\nLa dernière erreur est celle qui a fait fondre plus qu'un simple chocolat 👀\n\nTu connaissais laquelle de ces erreurs ? 🤔\n\n💾 Enregistre ce carrousel pour retrouver ces anecdotes quand tu veux briller en soirée.\n\n📤 Partage-le à un ami, celui qui pense que la science, c'est toujours du sérieux.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #inventions #histoire #saviezvous", "medias": ["medias/2026-10-12/2026-10-17_1700_carro/01.jpg", "medias/2026-10-12/2026-10-17_1700_carro/02.jpg", "medias/2026-10-12/2026-10-17_1700_carro/03.jpg", "medias/2026-10-12/2026-10-17_1700_carro/04.jpg", "medias/2026-10-12 es étonnantes, angle surprenant", "legende": "Tu crois connaître la France ? Pas sûr 🇫🇷😏\n\nDes îles qui ne l'ont pas toujours été, des dunes qui avancent, des volcans qui dorment encore. Swipe pour voir la France sous un angle inattendu.\n\nLa dernière slide est celle que personne ne voit venir 👀\n\nTu connaissais lequel de ces lieux, toi ? 💬\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu planifies un week-end pas loin de chez toi.\n\n📤 Partage-le à un ami, à celui qui se vante de tout connaître de la France 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #France #curiosites #histoirevraie #lieuxdefrance", "medias": ["medias/2026-10-12/2026-10-18_1100_carro/01.jpg", "medias/2026-10-12/2026-10-18_1100_carro/02.jpg", "medias/2026-10-12/2026-10-18_1100_carro/03.jpg", "medias/2026-10-12/2026-10-18_1100_carro/04.jpg", "medias/2026-10-12/2026-10-18_1100_carro/05.jpg", "medias/2026-10-12/2026-10-18_1100_carro/06.jpg", "medias/2026-10-12/2026-10-18_1100_carro/07.jpg"], "couverture": "medias/2026-10-12/2026-10-18_1100_carro/01.jpg"}, {"id": "2026-10-18_1300_devin", "jour": "dimanche", "date": "2026-10-18", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 7 + 12 × 11 − 10 = ?", "reponse": "129 (piège : 199)", "legende": "La réponse n'est pas 199 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-12/2026-10-18_1300_devin/reel.mp4"], "couverture": "medias/2026-10-12/2026-10-18_1300_devin/couverture.jpg"}, {"id": "2026-10-18_1400_carro", "jour": "dimanche", "date": "2026-10-18", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Lieux célèbres du monde transformés en matière inattendue", "contenu": {"titre_couverture": "Et si les [monuments] du monde étaient faits de *matière* absurde ?", "sous_titre": "Version gourmande, moelleuse et franchement improbable", "slides": [{"titre": "LA TOUR EN *SPAGHETTIS*", "texte": "Et si une tour iconique était bâtie entièrement en pâtes sèches, bien rangées, avec une sauce tomate qui coule doucement sur les fondations ? À mon avis, le vent serait enfin une question de cuisson."}, {"titre": "UNE PYRAMIDE EN [VERRE] FONDU", "texte": "Et si les pyramides d'Égypte étaient en *verre* fondu, translucide et brillant sous le soleil ? Les touristes devraient sans doute porter des lunettes de soleil dès qu'ils lèvent les yeux."}, {"titre": "LA STATUE EN *CHOCOLAT* NOIR", "texte": "Et si une statue monumentale, face à l'océan, était sculptée dans du chocolat qui commence à fondre au soleil ? Le dessert le plus *tentant* du monde, et sans doute le plus fragile."}, {"titre": "LE COLISÉE EN *MOUSSE* VERTE", "texte": "Et si des arènes antiques étaient recouvertes de mousse vivante, si épaisse qu'on ne verrait plus les pierres ? La nature reprendrait ses droits, en douceur et sans demander la permission."}], "question_fin": "Quel monument en *matière absurde* te donnerait envie de le visiter tout de suite ?"}, "sujet": "Lieux célèbres du monde faits de matière inattendue, angle absurde", "legende": "Et si les monuments du monde étaient en pâtes, en verre ou en chocolat ? 🍝\n\nQuatre lieux imaginaires transformés en matière inattendue, entre gourmandise, fragilité et pure absurdité. Difficile de les regarder comme avant une fois la scène imaginée.\n\nLa dernière slide est celle qui risque de te faire saliver tout en te donnant le vertige 👀\n\nTu choisirais quel monument en matière absurde pour la visite de ta vie ? 🤔\n\n💾 Enregistre ce carrousel pour te souvenir de ces images la prochaine fois que tu passes devant un monument.\n\n📤 Partage-le à un ami, parce que ton ami va forcément vouloir imaginer une tour en spaghettis 🍝.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #absurde #insolite #monuments", "medias": ["medias/2026-10-12/2026-10-18_1400_carro/01.jpg", "medias/2026-10-12/2026-10-18_1400_carro/02.jpg", "medias/2026-10-12/2026-10-18_1400_carro/03.jpg", "medias/2026-10-12/2026-10-18_1400_carro/04.jpg", "medias/2026-10-12/2026-10-18_1400_carro/05.jpg", "medias/2026-10-12/2026-10-18_1400_carro/06.jpg"], "couverture": "medias/2026-10-12/2026-10-18_1400_carro/01.jpg"}, {"id": "2026-10-18_1700_carro", "jour": "dimanche", "date": "2026-10-18", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "vie", "concept": "Mécanismes automatiques de ton corps, expliqués simplement", "contenu": {"titre_couverture": "TON CORPS FAIT *20 TRUCS* PENDANT QUE TU LIS CE TITRE", "sous_titre": "Le pilote automatique, version biologie", "slides": [{"titre": "[RÉFLEXE] DU GENOU", "texte": "Un petit coup sous la rotule et ta jambe se détend avant même que tu aies eu le temps de réfléchir. Ton cerveau n'a pas eu son mot à dire."}, {"titre": "Ton *cœur* a son propre chef", "texte": "Le cœur déclenche ses battements grâce à un groupe de cellules spécialisées, le nœud sinusal. Il garde un rythme propre, même en partie isolé du reste du corps."}, {"titre": "Respirer, *sans y penser*", "texte": "Tu respires en permanence sans le décider. Tu peux retenir ton souffle un moment, mais ton corps finit toujours par reprendre le contrôle."}, {"titre": "Le clignement, [ULTRA] discret", "texte": "Tes yeux clignent automatiquement pour rester humides, souvent sans que tu le remarques. Ça continue même quand tu fixes un écran sans bouger."}, {"titre": "Ton ventre *gère* tout seul", "texte": "Ton système digestif a son propre réseau de neurones, surnommé parfois le sec et* qui circulait en cours", "texte": "Les mots d'amour et les petites blagues passaient de main en main, pliés en triangle, jusqu'à ce qu'un prof *intercepte* le message."}, {"titre": "Le [Tamagotchi] à nourrir", "texte": "Ce petit animal électronique pouvait mourir si tu oubliais de le *nourrir* ou de le faire dormir, même pendant un cours de maths."}, {"titre": "La *radio-réveil* et l'enregistrement", "texte": "Tu attendais la chanson préférée à la radio, le doigt prêt sur la touche REC, en espérant que le présentateur *se taise* avant la fin."}], "question_fin": "Lequel t'a le plus *manqué* en grandissant ?"}, "sujet": "Objets de chambre d'ado nés entre 1985 et 2005", "legende": "Ta chambre d'ado dans les années 90, ça ressemblait à quoi ? 📼\n\nPiles, cassettes, petits mots pliés en triangle : on a tous eu ces objets sur notre bureau. Swipe pour replonger dans ta chambre d'avant, et découvre celui qui te fait le plus sourire.\n\nLa dernière slide est celle qui fait toujours réagir les anciens ados 👀\n\nDis-nous en commentaire quel objet tu avais dans ta chambre 💬\n\n💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux replonger dans les années 90.\n\n📤 Partage-le à un ami, pour qu'il retrouve sa chambre d'ado en deux minutes.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #chambredado", "medias": ["medias/2026-10-12/2026-10-18_2000_carro/01.jpg", "medias/2026-10-12/2026-10-18_2000_carro/02.jpg", "medias/2026-10-12/2026-10-18_2000_carro/03.jpg", "medias/2026-10-12/2026-10-18_2000_carro/04.jpg", "medias/2026-10-12/2026-10-18_2000_carro/05.jpg", "medias/2026-10-12/2026-10-18_2000_carro/06.jpg"], "couverture": "medias/2026-10-12/2026-10-18_2000_carro/01.jpg"}, {"id": "2026-10-18_2100_diapo", "jour": "dimanche", "date": "2026-10-18", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Lieux célèbres du monde faits de matière inattendue, angle absurde", "accroche": "Ces monuments ont craqué… [MANGÉ] par *spaghettis* 🍝", "legende": "Le Colisée en mousse, la tour en spaghettis… tu craques pour quel monument absurde ? 🍝\n\nQuel lieu célèbre tu voudrais voir transformé en matière bizarre ? Dis-le en commentaire 👇\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#CultureG #Curiosites #Insolite #LieuxCelebres #ArtIA", "medias": ["medias/2026-10-12/2026-10-18_2100_diapo/reel.mp4"], "couverture": "medias/2026-10-12/2026-10-18_2100_diapo/couverture.jpg", "source": "2026-10-18_1400_carro"}]}, {"semaine": "2026-10-19", "phase": "normal", "tout_valider": false, "genere_le": "2026-10-18T01:59", "posts": [{"id": "2026-10-19_0800_carro", "jour": "lundi", "date": "2026-10-19", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Maisons construites dans des endroits impossibles", "contenu": {"titre_couverture": "Des [maisons] perchées où personne ne devrait *vivre*", "sous_titre": "Et si ton salon était au bord du vide ?", "slides": [{"titre": "Le [toit] au-dessus des nuages", "texte": "Dans les Alpes et les Andes, certaines maisons semblent posées sur des pentes si raides qu'on se demande comment elles tiennent. À notre avis, il faut une bonne dose de courage pour y dormir, mais elles sont là depuis des générations."}, {"titre": "Une [cabane] sur l'eau salée", "texte": "Sur certains lacs de sel, des habitations en bois se dressent au milieu d'une surface blanche et lisse. Quand le reflet du ciel se pose sur le sol, la maison a l'air de flotter, sans une goutte d'eau sous les pilotis."}, {"titre": "Habiter *au fond* d'un canyon", "texte": "Dans plusieurs régions du monde, des habitations ont été creusées dans la falaise. Une façade peinte à l'entrée, et le reste de la demeure disparaît dans la roche. Franchement, on a envie d'y frapper pour vérifier qu'il y a un salon derrière."}, {"titre": "Un *arbre* comme salon", "texte": "Dans certaines forêts tropicales, des cabanes sont installées dans les branches de très grands arbres. Pas de sol ferme, juste un plancher suspendu au-dessus de la canopée. Idéal pour les amateurs de vertige, moins pour les chats."}, {"titre": "Une [maison] sur la *mer* gelée", "texte": "Dans l'Arctique, des villages vivent sur la glace de mer ou sur le permafrost. Les maisons sont surélevées sur pilotis pour limiter la chaleur qui ferait fondre le sol gelé sous elles."}], "question_fin": "Laquelle de ces maisons te ferait le plus *flipper* au réveil ?"}, "sujet": "Maisons construites dans des endroits impossibles", "legende": "Ton salon au bord du vide, ça te tente ? 🏠\n\nFalaises, lacs de sel, canyons, cimes d'arbres et banquise : l'humanité a trouvé des endroits où personne n'aurait parié un centime sur un toit. Certains de ces logis tiennent depuis des générations, et ça, c'est déjà une belle performance.\n\nLa dernière maison est tellement improbable qu'on la croirait sortie d'un film 👀\n\nTu habiterais dans laquelle, toi, malgré le vertige ? 😅\n\n💾 Enregistre ce carrousel pour retrouver ces exemples quand tu voudras rêver d'une maison hors norme.\n\n📤 Partage-le à un ami, qui rêve de vivre au sommet d'une falaise 🏔️.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #architecture #saviezvous", "medias": ["medias/2026-10-19/2026-10-19_0800_carro/01.jpg", "medias/2026-10-19/2026-10-19_0800_carro/02.jpg", "medias/2026-10-19/2026-10-19_0800_carro/03.jpg", "medias/2026-10-19/2026-10-19_0800_carro/04.jpg", "medias/2026-10-19/2026-10-19_0800_carro/05.jpg", "medias/2026-10-19/2026-10-19_0800_carro/06.jpg", "medias/2026-10-19/2026-10-19_0800_carro/07.jpg"], "couverture": "medias/2026-10-19/2026-10-19_0800_carro/01.jpg"}, {"id": "2026-10-19_1100_carro", "jour": "lundi", "date": "2026-10-19", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Lieux célèbres du monde faits de matière inattendue", "contenu": {"titre_couverture": "Et si les [monuments] du monde étaient faits de *trucs bizarres* ?", "sous_titre": "Quand l'architecture se prend pour un goûter", "slides": [{"titre": "LA TOUR EN *SPAGHETTIS*", "texte": "Imagine une tour élancée montée de pâtes crues, serrées les unes contre les autres, qui oscille doucement au vent. Pas de sauce, juste du *suspense*."}, {"titre": "LE PALAIS EN *SAVON*", "texte": "Et si un palais majestueux était taillé dans un bloc de savon blanc, avec des reflets irisés ? On se dit que ses visiteurs risqueraient de *glisser*."}, {"titre": "L'AMPHITHÉÂTRE EN [GÂTEAU]", "texte": "Des arcades empilées comme une pâtisserie géante, nappées de crème et saupoudrées de sucre glace. Une idée : on se demande *qui* aurait le courage de la couper."}, {"titre": "LA PYRAMIDE EN *SABLE* MOUILLÉ", "texte": "Et si une pyramide était sculptée dans du sable humide ? On peut imaginer qu'elle serait *fragile*, à la merci des marées et du bon sens."}], "question_fin": "Laquelle de ces *constructions* te donnerait envie de la croquer ?"}, "sujet": "Lieux célèbres du monde faits de matière inattendue, angle absurde", "legende": "Ton monument préféré survivrait-il à un goûter ? 🍝\n\nOn a imaginé quelques grands monuments faits de matières improbables : pâtes, savon, gâteau, sable mouillé. Certaines idées font sourire, d'autres donnent un peu le vertige.\n\nLa dernière construction est sûrement la plus fragile... 👀\n\nTu choisis quel monument en pâtes, savon, gâteau ou sable ? 🤔\n\n💾 Enregistre ce carrousel pour retrouver ces idées absurdes quand tu veux briller en soirée.\n\n📤 Partage-le à un ami, il va sûrement vouloir décider du monument le plus appétissant.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #monumentsdumonde", "medias": ["medias/2026-10-19/2026-10-19_1100_carro/01.jpg", "medias/2026-10-19/2026-10-19_1100_carro/02.jpg", "medias/2026-10-19/2026-10-19_1100_carro/03.jpg", "medias/2026-10-19/2026-10-19_1100_carro/04.jpg", "medias/2026-10-19/2026-10-19_1100_carro/05.jpg", "medias/2026-10-19/2026-10-19_1100_carro/06.jpg"], "couverture": "medias/2026-10-19/2026-10-19_1100_carro/01.jpg"}, {"id": "2026-10-19_1300_devin", "jour": "lundi", "date": "2026-10-19", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 4 + 2 ÷ 3 × 6 = ?", "reponse": "8 (piège : 12)", "legende": "La réponse n'est pas 12 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-19/2026-10-19_1300_devin/reel.mp4"], "couverture": "medias/2026-10-19/2026-10-19_1300_devin/couverture.jpg"}, {"id": "2026-10-19_1400_carro", "jour": "lundi", "date": "2026-10-19", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Inventions totalement inutiles mais magnifiques", "contenu": {"titre_couverture": "Des [INVENTIONS] *inutiles* mais tellement *magnifiques*", "sous_titre": "Six trouvailles qui ne servent à rien, et c'est tout le charme", "slides": [{"titre": "Le [parapluie] pour la pluie *absente*", "texte": "Un parapluie qui ne se déploierait que quand il ne pleut pas. Il ne protège de rien, mais on peut imaginer qu'il fasse sourire tout le quartier."}, {"titre": "Une *horloge* à reculons", "texte": "Ses aiguilles tournent dans le sens inverse, juste pour le plaisir de déstabiliser ton cerveau. Et si lire l'heure devenait une petite énigme chaque matin ?"}, {"titre": "Des [fauteuils] pour *regarder* le vent", "texte": "Des fauteuils en verre orientés face aux courants d'air, sans rien d'autre à voir. Juste pour observer les feuilles danser, à ton rythme."}, {"titre": "Une *lampe* qui éclaire le plafond", "texte": "Elle ne sert pas à lire ni à voir où tu marches. Elle illumine seulement ce qui est au-dessus de ta tête, comme une constellation personnelle."}, {"titre": "Un *escalier* qui ne mène nulle part", "texte": "Quelques marches en spirale qui s'arrêtent net dans le vide, au milieu d'un pré. Tu montes, tu contemples, tu redescends. Et si c'était parfait comme ça ?"}, {"titre": "Une [boîte] pour garder le *silence*", "texte": "Un coffret en bois censé capturer quelques secondes de calme pour les ressortir plus tard. Personne n'a jamais prouvé que ça marche, mais l'idée est magnifique."}], "question_fin": "Laquelle de ces inventions te *fait rêver* le plus ?"}, "sujet": "Inventions totalement inutiles mais magnifiques", "legende": "Des inventions qui ne servent à rien… et c'est pour ça qu'on les adore 🛠️✨\n\nUn parapluie pour les jours secs, une horloge qui recule, un escalier qui ne mène nulle part. Six idées absurdes et poétiques à découvrir en swipant.\n\nLa dernière slide est la plus inutile de toutes… mais aussi la plus belle 👀\n\nTu en construirais une quelle pour ton salon ? 💬\n\n💾 Enregistre ce carrousel pour retrouver ces idées le jour où tu t'ennuies.\n\n📤 Partage-le à un ami, il a besoin d'une dose d'absurde aujourd'hui.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #inventions #insolite #absurde", "medias": ["medias/2026-10-19/2026-10-19_1400_carro/01.jpg", "medias/2026-10-19/2026-10-19_1400_carro/02.jpg", "medias/2026-10-19/2026-10-19_1400_carro/03.jpg", "medias/2026-10-19/2026-10-19_1400_carro/04.jpg", "medias/2026-10-19/2026-10-19_1400_carro/05.jpg", "medias/2026-10-19/2026-10-19_1400_carro/06.jpg", "medias/2026-10-19/2026-10-19_1400_carro/07.jpg", "medias/2026-10-19/2026-10-19_1400_carro/08.jpg"], "couverture": "medias/2026-10-19/2026-10-19_1400_carro/01.jpg"}, {"id": "2026-10-19_1700_carro", "jour": "lundi", "date": "2026-10-19", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Métiers impossibles qu'on aimerait voir", "contenu": {"titre_couverture": "Des [MÉTIERS] qui n'existent *pas* encore, on en rêve", "sous_titre": "Swipe si tu veux postuler", "slides": [{"titre": "[CHERCHEUR] de rêves perdus", "texte": "Son job : retrouver les rêves oubliés au fond des *tiroirs* de ta mémoire. Et si c'était le meilleur job du monde ?"}, {"titre": "Pilote de *nuages* paresseux", "texte": "Il conduit les nuages lents jusqu'à la bonne ville. Le vrai défi ? Les convaincre de *bouger* le lundi."}, {"titre": "Gardien des *ombres* du soir", "texte": "Chaque soir, il range les ombres dans des boîtes pour que les rues retrouvent leur couleur. Certaines ombres *résistent* encore, selon lui."}, {"titre": "Testeur officiel de *flaques*", "texte": "Son rôle : sauter dans chaque flaque pour vérifier qu'elle est assez profonde. Une chose est sûre, il adore ce job."}, {"titre": "Ramasseur de *silences* en bibliothèque", "texte": "Il récupère les silences oubliés entre les pages et les range par ordre alphabétique. Le rayon des *soupirs* est toujours plein."}, {"titre": "Arbitre des *coïncidences* du hasard", "texte": "Il veille à ce que deux chaussettes ne se perdent jamais ensemble. Il siffle chaque fois qu'une *coïncidence* tourne mal."}], "question_fin": "Lequel de ces métiers te donnerait le plus *envie* de postuler ?"}, "sujet": "Métiers impossibles qu'on aimerait voir exister", "legende": "Tu postulerais pour quel métier qui n'existe pas ? 🧐\n\nPilote de nuages, testeur de flaques, ramasseur de silences : des métiers absurdes qu'on rêverait de voir sur une offre d'emploi. Swipe, certains sont franchement étranges.\n\nLe dernier métier est celui que tout le monde rêve secrètement d'exercer 👀\n\nLequel te paraît le plus crédible ? 😏\n\n💾 Enregistre ce carrousel pour les jours où tu rêves de changer de boulot.\n\n📤 Partage-le à un ami, à celui qui rêve de changer de job sans jamais oser.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #metiers", "medias": ["medias/2026-10-19/2026-10-19_1700_carro/01.jpg", "medias/2026-10-19/2026-10-19_1700_carro/02.jpg", "medias/2026-10-19/2026-10-19_1700_carro/03.jpg", "medias/2026-10-19/2026-10-19_1700_carro/04.jpg", "medias/2026-10-19/2026-10-19_1700_carro/05.jpg", "medias/2026-10-19/2026-10-19_1700_carro/06.jpg", "medias/2026-10-19/2026-10-19_1700_carro/07.jpg", "medias/2026-10-19/2026-10-19_1700_carro/08.jpg"], "couverture": "medias/2026-10-19/2026-10-19_1700_carro/01.jpg"}, {"id": "2026-10-19_2000_carro", "jour": "lundi", "date": "2026-10-19", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "La météo d'une autre planète vue depuis la France", "contenu": {"titre_couverture": "La [MÉTÉO] d'autres planètes, vue depuis *ton balcon* en France", "sous_titre": "Spoiler : ton parapluie ne servirait pas à grand-chose", "slides": [{"titre": "Il pleut des [cailloux] en *orange*", "texte": "Sur une planète imaginaire au sol de sable rouillé, les nuages pourraient lâcher des gouttes de métal liquide qui se figent en billes. Chez toi, ça ferait un sacré bruit sur la carrosserie de la voiture."}, {"titre": "Le [vent] qui arrache *les toits*", "texte": "Imagine une tempête assez violente pour soulever les tuiles d'un village en quelques secondes. Selon nous, les ardoises des toits normands ne feraient pas le poids."}, {"titre": "Un *brouillard* étouffant", "texte": "Et si l'air de certaines planètes était saturé de gaz qui piquent les yeux ? On imagine bien ton marché du dimanche transformé en décor de film de science-fiction."}, {"titre": "Un *orage* qui tombe [à l'envers]", "texte": "Et si les éclairs descendaient de la mer pour remonter vers les nuages ? C'est une question pour rêver : que deviendrait ta plage préférée de Bretagne un soir d'orage ?"}], "question_fin": "Laquelle de ces météos ferait fuir ton chat ?"}, "sujet": "Météo d'autres planètes vue depuis la France", "legende": "Et si la météo de Mars débarquait chez toi ? 🪐\n\nPluie de billes métalliques, vent qui arrache les ardoises, brouillard qui pique les yeux... Swipe pour voir la France version planète étrangère.\n\nLa dernière météo est la plus étrange, promis 👀\n\nTu prendrais quelle planète pour tes prochaines vacances ? 🌍\n\n💾 Enregistre ce carrousel pour la prochaine fois que la météo te déçoit 🌦️.\n\n📤 Partage-le à un ami, à celui qui se plaint toujours qu'il pleut 😅.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #insolite #espace #absurde", "medias": ["medias/2026-10-19/2026-10-19_2000_carro/01.jpg", "medias/2026-10-19/2026-10-19_2000_carro/02.jpg", "medias/2026-10-19/2026-10-19_2000_carro/03.jpg", "medias/2026-10-19/2026-10-19_2000_carro/04.jpg", "medias/2026-10-19/2026-10-19_2000_carro/05.jpg", "medias/2026-10-19/2026-10-19_2000_carro/06.jpg"], "couverture": "medias/2026-10-19/2026-10-19_2000_carro/01.jpg"}, {"id": "2026-10-19_2100_diapo", "jour": "lundi", "date": "2026-10-19", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Maisons construites dans des endroits impossibles", "accroche": "Des maisons où personne ne devrait <mot>vivre<\/mot>… et pourtant !", "legende": "Ta maison préférée tient-elle sur un nuage ou sur un lac de sel ? ☁️🧂\n\nTu habiterais dans laquelle de ces maisons, et tu tiendrais combien de jours ?\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#culturegenerale #curiosites #insolite #maisonsincroyables #saviezvous", "medias": ["medias/2026-10-19/2026-10-19_2100_diapo/reel.mp4"], "couverture": "medias/2026-10-19/2026-10-19_2100_diapo/couverture.jpg", "source": "2026-10-19_0800_carro"}, {"id": "2026-10-20_0800_carro", "jour": "mardi", "date": "2026-10-20", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "vie", "concept": "Raccourcis mentaux qui trompent ton cerveau", "contenu": {"titre_couverture": "Ton cerveau est [paresseux] : 5 raccourcis qui te *jouent des tours*", "sous_titre": "Psychologie express, zéro blabla", "slides": [{"titre": "[Ancrage] du premier chiffre", "texte": "Selon nous, le premier chiffre entendu semble peser sur tout ce qui suit. Ton cerveau s'y raccroche comme à un repère, même quand il est absurde. C'est l'effet d'ancrage."}, {"titre": "Le *mauvais* sprint", "texte": "Tu jures que la file d'à côté avance plus vite ? Peut-être que ton cerveau retient surtout les moments d'attente irritants et oublie les moments fluides. C'est une idée très répandue : le biais de négativité en mode caisse."}, {"titre": "Le *faux* expert", "texte": "Une belle mise en page et une voix assurée peuvent suffire à te faire croire un truc. C'est l'effet de fluidité : ce qui se lit facilement paraît souvent plus vrai."}, {"titre": "Le *réflexe* de la vitrine", "texte": "Tu trouves un objet cher ? Il suffit parfois qu'un autre soit encore plus cher pour qu'il paraisse une bonne affaire. Ton cerveau compare plus qu'il ne calcule."}, {"titre": "Le *dernier* souvenir", "texte": "Tu as passé une soirée géniale mais tu gardes un souvenir mitigé ? Certains chercheurs pensent que le cerveau retient surtout le pic et la fin. Sois conscient de ce raccourci pour mieux choisir tes moments."}], "question_fin": "Lequel t'a le plus *fait sourire* en te reconnaissant ?"}, "sujet": "Raccourcis mentaux qui trompent ton cerveau au  "La [clé USB] plantée en centre-ville", "texte": "Une clé USB géante dressée sur une place publique, avec son connecteur qui sert d'entrée monumentale. Personne ne sait vraiment *où* elle range les souvenirs, et c'est ça qui intrigue."}, {"titre": "Les *chaussettes* en immeubles", "texte": "Une paire de chaussettes dépliée sur une colline, dont le talon devient un hall d'accueil. Et si le *linge* oublié ne séchait jamais, restant suspendu entre les tours ?"}], "question_fin": "Lequel de ces immeubles te donnerait le plus *envie* d'emménager ?"}, "sujet": "Objets du quotidien géants transformés en immeubles", "legende": "Ton grille-pain en gratte-ciel, ça te tente ? 🍞\n\nOn a imaginé des objets de tous les jours passés à l'échelle d'une tour : frigo, clé USB, trousse, chaussettes. Chaque slide change la ville et la sensation de vertige.\n\nLa dernière slide est celle qui risque de te faire regarder tes chaussettes autrement 👀\n\nQuel objet géant tu transformerais en immeuble chez toi ? 🏙️\n\n💾 Enregistre ce carrousel pour retrouver ces idées absurdes quand tu veux impressionner tes amis.\n\n📤 Partage-le à un ami, il rira avec toi en imaginant sa propre maison en briquet géant.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #imagination", "medias": ["medias/2026-10-19/2026-10-20_1100_carro/01.jpg", "medias/2026-10-19/2026-10-20_1100_carro/02.jpg", "medias/2026-10-19/2026-10-20_1100_carro/03.jpg", "medias/2026-10-19/2026-10-20_1100_carro/04.jpg", "medias/2026-10-19/2026-10-20_1100_carro/05.jpg", "medias/2026-10-19/2026-10-20_1100_carro/06.jpg"], "couverture": "medias/2026-10-19/2026-10-20_1100_carro/01.jpg"}, {"id": "2026-10-20_1300_devin", "jour": "mardi", "date": "2026-10-20", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marq sommet d'un volcan fumant, comme une couronne. On se demande *qui a eu l'idée* de la poser là."}], "question_fin": "Quel aliment géant voudrais-tu voir *poser* dans ton paysage préféré ?"}, "sujet": "Aliments géants posés dans des paysages naturels, angle original", "legende": "Et si ton petit-déj avait la taille d'une montagne ? 🍎\n\nSix aliments XXL installés dans des paysages réels, du lac alpin au désert brûlant. Certains sont drôles, d'autres un peu troublants. Tu vas voir le croissant polaire, tu ne vas pas le croire.\n\nLes deux dernières slides sont les plus folles, et la cerise du volcan n'est pas la pire 👀\n\nLequel de ces aliments géants te paraît le plus crédible ? 🤔\n\n💾 Enregistre ce carrousel pour te souvenir de ces images la prochaine fois que tu vois une pomme.\n\n📤 Partage-le à un ami, qu'il se demande lui aussi qui a planté les carottes dans le désert.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #imagination", "medias": ["medias/2026-10-19/2026-10-20_1400_carro/01.jpg", "medias/2026-10-19/2026-10-20_1400_carro/02.jpg", "medias/2026-10-19/2026-10-20_1400_carro/03.jpg", "medias/2026-10-19/2026-10-20_1400_carro/04.jpg", "medias/2026-10-19/2026-10-20_1400_carro/05.jpg", "medias/2026-10-19/2026-10-20_1400_carro/06.jpg", "medias/2026-10-19/2026-10-20_1400_carro/07.jpg", "medias/2026-10-19/2026-10-20_1400_carro/08.jpg"], "couverture": "medias/2026-10-19/2026-10-20_1400_carro/01.jpg"}, {"id": "2026-10-20_1700_carro", "jour": "mardi", "date": "2026-10-20", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Animaux et objets avec un trait humain inattendu", "contenu": {"titre_couverture": "Ton grille-pain a une [personnalité] en *or*... et ça craint", "sous_titre": "Le monde vu par les objets et bêtes qui se croient humains", "slides": [{"titre": "Le pigeon [rancunier]", "texte": "Certains pigeons urbains semblent reconnaître les visages de 0-22", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 12 + 2 × 12 − 6 = ?", "reponse": "30 (piège : 162)", "legende": "La réponse n'est pas 162 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-19/2026-10-22_1300_devin/reel.mp4"], "couverture": "medias/2026-10-19/2026-10-22_1300_devin/couverture.jpg"}, {"id": "2026-10-22_1400_carro", "jour": "jeudi", "date": "2026-10-22", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Ta salle de bain, ta cuisine, ton bureau… envahis par une seule chose absurde (ballons, sable, gelée, plumes…)", "contenu": {"titre_couverture": "Et si ta [maison] était envahie par du *gel* ?", "sous_titre": "Six pièces, six invasions absurdes", "slides": [{"titre": "LA *SALLE DE BAIN*", "texte": "Ta baignoire se remplit de [ballons] roses jusqu'au bord. Tu ouvres la porte, un ballon s'échappe et file vers le plafond."}, {"titre": "LA *CUISINE*", "texte": "Le frigo recrache des [spaghettis] gris qui sortent comme un ressort. Ils s'enroulent autour de la cafetière en silence."}, {"titre": "LE *BUREAU*", "texte": "Ton clavier disparaît sous une couche de [sable] fin. Tes dossiers deviennent des dunes, et ton écran ressemble à une oasis."}, {"titre": "LE *SALON*", "texte": "Des milliers de [plumes] blanches tombent du plafond. Le canapé ressemble à un nid géant, et le chat fait la tête."}, {"titre": "LE *COULOIR*", "texte": "Les [pommes de terre] roulent sur le parquet comme des boules de bowling. Impossible de rejoindre la chambre sans glisser."}, {"titre": "LE *GRENIER*", "texte": "Des [bulles de savon] géantes flottent partout, reflétant ta vie entière. Une seule éclate et tu entends ton ancien réveil."}], "question_fin": "Laquelle de ces invasions te ferait le plus fuir de chez toi ?"}, "sujet": "Salle de bain, cuisine, bureau envahis par l'absurde", "legende": "Ta maison, mais en mode invasion totale 🫠\n\nGel, sable, plumes, pommes de terre : on a pris six pièces du quotidien et on les a envahies sans prévenir. Chaque slide te fait voir ton chez-toi d'une autre façon.\n\nLa dernière pièce est celle où tout le monde finit par se cacher 👀\n\nTu choisis quelle pièce pour survivre à l'invasion ? 😏\n\n💾 Enregistre ce carrousel pour la prochaine fois que ton frigo te fera un sale coup 🧊.\n\n📤 Partage-le à un ami, pour qu'il sache enfin à quoi ressemble ton week-end chez toi 🏠.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#absurde #culturegenerale #curiosites #insolite #ia", "medias": ["medias/2026-10-19/2026-10-22_1400_carro/01.jpg", "medias/2026-10-19/2026-10-22_1400_carro/02.jpg", "medias/2026-10-19/2026-10-22_1400_carro/03.jpg", "medias/2026-10-19/2026-10-22_1400_carro/04.jpg", "medias/2026-10-19/2026-10-22_1400_carro/05.jpg", "medias/2026-10-19/2026-10-22_1400_carro/06.jpg", "medias/2026-10-19/2026-10-22_1400_carro/07.jpg", "medias/2026-10-19/2026-10-22_1400_carro/08.jpg"], "couverture": "medias/2026-10-19/2026-10-22_1400_carro/01.jpg"}, {"id": "2026-10-22_1700_carro", "jour": "jeudi", "date": "2026-10-22", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Ce que tu faisais quand il n'y avait pas internet à la maison", "contenu": {"titre_couverture": "Sans [internet], tu faisais *quoi* exactement ?", "sous_titre": "Les années 85-05, version sans écran connecté", "slides": [{"titre": "[Annuaire] et *patience* infinie", "texte": "Pour trouver un numéro, tu ouvrais les *pages jaunes*, le doigt qui glisse sur les colonnes. Pas de recherche automatique, juste de la *patience* et une bonne mémoire."}, {"titre": "Des *cartes routières* partout", "texte": "Avant les GPS, on dépliait une grande carte sur le capot de la voiture. Les parents se disputaient *la bonne sortie* et on demandait rarement le chemin, par fierté, peut-être."}, {"titre": "Le *répondeur* qui fait foi", "texte": "Ton message laissé sur le répondeur à cassette pouvait être écouté par toute la famille. Rembobiner, réécouter, effacer : un rituel qui, à mon avis, nous manque aujourd'hui."}, {"titre": "Le *walkman* et ses piles", "texte": "Ta cassette préférée, tu l'enregistrais depuis la radio en retenant ton souffle. Un blanc au milieu du morceau et c'était la catastrophe."}], "question_fin": "Lequel de ces gestes t'a le plus *manqué* ?"}, "sujet": "Ce qu'on faisait sans internet à la maison (1985-2005)", "legende": "Sans internet, t'étais déjà un champion de la débrouille 📞\n\nAnnuaires épais, cartes dépliées sur le capot, répondeur à cassette : on faisait tout à la main. Swipe pour retrouver les gestes qui ont disparu.\n\nLes dernières slides parlent d'un rituel d'enregistrement que tu n'as pas oublié 👀\n\nTu as connu quel geste sans écran ? Dis-le en commentaire 👇\n\n💾 Enregistre ce carrousel pour te souvenir de ces gestes un jour où un enfant te demandera « c'était comment avant ? ».\n\n📤 Partage-le à un ami, qu'il découvre à quel point on se débrouillait sans écran à la maison.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #annees2000 #souvenirsdenfance #cultureg", "medias": ["medias/2026-10-19/2026-10-22_1700_carro/01.jpg", "medias/2026-10-19/2026-10-22_1700_carro/02.jpg", "medias/2026-10-19/2026-10-22_1700_carro/03.jpg", "medias/2026-10-19/2026-10-22_1700_carro/04.jpg", "medias/2026-10-19/2026-10-22_1700_carro/05.jpg", "medias/2026-10-19/2026-10-22_1700_carro/06.jpg"], "couverture": "medias/2026-10-19/2026-10-22_1700_carro/01.jpg"}, {"id": "2026-10-22_2000_carro", "jour": "jeudi", "date": "2026-10-22", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Et si les animaux de compagnie avaient la taille d'un immeuble en pleine ville (malaise drôle garanti)", "contenu": {"titre_couverture": "[ÉNORME] : ton *chat* fait la taille d'un immeuble", "sous_titre": "Et si ton animal dominait ta ville ?", "slides": [{"titre": "Le *chien* qui promène les humains", "texte": "Imagine un golden retriever géant qui tire sur sa laisse. Les immeubles suivent, et tes voisins s'accrochent aux balcons. Une promenade qui ne ressemble à rien."}, {"titre": "Le *hamster* qui roule la ville", "texte": "Sa roue tourne à côté de la gare. Chaque tour fait trembler les rails, et on peut se demander si les trains attendent poliment la fin de la course."}, {"titre": "Le *poisson rouge* au bord du lac", "texte": "Il nage dans la rivière du centre-ville. Les ponts lui serviraient presque de rochers, et les touristes prennent des photos depuis les quais."}, {"titre": "Le *perroquet* qui parle au ciel", "texte": "Son perchoir est une tour de bureaux. Il répète les annonces de la mairie, et personne ne sait si c'est une blague ou un ordre."}, {"titre": "La *tortue* qui bouche le tunnel", "texte": "Elle avance à sa vitesse, et traverser la place prendrait sans doute des jours. Les embouteillages deviendraient un nouveau mode de vie."}, {"titre": "Le *lapin* qui saute par-dessus Paris", "texte": "Un seul bond et il franchirait la Seine. Les mairies se demanderaient sûrement s'il faut lui donner une amende ou une carotte."}], "question_fin": "Lequel t'a mis le plus *mal à l'aise* ?"}, "sujet": "Animaux de compagnie grands comme des immeubles en ville", "legende": "Ton animal de compagnie, mais en version gratte-ciel 🐾\n\nImagine ton chien qui tire la ville au bout de sa laisse. Ton hamster qui fait trembler les trains, et une tortue qui bloque le boulevard. Le chaos est presque mignon.\n\nLa dernière slide change tout, et tu ne vas pas aimer ce qu'il se passe dans la rue 👀\n\nQuel animal voudrais-tu voir géant dans ta ville ? 🐶\n\n💾 Enregistre ce carrousel pour pour le retrouver quand tu auras besoin d'une excuse absurde.\n\n📤 Partage-le à un ami, il rira avec toi de la tortue qui bloque la ville.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #animaux", "medias": ["medias/2026-10-19/2026-10-22_2000_carro/01.jpg", "medias/2026-10-19/2026-10-22_2000_carro/02.jpg", "medias/2026-10-19/2026-10-22_2000_carro/03.jpg", "medias/2026-10-19/2026-10-22_2000_carro/04.jpg", "medias/2026-10-19/2026-10-22_2000_carro/05.jpg", "medias/2026-10-19/2026-10-22_2000_carro/06.jpg", "medias/2026-10-19/2026-10-22_2000_carro/07.jpg", "medias/2026-10-19/2026-10-22_2000_carro/08.jpg"], "couverture": "medias/2026-10-19/2026-10-22_2000_carro/01.jpg"}, {"id": "2026-10-22_2100_video", "jour": "jeudi", "date": "2026-10-22", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Salle de bain, cuisine, bureau envahis par l'absurde", "accroche": "Ton [SALON] a un *problème*, et tu ne l'as pas vu", "legende": "Ton salon ne tourne pas rond et tu dors dessus 🛋️👀\n\nQuel objet de ton salon serait le premier à se mettre à flotter ? Dis-le en commentaire 👇\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#culturegenerale #curiosites #salon #absurde #reels", "medias": ["medias/2026-10-19/2026-10-22_2100_video/reel.mp4"], "couverture": "medias/2026-10-19/2026-10-22_2100_video/couverture.jpg", "source": "2026-10-22_1400_carro"}, {"id": "2026-10-23_0800_carro", "jour": "vendredi", "date": "2026-10-23", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Mots français qui viennent d'une autre langue (et pourquoi)", "contenu": {"titre_couverture": "Ces mots français qui ont voyagé avant toi", "sous_titre": "Le français a fait ses valises… et rapporté des souvenirs", "slides": [{"titre": "[Bistrot] venu d'ailleurs", "texte": "Le mot *bistrot* est souvent rattaché au russe « bystro » (vite), mais son origine exacte fait encore débat. Ce qui est sûr : il s'est bien installé dans les cafés parisiens."}, {"titre": "Le *bazar* venu de Perse", "texte": "Le mot *bazar* vient du persan « bāzār », le marché. Il a ensuite pris le sens de désordre. Une idée qui circule : les marchés sont souvent un joyeux chaos."}, {"titre": "[Toubib] et ses racines arabes", "texte": "Le mot *toubib* vient de l'arabe maghrébin « ṭbīb » (médecin). Il est entré dans le français parlé, notamment lors de la période coloniale en Algérie, par les échanges du quotidien."}, {"titre": "Le *caramel* et ses racines", "texte": "Le mot *caramel* est passé par l'espagnol et le portugais, et son origine ultime reste débattue. Une piste évoquée : le latin médiéval, mais les spécialistes ne sont pas tous d'accord."}, {"titre": "Le *yaourt* venu de Turquie", "texte": "Le mot *yaourt* est issu du turc « yoğurt ». Une question qu'on peut se poser : à quel point ce mot a-t-il été adopté avant que le produit ne devienne courant en France ?"}, {"titre": "Le *kiosque* et l'Empire ottoman", "texte": "Le mot *kiosque* vient du turc « köşk », pavillon. Il est entré dans le français au XVIIe siècle et désigne aujourd'hui surtout les petits abris de rue où l'on achète journaux et boissons."}], "question_fin": "Lequel de ces mots t'a le plus *surpris* ?"}, "sujet": "Mots français venus d'autres langues, et pourquoi", "legende": "Ton français a fait le tour du monde sans toi 🌍\n\nBistrot, bazar, yaourt… ces mots sont arrivés en France après un long voyage. On découvre pourquoi ils ont changé de langue et de sens au passage.\n\nLes dernières slides cachent un mot qu'on utilise to
