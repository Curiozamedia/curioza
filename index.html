ro/05.jpg", "medias/2026-10-26/2026-10-26_1100_carro/06.jpg", "medias/2026-10-26/2026-10-26_1100_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-10-26_1100_carro/01.jpg"}, {"id": "2026-10-26_1300_devin", "jour": "lundi", "date": "2026-10-26", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 9 + 9 × 9 − 9 = ?", "reponse": "81 (piège : 153)", "legende": "La réponse n'est pas 153 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-26/2026-10-26_1300_devin/reel.mp4"], "couverture": "medias/2026-10-26/2026-10-26_1300_devin/couverture.jpg"}, {"id": "2026-10-26_1400_carro", "jour": "lundi", "date": "2026-10-26", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Les métiers et commerces qui ont disparu de nos rues", "contenu": {"titre_couverture": "Ces [métiers] qui ont *disparu* de nos rues", "sous_titre": "Ta ville d'avant, version boutiques oubliées", "slides": [{"titre": "Le [rémouleur] ambulant", "texte": "Il passait dans les rues avec sa meule au pied et aiguisait couteaux et ciseaux devant ta porte. Un *service à domicile* bien avant les applis."}, {"titre": "Le *marchand de glace* oublié", "texte": "Avant les réfrigérateurs dans chaque cuisine, on achetait parfois de la glace en bloc chez un marchand qui la coupait à la scie. Un *froid qu'on payait au poids*."}, {"titre": "Le *porteur d'eau* des villages", "texte": "Dans certaines campagnes, l'eau arrivait encore en seaux et en bidons jusqu'à la maison. Une image qui semble venir d'un autre siècle, et pourtant elle n'est pas si lointaine."}, {"titre": "Le *vidéoclub* et ses cassettes", "texte": "Tu choisissais ta cassette dans les rayons, puis tu la rapportais au plus vite, sous peine de payer une pénalité. Une *ritournelle du samedi soir* qu'on regrette, à notre avis."}, {"titre": "Le *cordonnier* de quartier", "texte": "Un talon qui lâche ? On le faisait réparer en quelques minutes plutôt que de le jeter. Le *réparateur* a laissé la place au *jetable*."}, {"titre": "La *cabine téléphonique* du trottoir", "texte": "Pour appeler, il fallait une pièce ou une carte, et parfois patienter dans la file. Un *lieu public* où l'on attendait son tour, sans savoir qui répondrait."}], "question_fin": "Lequel t'a le plus *manqué* en grandissant ?"}, "sujet": "Métiers et commerces disparus de nos rues (1985-2005)", "legende": "Ta rue d'avant avait des commerces que tu ne reverras plus 🛠️\n\nRémouleur, marchand de glace en bloc, vidéoclub, cordonnier : certains métiers ont disparu sans bruit. On les a remplacés par des gestes plus rapides, et peut-être moins humains.\n\nLes deux dernières slides sont celles qui font souvent réagir les plus anciens 👀\n\nQuel commerce de ton enfance te manque le plus ? 💬\n\n💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux les raconter à tes proches.\n\n📤 Partage-le à un ami, qui a grandi avec les mêmes rues et les mêmes boutiques.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #annees2000", "medias": ["medias/2026-10-26/2026-10-26_1400_carro/01.jpg", "medias/2026-10-26/2026-10-26_1400_carro/02.jpg", "medias/2026-10-26/2026-10-26_1400_carro/03.jpg", "medias/2026-10-26/2026-10-26_1400_carro/04.jpg", "medias/2026-10-26/2026-10-26_1400_carro/05.jpg", "medias/2026-10-26/2026-10-26_1400_carro/06.jpg", "medias/2026-10-26/2026-10-26_1400_carro/07.jpg", "medias/2026-10-26/2026-10-26_1400_carro/08.jpg"], "couverture": "medias/2026-10-26/2026-10-26_1400_carro/01.jpg"}, {"id": "2026-10-26_1700_carro", "jour": "lundi", "date": "2026-10-26", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Des objets d'autrefois réinventés en version futuriste absurde", "contenu": {"titre_couverture": "Et si nos vieux objets [revenaient] version *futur absurde* ?", "sous_titre": "Le rétro-futur version délire 🛸", "slides": [{"titre": "Le [grille-pain] à pattes", "texte": "Ton vieux grille-pain pourrait bien décider de *marcher* jusqu'à la table tout seul. Imagine le petit tour de cuisine avant les tartines, et tu comprendras pourquoi on le surveille."}, {"titre": "Le [tourne-disque] volant", "texte": "Et si le tourne-disque des années 70 flottait au-dessus du salon ? Son aiguille danserait toute seule, comme si la *gravité* n'était qu'une suggestion."}, {"titre": "La [cabine] téléphonique hologramme", "texte": "Et si les vieilles cabines rouges ne servaient plus à téléphoner ? Elles projetteraient peut-être un *hologramme* d'un proche qui te demande si tu manges bien."}, {"titre": "La [machine à écrire] quantique", "texte": "Et si ta vieille machine à écrire tapait trois versions de la même phrase en même temps ? Il te suffirait ensuite de choisir *la bonne* plus tard."}], "question_fin": "Lequel de ces objets tu *ressortirais* du grenier en premier ?"}, "sujet": "Objets d'autrefois réinventés en version futuriste absurde", "legende": "Ton grille-pain veut faire une balade 🍞\n\nEt si les objets de nos grands-parents avaient gardé leurs vieux rêves et s'étaient mis au futur ? On a imaginé quatre inventions rétro-futuristes complètement déjantées. Certaines sont sûrement plus *flippantes* que d'autres.\n\nLa dernière slide te fera peut-être douter de ton vieux répondeur 👀\n\nTu garderais quel objet de ton enfance, version robot ou pas ? 🤔\n\n💾 Enregistre ce carrousel pour retrouver ces idées quand tu t'ennuies au grenier.\n\n📤 Partage-le à un ami, il va sûrement vouloir lui aussi brancher son vieux grille-pain 😂.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #absurde #retrofuturisme #insolite", "medias": ["medias/2026-10-26/2026-10-26_1700_carro/01.jpg", "medias/2026-10-26/2026-10-26_1700_carro/02.jpg", "medias/2026-10-26/2026-10-26_1700_carro/03.jpg", "medias/2026-10-26/2026-10-26_1700_carro/04.jpg", "medias/2026-10-26/2026-10-26_1700_carro/05.jpg", "medias/2026-10-26/2026-10-26_1700_carro/06.jpg"], "couverture": "medias/2026-10-26/2026-10-26_1700_carro/01.jpg"}, {"id": "2026-10-26_2000_carro", "jour": "lundi", "date": "2026-10-26", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "vie", "concept": "Les règles de politesse invisibles que tout le monde suit", "contenu": {"titre_couverture": "Les [règles] *invisibles* que tu suis sans le savoir", "sous_titre": "Psychologie du quotidien, version sans leçon de morale", "slides": [{"titre": "L'[ascenseur] du silence", "texte": "Dans un ascenseur, beaucoup de gens fixent les numéros d'étage. Personne ne parle, et personne ne trouve ça bizarre. Ta *règle invisible* vient peut-être de s'activer."}, {"titre": "Le [siège] vide d'abord", "texte": "Dans un train presque vide, on s'assoit rarement juste à côté de quelqu'un. Il faut souvent que le cadre soit *plein* pour que la règle lâche. À mon avis, ton cerveau calcule la distance avant toi."}, {"titre": "Le [pas] de côté", "texte": "Dans un couloir étroit, deux inconnus ralentissent, puis s'écartent du même côté. Souvent, personne ne l'a décidé. C'est une *chorégraphie* sans répétition."}, {"titre": "Le [cadeau] qu'on ne mérite pas", "texte": "Quand quelqu'un dit merci, on répond parfois « de rien » sans y penser. Selon moi, cette réponse est une *règle* sociale qui nous échappe. Un petit mécanisme de réciprocité, peut-être."}, {"titre": "Le [faux] silence au téléphone", "texte": "Au téléphone, on attend souvent que l'autre finisse avant de parler, même sans le voir. Le corps ne sait pas forcément que l'autre est loin. Ton cerveau garde peut-être les *tours de parole* à distance."}, {"titre": "Le [conseil] concret", "texte": "Pour repérer ces règles, observe un seul moment par jour : une porte, une file, un ascenseur. Tu verras la *politesse* sans un mot. Avoue, tu viens de la repérer."}], "question_fin": "Laquelle de ces règles tu *suis* sans jamais y penser ?"}, "sujet": "Règles de politesse invisibles que tout le monde suit", "legende": "Tu respectes des règles que personne n'a écrites 👀\n\nAscenseur, siège vide, couloir, merci : ton cerveau applique peut-être des codes invisibles tous les jours. Swipe pour les repérer et te faire ta propre idée.\n\nLa dernière règle est celle qui te fait le plus réagir dès que tu la remarques 👀\n\nTu en connaissais déjà une ? Dis-le en commentaire 👇\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu remarqueras une règle invisible.\n\n📤 Partage-le à un ami, celui qui te dit toujours « de rien » sans réfléchir.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#psychologie #cerveau #culturegenerale #curiosites #savoirs", "medias": ["medias/2026-10-26/2026-10-26_2000_carro/01.jpg", "medias/2026-10-26/2026-10-26_2000_carro/02.jpg", "medias/2026-10-26/2026-10-26_2000_carro/03.jpg", "medias/2026-10-26/2026-10-26_2000_carro/04.jpg", "medias/2026-10-26/2026-10-26_2000_carro/05.jpg", "medias/2026-10-26/2026-10-26_2000_carro/06.jpg", "medias/2026-10-26/2026-10-26_2000_carro/07.jpg", "medias/2026-10-26/2026-10-26_2000_carro/08.jpg"], "couverture": "medias/2026-10-26/2026-10-26_2000_carro/01.jpg"}, {"id": "2026-10-26_2100_video", "jour": "lundi", "date": "2026-10-26", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Et si une seule règle de la nature changeait", "accroche": "Et si [LE SOLEIL] ne se *couchait* plus jamais ?", "legende": "Imagine un monde où le soleil refuse de dire bonne nuit 🌞\n\nTu préfères vivre dans une journée qui ne finit jamais ou une nuit qui ne finit jamais ? 🤔\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#CultureG #Curiosites #Insolite #Reels #SavaisTuQue", "medias": ["medias/2026-10-26/2026-10-26_2100_video/reel.mp4"], "couverture": "medias/2026-10-26/2026-10-26_2100_video/couverture.jpg", "source": "2026-10-26_0800_carro"}, {"id": "2026-10-27_0800_carro", "jour": "mardi", "date": "2026-10-27", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Des insectes agrandis à taille humaine dans des scènes banales du quotidien (dérangeant-drôle)", "contenu": {"titre_couverture": "Et si les [insectes] redevenaient *géants* dans ta vie de tous les jours ?", "sous_titre": "Dérangeant, mais tellement drôle", "slides": [{"titre": "Le [facteur] à six pattes", "texte": "Imagine un *bourdon* de la taille d'un camion qui livre le courrier sur ton perron. Il ne sonne pas, il *bourdonne* jusqu'à ce que tu ouvres."}, {"titre": "Les *fourmis* font la file", "texte": "Et si des fourmis géantes attendaient calmement à la caisse, chacune avec une miette de pain qu'elle *ne lâcherait jamais* ? Le caissier, lui, aurait sûrement déjà vu pire."}, {"titre": "La [coccinelle] du [réveil]", "texte": "Et si une coccinelle géante s'accrochait à ta fenêtre à 7 h pile ? Pas pour te réveiller : juste pour *compter tes points* avant la journée."}, {"titre": "La *libellule* dans le [métro]", "texte": "Une libellule de la taille d'un homme monte dans la rame, ses yeux géants reflétant tous les voyageurs. Personne ne lève les yeux de son téléphone, *sauf toi*."}], "question_fin": "Laquelle t'a mis le plus *mal à l'aise* ?"}, "sujet": "Insectes géants dans le quotidien banal", "legende": "Imagine ton voisin de palier qui fait 2 mètres de haut et qui a six pattes 🐞\n\nUn bourdon facteur, des fourmis à la caisse du supermarché, une coccinelle qui vient te réveiller : le quotidien devient soudain beaucoup plus bizarre. Swipe pour voir jusqu'où ça peut aller.\n\nLa dernière slide est celle qu'on n'oublie pas dans le métro 👀\n\nTu prends le métro demain ou tu marches à pied ? 🤔\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu vois une mouche collée à la vitre.\n\n📤 Partage-le à un ami, pour qu'il regarde ses plantes d'un autre œil ce soir 🪲.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insectes #absurde #tuSaisQuoi", "medias": ["medias/2026-10-26/2026-10-27_0800_carro/01.jpg", "medias/2026-10-26/2026-10-27_0800_carro/02.jpg", "medias/2026-10-26/2026-10-27_0800_carro/03.jpg", "medias/2026-10-26/2026-10-27_0800_carro/04.jpg", "medias/2026-10-26/2026-10-27_0800_carro/05.jpg", "medias/2026-10-26/2026-10-27_0800_carro/06.jpg"], "couverture": "medias/2026-10-26/2026-10-27_0800_carro/01.jpg"}, {"id": "2026-10-27_1100_carro", "jour": "mardi", "date": "2026-10-27", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "L'origine d'expressions françaises que tu dis tous les jours", "contenu": {"titre_couverture": "Tu dis ça tous les jours, mais tu sais *d'où ça vient* ?", "sous_titre": "Les expressions françaises et leurs origines [folles]", "slides": [{"titre": "[Poser] un lapin, ça vient d'où ?", "texte": "Attendre quelqu'un qui ne vient pas, c'est « poser un lapin ». Une idée souvent citée : au XIXe siècle, des parieurs auraient payé en lapins, *une dette impayée*. Ce n'est qu'une hypothèse, pas une certitude."}, {"titre": "Le *cachot* et ses fameux *dix-sept*", "texte": "Sais-tu que le mot « cachot » est lié à l'idée de cacher ? Et qu'on dit « être dans le pétrin » parce que le pétrin est la cuve où l'on pétrit la pâte : une situation collante et coincée."}, {"titre": "[Mettre] les *pieds dans le plat*", "texte": "Dire ce qu'on ne doit pas dire, c'est mettre les pieds dans le plat. Une origine souvent évoquée : la maladresse à table, *un geste trop brusque*, qui renverse le plat sur la nappe."}, {"titre": "Être *sur les dents*", "texte": "Épuisé et tendu à la fois, on est « sur les dents ». Les dents évoquent la fatigue et la nervosité qui serrent, *un état de tension extrême* que tout le monde a déjà ressenti."}, {"titre": "Un *coup de pied de l'âne*", "texte": "Frapper quelqu'un qui est déjà à terre : c'est le coup de pied de l'âne. La fable de La Fontaine « L'Âne et le Chien » est souvent citée comme source, *une cruauté gratuite* qu'on critique encore aujourd'hui."}], "question_fin": "Laquelle de ces expressions *utilises-tu* sans le savoir ?"}, "sujet": "Origine surprenante d'expressions françaises du quotidien", "legende": "Tu dis ça tous les jours sans savoir d'où ça vient 🤯\n\nOn a pris cinq expressions françaises ultra courantes et on a remonté leur histoire. Certaines viennent peut-être de la boulangerie, d'autres d'une fable de La Fontaine. Tu vas les regarder autrement.\n\nLa dernière expression vient peut-être d'une fable qui n'a rien d'un conte pour enfants 👀\n\nTu connaissais laquelle, toi ? 👇\n\n💾 Enregistre ce carrousel pour tes prochaines discussions autour d'un café 📌.\n\n📤 Partage-le à un ami, celui qui dit « je suis sur les dents » en ce moment 😅.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #expressionsfrancaises #curiosites #anecdotes #francais", "medias": ["medias/2026-10-26/2026-10-27_1100_carro/01.jpg", "medias/2026-10-26/2026-10-27_1100_carro/02.jpg", "medias/2026-10-26/2026-10-27_1100_carro/03.jpg", "medias/2026-10-26/2026-10-27_1100_carro/04.jpg", "medias/2026-10-26/2026-10-27_1100_carro/05.jpg", "medias/2026-10-26/2026-10-27_1100_carro/06.jpg", "medias/2026-10-26/2026-10-27_1100_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-10-27_1100_carro/01.jpg"}, {"id": "2026-10-27_1300_devin", "jour": -26/2026-10-29_1300_devin/couverture.jpg"}, {"id": "2026-10-29_1400_carro", "jour": "jeudi", "date": "2026-10-29", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Les phrases que tous les parents disaient", "contenu": {"titre_couverture": "Ces phrases que [TOUS] nos parents *répétaient* en boucle", "sous_titre": "Spoiler : tu les as entendues au moins une fois", "slides": [{"titre": "La phrase [culte] : *Tu verras quand tu auras mon âge*", "texte": "Une promesse floue qu'on a tous entendue. Personne ne sait vraiment *à quel âge exactement* on comprend enfin pourquoi il fallait manger ses épinards, mais on a tous attendu ce moment."}, {"titre": "Le mythe des *yeux qui restent* collés", "texte": "Tu as sûrement entendu que si tu fais cette grimace, elle va rester. Une menace qu'on ne vérifiait jamais, mais qui semblait très efficace à l'époque."}, {"titre": "Le fameux *Va jouer dehors*", "texte": "Pas de téléphone, pas d'écran : juste un ballon, une rue et des heures devant soi. Selon nous, cette phrase a façonné toute une génération de *bricoleurs de trottoir*."}], "question_fin": "Laquelle t'a le plus *marqué* dans ton enfance ?"}, "sujet": "Phrases de parents que tous les enfants des années 85-05 ont entendues", "legende": "Tu l'as entendue, toi aussi, et tu as juré de ne jamais la dire 😅\n\nOn a tous grandi avec des phrases de parents qui ne voulaient rien dire, mais qui marchaient à tous les coups. Certaines sont des mythes, d'autres des vérités qui ne se comprennent qu'à l'âge adulte.\n\nLa dernière slide est celle qui fait toujours rire les parents 👀\n\nQuelle phrase de ta mère ou de ton père tu répètes aujourd'hui sans t'en rendre compte ? 👇\n\n💾 Enregistre ce carrousel pour retrouver ces phrases le jour où tu les répéteras à ton tour.\n\n📤 Partage-le à un ami, qui va reconnaître sa mère dans la première slide.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #culturegenerale #anneesdoree", "medias": ["medias/2026-10-26/2026-10-29_1400_carro/01.jpg", "medias/2026-10-26/2026-10-29_1400_carro/02.jpg", "medias/2026-10-26/2026-10-29_1400_carro/03.jpg", "medias/2026-10-26/2026-10-29_1400_carro/04.jpg", "medias/2026-10-26/2026-10-29_1400_carro/05.jpg"], "couverture": "medias/2026-10-26/2026-10-29_1400_carro/01.jpg"}, {"id": "2026-10-29_1700_carro", "jour": "jeudi", "date": "2026-10-29", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Et si les animaux de compagnie avaient la taille d'un immeuble en pleine ville (malaise drôle garanti)", "contenu": {"titre_couverture": "Et si ton [chat] faisait la taille d'un *immeuble* ?", "sous_titre": "Bienvenue dans la ville où les croquettes pèsent une tonne", "slides": [{"titre": "Le [facteur] dépose le courrier", "texte": "Ton chien géant attend le facteur sur le toit, la langue pendante. Le facteur, lui, grimpe à l'échelle sans demander son reste. On peut se demander qui a le plus de courage."}, {"titre": "Le *hamster* au parc", "texte": "Un hamster de la taille d'une tour de bureau fait sa roue entre deux immeubles. Les enfants du quartier réclament un *tour de manège* gratuit."}, {"titre": "Le *poisson rouge* en vitrine", "texte": "Un poisson rouge géant nage lentement devant une tour de verre. On imagine sans peine les employés du soixantième étage collés aux fenêtres pour le regarder."}, {"titre": "Le *perroquet* à l'antenne", "texte": "Ton perroquet de vingt étages répète tout ce que disent les voisins. Le problème ? Il pourrait apprendre les *jurons* du bistrot d'en face, en stéréo."}, {"titre": "La *tortue* qui traverse", "texte": "Une tortue géante traverse l'avenue très lentement. Les feux passent au vert, au rouge, puis au vert encore. Et personne ne la *klaxonne*, par respect."}], "question_fin": "Lequel de ces animaux géants te mettrait le plus *mal à l'aise* ?"}, "sujet": "Animaux de compagnie grands comme des immeubles en ville", "legende": "Ton chat fait 12 étages et il a faim 🐈\n\nImagine le facteur qui grimpe pour livrer ton courrier dans la gueule de ton chien géant. Ou le perroquet qui répète les jurons du bistrot d'en face. Swipe, c'est pire à chaque slide.\n\nLa slide 5 va te faire regarder les feux de signalisation autrement 👀\n\nTon animal préféré deviendrait lequel en version immeuble ? 😂\n\n💾 Enregistre ce carrousel pour te souvenir de ce scénario la prochaine fois que ton chat t'ignore.\n\n📤 Partage-le à un ami, il a sûrement un ami qui rêve de devenir une tour 🐕.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #absurde #ia #animaux", "medias": ["medias/2026-10-26/2026-10-29_1700_carro/01.jpg", "medias/2026-10-26/2026-10-29_1700_carro/02.jpg", "medias/2026-10-26/2026-10-29_1700_carro/03.jpg", "medias/2026-10-26/2026-10-29_1700_carro/04.jpg", "medias/2026-10-26/2026-10-29_1700_carro/05.jpg", "medias/2026-10-26/2026-10-29_1700_carro/06.jpg", "medias/2026-10-26/2026-10-29_1700_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-10-29_1700_carro/01.jpg"}, {"id": "2026-10-29_2000_carro", "jour": "jeudi", "date": "2026-10-29", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Mots français qui viennent d'une autre langue (et pourquoi)", "contenu": {"titre_couverture": "Ce mot que tu crois *français* vient d'ailleurs", "sous_titre": "Emprunts surprenants, et pourquoi ils sont là", "slides": [{"titre": "Le [kiosque] vient de très loin", "texte": "Le mot vient du persan *kuchk*, un pavillon de jardin. Il est passé par le turc avant d'arriver en français, au XVIIIe siècle."}, {"titre": "Le *café* a voyagé par l'Italie", "texte": "Le mot est passé par l'italien *caffè*, lui-même issu du turc *kahve*, avec un détour par l'arabe *qahwa*. Une boisson qui a fait le tour de la Méditerranée avant nos tasses."}, {"titre": "Le *bazar* vient de Perse", "texte": "Le mot vi che."}, {"titre": "Ton cœur ne [prend] jamais de pause", "texte": "Il bat en continu, jour et nuit, et pompe le sang sans jamais demander ton avis. Même pendant ton sommeil, il ne s'arrête pas une seconde."}, {"titre": "Ta respiration *change* de rythme seule", "texte": "Quand tu dors, elle ralentit ; quand tu cours, elle s'accélère. Tu n'as rien à décider, ton cerveau ajuste l'air en continu."}], "question_fin": "Lequel de ces mécanismes t'a le plus *surpris* ?"}, "sujet": "Mécanismes du corps qui tournent sans toi", "legende": "Pendant que tu lis cette légende, ton corps bosse déjà sans toi 🫀\n\nTes paupières, ton ventre, ton cœur et ta respiration tournent en permanence sans demander ton avis. Swipe pour découvrir ce qui se passe dans ton dos pendant que tu scrolles.\n\nLa dernière slide change carrément la façon dont tu vois ta respiration 👀\n\nTu savais déjà que ton ventre pouvait réfléchir seul ? 🤔\n\n💾 Enregistre ce carrousel pour relire la liste quand tu te sens fatigué et te rappeler que ton corps fait déjà beaucoup pour toi 🧠.\n\n📤 Partage-le à un ami, il va sûrement mentir en disant qu'il savait déjà tout 😏.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #psychologie #corpshumain #saviezvous", "medias": ["medias/2026-10-26/2026-10-30_1100_carro/01.jpg", "medias/2026-10-26/2026-10-30_1100_carro/02.jpg", "medias/2026-10-26/2026-10-30_1100_carro/03.jpg", "medias/2026-10-26/2026-10-30_1100_carro/04.jpg", "medias/2026-10-26/2026-10-30_1100_carro/05.jpg", "medias/2026-10-26/2026-10-30_1100_carro/06.jpg"], "couverture": "medias/2026-10-26/2026-10-30_1100_carro/01.jpg"}, {"id": "2026-10-30_1300_devin", "jour": "vendredi", "date": "2026-10-30", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 5 + 5 × 5 − 5 = ?", "reponse": "25 (piège : 45)", "legende": "La réponse n'est pas 45 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-26/2026-10-30_1300_devin/reel.mp4"], "couverture": "medias/2026-10-26/2026-10-30_1300_devin/couverture.jpg"}, {"id": "2026-10-30_1400_carro", "jour": "vendredi", "date": "2026-10-30", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Les vacances chez les grands-parents : ce qu'on y faisait", "contenu": {"titre_couverture": "Chez mamie, on vivait [sans écran] avec *des règles bizarres* et des trésors", "sous_titre": "Les vacances chez les grands-parents, version 1985-2005", "slides": [{"titre": "Le [téléphone] du couloir", "texte": "Chez mamie, on tirait sur le *fil* pour appeler un copain, sans savoir qui répondrait. Pas de portable, pas de messages : juste un cordon qui se tortillait."}, {"titre": "Le *grenier* et ses trésors", "texte": "Il fallait aller fouiller le grenier pour s'occuper. Vieux magazines, jouets cassés, cartons de vaisselle : on passait des heures à inventer des histoires."}, {"titre": "Le *goûter* sans compter", "texte": "Mamie gardait des bonbons dans une boîte en fer. On ne demandait pas, on attendait qu'elle ouvre le couvercle. Le tri entre les *bonbons à la menthe* et les caramels mous faisait partie du rituel."}, {"titre": "Les *règles* de la maison", "texte": "Pas de télé avant l'heure du journal, tout le monde à table à midi pile, et on ne partait pas sans avoir aidé à débarrasser. Des lois que personne n'avait écrites, mais que tout le monde suivait."}], "question_fin": "Quel souvenir de chez mamie te rend le plus *nostalgique* ?"}, "sujet": "Vacances chez les grands-parents : ce qu'on y faisait (1985-2005)", "legende": "Tu te souviens de ces vacances chez mamie ? 🏡\n\nPas d'écran, un téléphone à fil, un grenier plein de trésors et une boîte de bonbons qu'on ne touchait pas sans permission. Swipe pour retrouver les règles qu'on suivait sans jamais les discuter.\n\nLa dernière slide est celle que tout le monde a vécue sans jamais la nommer 👀\n\nQuel était ton rituel préféré chez tes grands-parents ? 💬\n\n💾 Enregistre ce carrousel pour te souvenir de ces vacances quand tu voudras replonger dans les années 90 📌.\n\n📤 Partage-le à un ami, celui qui a passé ses étés chez ses grands-parents va replonger direct 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#nostalgie #annees90 #souvenirsdenfance #generation2000 #culturegenerale", "medias": ["medias/2026-10-26/2026-10-30_1400_carro/01.jpg", "medias/2026-10-26/2026-10-30_1400_carro/02.jpg", "medias/2026-10-26/2026-10-30_1400_carro/03.jpg", "medias/2026-10-26/2026-10-30_1400_carro/04.jpg", "medias/2026-10-26/2026-10-30_1400_carro/05.jpg", "medias/2026-10-26/2026-10-30_1400_carro/06.jpg"], "couverture": "medias/2026-10-26/2026-10-30_1400_carro/01.jpg"}, {"id": "2026-10-30_1700_carro", "jour": "vendredi", "date": "2026-10-30", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Des maisons construites dans des endroits impossibles", "contenu": {"titre_couverture": "LA [MAISON] QUI DÉFIE *LA GRAVITÉ* ET TON BON SENS", "sous_titre": "Swipe si tu oses y dormir 🏠", "slides": [{"titre": "UNE MAISON *SUR* UN PILIER", "texte": "Certaines maisons sont posées sur des rochers isolés en mer, accessibles seulement à marée basse. Tu ferais le trajet à pied ou tu préfères la barque ?"}, {"titre": "LA CABANE *DANS* LES ARBRES", "texte": "Dans certaines forêts, des habitations sont construites autour de grands arbres, sans les abattre. Le tronc traverse le salon, littéralement."}, {"titre": "UNE MAISON *SOUS* TERRE", "texte": "Dans la région de Matmata, en Tunisie, de nombreuses habitations sont creusées dans la roche, avec une cour centrale à ciel ouvert. Fraîcheur garantie en plein désert."}, {"titre": "HABITER *LE VIDE* À PIC", "texte": "Au-dessus des falaises, certaines maisons semblent défier la gravité, accrochées à la roche. Une idée folle : et si tu t'endormais face au vide ?"}], "question_fin": "Laquelle de ces maisons te donne le plus [mal au ventre] ?"}, "sujet": "Maisons construites dans des endroits impossibles", "legende": "Ta maison de rêve est peut-être au bord du vide 🏠\n\nUn rocher en pleine mer, un arbre qui traverse le salon, une cour cachée sous terre... Certaines maisons existent vraiment et défient, à notre avis, les règles du bon sens. Swipe pour voir jusqu'où on peut aller.\n\nLa dernière est tellement haute qu'on hésite à regarder en bas 👀\n\nTu dormirais dans laquelle ? Dis-le en commentaire 👇\n\n💾 Enregistre ce carrousel pour le jour où tu veux un logement original.\n\n📤 Partage-le à un ami, celui qui rêve toujours de vivre au bord de l'eau.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #insolite #architecture #maisonsinsolites", "medias": ["medias/2026-10-26/2026-10-30_1700_carro/01.jpg", "medias/2026-10-26/2026-10-30_1700_carro/02.jpg", "medias/2026-10-26/2026-10-30_1700_carro/03.jpg", "medias/2026-10-26/2026-10-30_1700_carro/04.jpg", "medias/2026-10-26/2026-10-30_1700_carro/05.jpg", "medias/2026-10-26/2026-10-30_1700_carro/06.jpg"], "couverture": "medias/2026-10-26/2026-10-30_1700_carro/01.jpg"}, {"id": "2026-10-30_2000_carro", "jour": "vendredi", "date": "2026-10-30", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Traditions françaises et leur vraie origine", "contenu": {"titre_couverture": "Ces traditions françaises ont une [origine] que tu ne soupçonnes pas", "sous_titre": "Spoiler : rien n'est aussi sage que ça en a l'air", "slides": [{"titre": "LE [RÉVEILLON] DE MINUIT", "texte": "Le réveillon n'a pas toujours été une fête de *famille*. Au départ, on veillait surtout pour des raisons religieuses, avant que la table géante ne s'impose au fil des siècles."}, {"titre": "LE POISSON D'*AVRIL*", "texte": "Une idée reçue tenace : la blague du 1er avril viendrait d'un changement de calendrier au XVIe siècle. L'origine exacte reste débattue, et c'est justement ce qui la rend *amusante*."}, {"titre": "LA GALETTE ET LA *FÈVE*", "texte": "Le roi, la fève et la couronne en papier : la tradition des Rois est très ancienne. Autrefois, la fève était un vrai petit objet caché dans la pâtisserie, et le plus jeune désignait les parts."}, {"titre": "LE *MUGUET* DU PREMIER MAI", "texte": "Et si offrir du muguet le 1er mai remontait à une vieille coutume ? On raconte souvent qu'elle est liée à Charles IX au XVIe siècle, mais la source reste discutée. Le brin porte-bonheur s'est ensuite installé dans les habitudes populaires."}, {"titre": "LA *BISE* ET SES RÈGLES", "texte": "Et si le nombre de bises changeait d'une région à l'autre parce que personne ne l'a jamais vraiment décidé ? Cette règle sociale s'est construite au fil du temps, sans mode d'emploi officiel."}, {"titre": "LE [PAIN] BÉNI DU DIMANCHE", "texte": "Le pain béni, offert à la messe, vient sans doute d'une très vieille habitude de partage. Aujourd'hui, la tradition survit surtout dans quelques villages, comme une *mémoire* discrète."}], "question_fin": "Laquelle de ces traditions t'a le plus *surpris* ?"}, "sujet": "Traditions françaises et leur vraie origine", "legende": "Tu fais ces traditions depuis toujours, mais tu connais vraiment leur histoire ? 🤔\n\nRéveillon, galette, muguet, bises : on les pratique sans réfléchir. Certaines origines sont claires, d'autres beaucoup moins, et c'est là que ça devient intéressant.\n\nLes dernières slides parlent d'une habitude que tu fais sûrement chaque semaine 👀\n\nTu connaissais l'origine de laquelle ? 👇\n\n💾 Enregistre ce carrousel pour la prochaine milieu des montagnes ?", "sous_titre": "Culture G & curiosités : version XXL", "slides": [{"titre": "Une *pomme* [géante] sur la falaise", "texte": "Imagine une pomme de la taille d'un bus, plantée au bord d'une falaise bretonne. Et si les mouettes faisaient la queue pour la grignoter ?"}, {"titre": "Un *fromage* [géant] dans le désert", "texte": "Une meule de fromage posée au milieu des dunes, qui fondrait doucement sous le soleil. Les fourmis du coin auraient sûrement beaucoup de chance."}, {"titre": "Des *cerises* [géantes] sur un lac", "texte": "Une grappe de cerises flotterait sur un lac de montagne, comme si quelqu'un avait oublié son goûter. Les canards n'oseraient sans doute pas s'approcher."}, {"titre": "Un *citron* [géant] au sommet", "texte": "Un citron aussi haut qu'un immeuble trônerait sur un plateau volcanique. Et si les nuages qui passent prenaient une teinte jaune ?"}, {"titre": "Un *burger* [géant] dans la forêt", "texte": "Un hamburger de la taille d'une maison poserait ses valises entre les sapins. Les écureuils auraient peut-être déjà installé leur campement dessus."}], "question_fin": "Lequel de ces aliments géants te donnerait le plus *envie* de partir en randonnée ?"}, "sujet": "Aliments géants posés dans des paysages naturels", "legende": "Imagine un croissant de la taille d'un pré 🥐\n\nOn a imaginé des aliments XXL au milieu de falaises, de dunes et de forêts. Certains ont l'air appétissants, d'autres beaucoup moins. Swipe pour voir où la nature pourrait bien faire son goûter.\n\nLa dernière slide est celle qui va te donner faim… ou peur 👀\n\nTu aurais fait quoi face à une pomme géante au bord de la falaise ? 🍎\n\n💾 Enregistre ce carrousel pour retrouver ce carrousel le jour où tu voudras une idée de décor absurde.\n\n📤 Partage-le à un ami, il rira avec toi en voyant le burger dans la forêt 🍔.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#cultureG #curiosites #insolite #absurde #aliments", "medias": ["medias/20  forme", "legende": "Tu utilises ces objets tous les jours sans jamais te demander pourquoi ils ont cette tête-là 🤔\n\nGoulot, tête de clou, poignée ronde, trous de passoire : chaque forme semble avoir une bonne raison. Certaines sont plus malignes qu'elles n'en ont l'air.\n\nEt le dernier crayon de ta trousse cache peut-être une astuce que tu n'as jamais remarquée 👀\n\nQuel objet de ta cuisine ou de ta trousse tu n'avais jamais regardé de près ? 👇\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu tiens un objet banal entre les mains.\n\n📤 Partage-le à un ami, celui qui regarde toujours la forme de ses objets sans jamais rien dire.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #anecdotes #saviezvous #design", "medias": ["medias/2026-10-26/2026-10-31_1100_carro/01.jpg", "medias/2026-10-26/2026-10-31_1100_carro/02.jpg", "medias/2026-10-26/2026-10-31_1100_carro/03.jpg", "medias/2026-10-26/2026-10-31_1100_carro/04.jpg", "medias/2026-10-26/2026-10-31_1100_carro/05.jpg", "medias/2026-10-26/2026-10-31_1100_carro/06.jpg", "medias/2026-10-26/2026-10-31_1100_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-10-31_1100_carro/01.jpg"}, {"id": "2026-10-31_1300_devin", "jour": "samedi", "date": "2026-10-31", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 6 + 6 × 6 − 6 = ?", "reponse": "36 (piège : 66)", "legende": "La réponse n'est pas 66 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-26/2026-10-31_1300_devin/reel.mp4"], "couverture": "medias/2026-10-26/2026-10-31_1300_devin/couverture.jpg"}, {"id": "2026-10-31_1400_carro", "jour": "samedi", "date": "2026-10-31", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "pays", "concept": "Le duel : les transports du quotidien", "contenu": {"titre_couverture": "LE DUEL : [VÉLO] *contre* LE MÉTRO, qui gagne ?", "sous_titre": "France vs Pays-Bas, les transports du quotidien", "slides": [{"titre": "[DOUBLE] *voies* cyclables", "texte": "Aux Pays-Bas, beaucoup de villes proposent de larges pistes cyclables séparées des voitures. Et si le vélo y ressemblait davantage à un vrai mode de transport qu'à un loisir du dimanche ?"}, {"titre": "Le *vélo* sous la *pluie*", "texte": "Aux Pays-Bas, on pédale aussi sous la pluie, parapluie accroché au guidon. En France, on attend le tram en espérant que le ciel se calme. Un test de caractère, non ?"}, {"titre": "Le *train* et ses *vélos*", "texte": "Dans beaucoup de gares néerlandaises, de grands parkings à vélos s'étendent sur plusieurs étages. Une idée simple qui pourrait changer tout le trajet du matin."}, {"titre": "Ton *trajet* en *question*", "texte": "Et si la meilleure façon de se déplacer était celle qui te fait arriver détendu ? Métro, vélo ou train : à toi de trancher."}], "question_fin": "Lequel de ces trajets te paraît le plus *absurde* ou le plus *malin* ?"}, "sujet": "Le duel France vs Pays-Bas : les transports du quotidien", "legende": "Le duel est lancé, qui gagne sur les transports ? 🚲\n\nEntre pistes cyclables XXL, vélo sous la pluie et parkings à vélos de gare, le match est plus serré qu'on ne croit. Swipe pour voir le verdict.\n\nLe dernier duel va te faire regarder ton trajet du matin autrement 👀\n\nTu prendrais ton vélo ou ton métro ce matin ? 🤔\n\n💾 Enregistre ce carrousel pour les idées de trajets à tester ou à faire découvrir.\n\n📤 Partage-le à un ami, à celui qui râle toujours dans les transports en commun 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosi ce qui confirme ce que tu penses déjà. Le contraire, tu le survoles. Ton fil d'actu adore ça."}, {"titre": "Le conseil : *ralentis* deux secondes", "texte": "Avant de décider vite, pose-toi une question : et si le premier avis était faux ? À mon avis, deux secondes suffisent souvent à casser le pilote automatique."}], "question_fin": "Lequel de ces biais t'a le plus *piégé* cette semaine ?"}, "sujet": "Biais cognitifs qui te piègent chaque jour", "legende": "Ton cerveau triche, et tu ne t'en rends jamais compte 🧠\n\nCinq biais qui décident à ta place : la fin d'un film, les prix barrés, les infos qui confirment ce que tu crois déjà. Swipe pour les repérer chez toi.\n\nLa dernière slide contient un conseil simple que presque personne n'applique 👀\n\nTu t'es reconnu dans lequel ? Dis-le en commentaire 👇\n\n💾 Enregistre ce carrousel pour les revoir la prochaine fois que tu achètes quelque chose en solde.\n\n📤 Partage-le à un ami, il risque de se reconnaître dans au moins deux exemples.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#psychologie #cerveau #biaiscognitifs #culturegenerale #curiosites", "medias": ["medias/2026-10-26/2026-11-01_0800_carro/01.jpg", "medias/2026-10-26/2026-11-01_0800_carro/02.jpg", "medias/2026-10-26/2026-11-01_0800_carro/03.jpg", "medias/2026-10-26/2026-11-01_0800_carro/04.jpg", "medias/2026-10-26/2026-11-01_0800_carro/05.jpg", "medias/2026-10-26/2026-11-01_0800_carro/06.jpg", "medias/2026-10-26/2026-11-01_0800_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-11-01_0800_carro/01.jpg"}, {"id": "2026-11-01_1100_carro", "jour": "dimanche", "date": "2026-11-01", "heure": "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Des paysages célèbres reconstruits en nourriture, à taille réelle", "contenu": {"titre_couverture": "Et si on pouvait [croquer] les *paysages* du monde ?", "sous_titre": "Des décors imaginaires, version garde-manger", "slides": [{"titre": "Une [montagne] de f imanche", "date": "2026-11-01", "heure": "13:00", "type": "reel_devinette", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance rythmé ou suspense (type « phonk », « slowed », compte à rebours) — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "devinette", "sujet": "Devinette : 6 + 6 × 6 − 6 = ?", "reponse": "36 (piège : 66)", "legende": "La réponse n'est pas 66 ! 🥴\n\nPrends 5 secondes, calcule de tête… et écris ta réponse en commentaire 👇\n\n📤 Envoie-la à ton pote qui se croit fort en calcul.\n\n👉 Abonne-toi à @curiozamedia pour le défi de demain !\n\n#defi #calculmental #enigme #casse-tete #culturegenerale", "medias": ["medias/2026-10-26/2026-11-01_1300_devin/reel.mp4"], "couverture": "medias/2026-10-26/2026-11-01_1300_devin/couverture.jpg"}, {"id": "2026-11-01_1400_carro", "jour": "dimanche", "date": "2026-11-01", "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "vie", "concept": "Petites habitudes qui changent une journée (avec explication simple)", "contenu": {"titre_couverture": "Ta journée tient à [trois] petits gestes *minuscules*", "sous_titre": "Le cerveau adore les rituels, et ça peut jouer pour ou contre toi", "slides": [{"titre": "Le [premier] geste compte", "texte": "Boire un verre d'eau au réveil est une habitude simple. Elle *signale* au corps que la journée commence. Beaucoup de gens sautent cette étape sans y penser."}, {"titre": "Le *cerveau* aime les rails", "texte": "Quand un geste se répète au même moment, il demande moins d'effort. C'est l'idée de l'habitude : ton cerveau *économise* ton énergie en automatisant ce qui revient chaque jour."}, {"titre": "Ranger *ses affaires* la veille", "texte": "Préparer ses clés, son sac ou ses vêtements la veille réduit les décisions du matin. Moins de choix à faire, c'est peut-être une matinée moins *chaotique*. C'est en tout cas l'idée que je trouve convaincante."}, {"titre": "Le petit *pas* qui décide", "texte": "Un objectif géant effraie. Une action minuscule, comme ouvrir son livre à une seule page, passe souvent mieux. Une fois le premier geste fait, il est plus facile de continuer."}, {"titre": "Ta *lumière* règle ton humeur", "texte": "Sortir quelques minutes à la lumière du jour au réveil peut aider le corps à caler son horloge interne. Une habitude banale qui peut *changer* ton énergie de l'après-midi, à tester."}, {"titre": "Le [mot] que tu te répètes", "texte": "Ce que tu te dis le matin en te regardant dans le miroir compte, selon moi. Les petites phrases répétées, positives ou négatives, peuvent devenir des *scripts* que ton cerveau finit par croire."}], "question_fin": "Laquelle de ces habitudes tu *tiens* déjà, et laquelle tu vas *tester* demain ?"}, "sujet": "Petites habitudes qui changent une journée, expliquées simplement", "legende": "Ta journée se joue peut-être dans les 5 premières minutes 🌅\n\nUn verre d'eau, des affaires prêtes la veille, un petit pas minuscule : ces gestes simples peuvent changer le ton de toute ta journée. Le cerveau aime les routines, à toi de choisir les bonnes.\n\nEt la dernière habitude est la plus surprenante, celle que tu fais sans y penser 👀\n\nQuelle petite habitude a déjà changé ta journée ? 👇\n\n💾 Enregistre ce carrousel pour retrouver ces idées le matin où tu manques d'élan.\n\n📤 Partage-le à un ami, à quelqu'un qui se lève toujours en retard et a besoin d'un coup de pouce.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#psychologie #cerveau #habitudes #developpementpersonnel #culturegenerale", "medias": ["medias/2026-10-26/2026-11-01_1400_carro/01.jpg", "medias/2026-10-26/2026-11-01_1400_carro/02.jpg", "medias/2026-10-26/2026-11-01_1400_carro/03.jpg", "medias/2026-10-26/2026-11-01_1400_carro/04.jpg", "medias/2026-10-26/2026-11-01_1400_carro/05.jpg", "medias/2026-10-26/2026-11-01_1400_carro/06.jpg", "medias/2026-10-26/2026-11-01_1400_carro/07.jpg", "medias/2026-10-26/2026-11-01_1400_carro/08.jpg"], "couverture": "medias/2026-10-26/2026-11-01_1400_carro/01.jpg"}, {"id": "2026-11-01_1700_carro", "jour": "dimanche", "date": "2026-11-01", "heure": "17:00", "type": "carrousel", "statut": "a_valider", "categorie": "pays", "concept": "Le duel : le supermarché", "contenu": {"titre_couverture": "LE DUEL FRANCE VS MAROC : [CADDIE] ET *FILE D'ATTENTE* AU SUPERMARCHÉ", "sous_titre": "Qui fait ses courses comme un champion ?", "slides": [{"titre": "LE *CHARIOT* OU LE PANIER ?", "texte": "Chez nous, on attrape parfois un grand chariot pour trois yaourts. Au Maroc, beaucoup préfèrent le panier au bras. Et si le plus malin était celui qui porte le moins ?"}, {"titre": "LE *MARCHÉ* CONTRE LE RAYON", "texte": "Chez nous, beaucoup de produits sont emballés et alignés en rayon. Dans de nombreuses villes marocaines, on fait encore ses courses au marché de quartier, entre les étals et les vendeurs qui vantent leurs fruits."}, {"titre": "LA *CAISSE* QUI TE FAIT PATIENTER", "texte": "Le tapis roulant, le sac à remplir et la petite attente : le rituel de la caisse varie d'un pays à l'autre. Et si on comparait les habitudes plutôt que de juger ?"}, {"titre": "LE *PAIN* DU QUOTIDIEN", "texte": "Chez nous, la baguette se prend souvent en passant, fraîche du matin. Au Maroc, le pain rond et les galettes se partagent aussi au quotidien, souvent tout juste sortis du four."}, {"titre": "LES *PRIX* À L'ÉTIQUETTE", "texte": "Ici, on compare les prix au gramme près avec son téléphone. Là-bas, on négocie parfois au marché. Deux façons de dire : le juste prix, c'est peut-être celui qu'on discute."}, {"titre": "LE *SAC* QUI VOYAGE", "texte": "Le sac réutilisable se glisse dans la poche ou le cabas. Au Maroc, le couffin en osier accompagne depuis longtemps les courses familiales. Deux idées, une même envie : moins de déchets."}], "question_fin": "Lequel de ces rituels de courses te donne le plus *envie* de changer ?"}, "sujet": "Le duel France vs Maroc : le supermarché", "legende": "Caddie ou panier, lequel gagne ton duel ? 🛒\n\nLe supermarché dit beaucoup de nos habitudes : chariot géant contre panier au bras, rayons alignés contre marché animé. On compare sans se moquer, juste pour rire et apprendre.\n\nDans la dernière slide, on parle d'un sac qui change tout 👀\n\nTu fais tes courses plutôt rayon ou marché ? 🤔\n\n💾 Enregistre ce carrousel pour la prochaine fois que tu passes en caisse.\n\n📤 Partage-le à un ami, pour voir qui tient le meilleur panier de la bande 😄.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #france #maroc #supermarche", "medias": ["medias/2026-10-26/2026-11-01_1700_carro/01.jpg", "medias/2026-10-26/2026-11-01_1700_carro/02.jpg", "medias/2026-10-26/2026-11-01_1700_carro/03.jpg", "medias/2026-10-26/2026-11-01_1700_carro/04.jpg", "medias/2026-10-26/2026-11-01_1700_carro/05.jpg", "medias/2026-10-26/2026-11-01_1700_carro/06.jpg", "medias/2026-10-26/2026-11-01_1700_carro/07.jpg", "medias/2026-10-26/2026-11-01_1700_carro/08.jpg"], "couverture": "medias/2026-10-26/2026-11-01_1700_carro/01.jpg"}, {"id": "2026-11-01_2000_carro", "jour": "dimanche", "date": "2026-11-01", "heure": "20:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Et si la gravité s'inversait une minute dans des lieux du quotidien", "contenu": {"titre_couverture": "ET SI LA [GRAVITÉ] S'INVERSAIT *une minute* chez toi ?", "sous_titre": "Une minute, tout tombe vers le ciel. Accroche-toi.", "slides": [{"titre": "La [BOULANGERIE] à l'envers", "texte": "Les *baguettes* s'envolent du présentoir et la caissière regarde le plafond. Le pain, lui, n'a jamais été aussi léger."}, {"titre": "Le [CAFÉ] qui *remonte*", "texte": "Ton expresso quitte la tasse en une goutte parfaite qui file vers le plafond. Idéal pour boire sans lever le coude... enfin, presque."}, {"titre": "Les [PIGEONS] en *panique* inversée", "texte": "Dehors, les pigeons flottent au-dessus des trottoirs pendant que les parapluies tombent vers le ciel. Une vision de ville qui se moque de nous."}, {"titre": "Le [PIANO] sans *pesanteur*", "texte": "Dans un salon, les partitions s'envolent et le tabouret reste collé au plafond. Question : qui va rattraper la musique ?"}, {"titre": "Le [MÉTRO] à *contre-sens*", "texte": "Sur le quai, les sacs, les journaux et les pièces de monnaie remontent vers la voûte. Une minute, et la station devient un aquarium d'air."}], "question_fin": "Dans quel lieu tu *flipperais* le plus pendant cette minute ?"}, "sujet": "Et si la gravité s'inversait une minute dans le quotidien", "legende": "Et si la gravité décidait de faire demi-tour pendant 60 secondes ? 🙃\n\nLe pain, le café, le piano et même le métro : tout le quotidien se met à monter vers le plafond. Une minute suffit pour tout bouleverser.\n\nLa dernière slide va te faire regarder ton plafond autrement 👀\n\nTu commences par quoi, toi, quand tout se met à flotter ? 😄\n\n💾 Enregistre ce carrousel pour relire le scénario la prochaine fois que tu manques de sujet de conversation.\n\n📤 Partage-le à un ami, il va sûrement vouloir tester ça dans sa cuisine 🙃.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #insolite #absurde #gravite", "medias": ["medias/2026-10-26/2026-11-01_2000_carro/01.jpg", "medias/2026-10-26/2026-11-01_2000_carro/02.jpg", "medias/2026-10-26/2026-11-01_2000_carro/03.jpg", "medias/2026-10-26/2026-11-01_2000_carro/04.jpg", "medias/2026-10-26/2026-11-01_2000_carro/05.jpg", "medias/2026-10-26/2026-11-01_2000_carro/06.jpg", "medias/2026-10-26/2026-11-01_2000_carro/07.jpg"], "couverture": "medias/2026-10-26/2026-11-01_2000_carro/01.jpg"}, {"id": "2026-11-01_2100_video", "jour": "dimanche", "date": "2026-11-01", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "ab  lieux français les plus improbables."}, {"titre": "Le [pont] qui se lève pour les bateaux", "texte": "Certains ponts français ont été conçus pour s'ouvrir, pivoter ou se lever afin de laisser passer les bateaux. Le savoir-faire des ingénieurs de l'époque reste impressionnant."}, {"titre": "Une *grotte* qui a gardé son secret", "texte": "Plusieurs grottes françaises ont été découvertes par hasard, parfois par des enfants ou des bergers. Certaines abritent des peintures très anciennes, qui fascinent encore les chercheurs."}, {"titre": "Le village qui *change* de nom", "texte": "Certaines communes françaises ont changé de nom au fil de l'histoire. Pourquoi ? Une idée à vérifier localement. Dans le doute, cherche la mairie !"}], "question_fin": "Quel lieu de France t'a le plus *surpris* ?"}, "sujet": "Lieux de France aux histoires étonnantes, angle inédit", "legende": "Tu croyais connaître la France ? Pas si sûr 🗺️\n\nDes îles qui n'en sont plus, des grottes trouvées par hasard, des ponts qui se lèvent pour les bateaux. La France regorge d'histoires que personne ne raconte vraiment à l'école.\n\nLe dernier lieu est celui qu'on traverse sans le voir... 👀\n\nTu connaissais lequel de ces lieux, toi ? 🤔\n\n💾 Enregistre ce carrousel pour retrouver ces lieux le jour où tu prépares un week-end.\n\n📤 Partage-le à un ami, celui qui rêve de voyager sans quitter son canapé.\n\n👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !\n\n#culturegenerale #curiosites #histoiredefrance #insolite #patrimoine", "medias": ["medias/2026-11-02/2026-11-02_1100_carro/01.jpg", "medias/2026-11-02/2026-11-02_1100_carro/02.jpg", "medias/2026-11-02/2026-11-02_1100_carro/03.jpg", "medias/2026-11-02/2026-11-02_1100_carro/04.jpg", "medias/2026-11-02/2026-11-02_1100_carro/05.jpg", "medias/2026-11-02/2026-11-02_1100_carro/06.jpg", "medias/2026-11-02/2026-11-02_1100_carro/07.jpg"], "couverture": "medias/2026-11-02/2026-11-02_1100_carro/01.jpg"}, {"id": "2026-11-02_1300_devin", "jour": "lun "heure": "14:00", "type": "carrousel", "statut": "a_valider", "categorie": "absurde", "concept": "Des animaux qui exercent un vrai métier humain avec sérieux (un métier par slide)", "contenu": {"titre_couverture": "Des [animaux] au *boulot* : ils bossent vraiment", "sous_titre": "Six métiers trop sérieux pour être vrais", "slides": [{"titre": "[Pigeon] facteur, tournée du matin", "texte": "Pendant la Seconde Guerre mondiale, des *pigeons voyageurs* ont transporté des messages. Leur sens de l'orientation en faisait déjà de bons concurrents des GPS, à leur façon."}, {"titre": "Le *chien* sauveteur des Alpes", "texte": "Les chiens du Saint-Bernard ont la réputation d'avoir secouru des voyageurs en montagne, même si cette légende est plus romancée que documentée. Leur flair et leur endurance restent impressionnants."}, {"titre": "Le *dauphin* qui garde la mer", "texte": "Des dauphins ont été entraînés par la marine américaine pour repérer des objets sous l'eau. À notre avis, ce sont de sacrés *coéquipiers*, même s'ils ne touchent ni salaire ni pause café."}, {"titre": "L'*abeille* contrôleuse qualité", "texte": "Les abeilles repèrent vite une fleur riche en nectar. Des chercheurs étudient aussi leur odorat pour détecter certaines substances, une piste qui reste à confirmer."}, {"titre": "Le *rat* déminateur", "texte": "En Afrique, des rats géants sont entraînés à flairer des mines antipersonnel. Légers, ils peuvent *inspecter* un terrain bien plus vite qu'une équipe à pied, et sans risque pour eux."}, {"titre": "Le *chat* chef d'orchestre", "texte": "Dans l'imaginaire populaire, les chats font juste la sieste. Pourtant, un chat qui trône sur un pupitre, ça aurait de la gueule pour un *concert* de jazz."}], "question_fin": "Quel métier animal te paraît le plus *crédible* ?"}, "sujet": "Animaux exerçant de vrais métiers humains avec sérieux", "legende": "Ils bossent plus sérieusement que toi 🐾\n\nPigeons facteurs, chiens sauveteurs, dauphins coéquipiers : certains animaux ": ["medias/2026-11-02/2026-11-04_2000_carro/01.jpg", "medias/2026-11-02/2026-11-04_2000_carro/02.jpg", "medias/2026-11-02/2026-11-04_2000_carro/03.jpg", "medias/2026-11-02/2026-11-04_2000_carro/04.jpg", "medias/2026-11-02/2026-11-04_2000_carro/05.jpg", "medias/2026-11-02/2026-11-04_2000_carro/06.jpg", "medias/2026-11-02/2026-11-04_2000_carro/07.jpg"], "couverture": "medias/2026-11-02/2026-11-04_2000_carro/01.jpg"}, {"id": "2026-11-04_2100_video", "jour": "mercredi", "date": "2026-11-04", "heure": "21:00", "type": "reel_video", "statut": "a_valider", "publication": "manuelle", "son_conseille": "son tendance drôle ou décalé, ou un « slowed » mystérieux — dans l'app : choisis un son marqué d'une flèche ↗ (tendance)", "categorie": "absurde", "sujet": "Vidéo IA : Animaux exerçant de vrais métiers humains avec sérieux", "accroche": "Le [PIGEON] qui fait *la tournée* du matin", "legende": "Un facteur à plumes qui ne rate jamais sa tournée 🐦📬\n\nQuel animal te paraît le plus crédible dans son métier, et lequel tu engagerais demain ? 👇\n\n👉 Abonne-toi à @curiozamedia pour ta dose de curiosités chaque jour.\n\n#cultureG #curiosites #animauxdrôles #insolite #iamart", "medias": ["medias/2026-11-02/2026-11-04_2100_video/reel.mp4"], "couverture": "medias/2026-11-02/2026-11-04_2100_video/couverture.jpg", "source": "2026-11-04_1400_carro"}, {"id": "2026-11-05_0800_carro", "jour": "jeudi", "date": "2026-11-05", "heure": "08:00", "type": "carrousel", "statut": "a_valider", "categorie": "nostalgie", "concept": "Les vacances chez les grands-parents : ce qu'on y faisait", "contenu": {"titre_couverture": "Les [vacances] chez mamie : ce qu'on *faisait* sans rien dire", "sous_titre": "Spécial génération 85-05", "slides": [{"titre": "Le [goûter] du jeudi", "texte": "Pain, *beurre* et sucre en poudre, mangés debout dans le jardin. Pas d'écran, juste le bourdonnement des guêpes et l'odeur de la lessive."}, {"titre": "Le *tiroir* à bazar", "texte": "Piles usées, ficelles, boutons, vieux stylo "11:00", "type": "carrousel", "statut": "a_valider", "categorie": "anecdote", "concept": "Pourquoi les objets du quotidien ont cette forme (vraies raisons)", "contenu": {"titre_couverture": "Pourquoi ton [quotidien] a cette *forme* bizarre ?", "sous_titre": "Les raisons derrière ces formes, sans blabla", "slides": [{"titre": "Le [bouchon] de la bouteille", "texte": "Le bouchon en liège est souple et étanche : il se compresse dans le goulot et bloque le vin. Une forme pensée pour boucher, sans fuite."}, {"titre": "Les *trous* de la passoire", "texte": "Les trous d'une passoire ne sont pas décoratifs : ils laissent passer l'eau et retiennent les pâtes. Une forme simple pour une fonction précise."}, {"titre": "La [poignée] de la tasse", "texte": "La poignée est pensée pour un corps humain qui boit chaud : on la saisit sans se brûler les doigts. Le design suit le corps, et non l'inverse."}, {"titre": "Le *bec* de la théière", "texte": "Le bec est placé plus haut que le fond de la théière. Le niveau du liquide reste donc à l'intérieur, et le thé ne coule pas partout."}, {"titre": "Les [dents] du zip", "texte": "Les dents d'une fermeture éclair s'emboîtent une à une. Un système pensé pour fermer vite et solidement, avec des rangées bien alignées."}, {"titre": "Le *fil* de la prise électrique", "texte": "Selon nous, la forme des broches sert surtout à éviter les mauvais branchements. Une hypothèse de design qui mérite d'être regardée de près."}], "question_fin": "Lequel t'a le plus *surpris* ?"}, "sujet": "Pourquoi les objets du quotidien ont cette forme (vraies raisons)", "legende": "Tu utilises ces objets tous les jours sans jamais te demander pourquoi ils ont cette forme 🤔\n\nUn bouchon, une passoire, une poignée de tasse : chaque forme cache une raison. Certaines sont évidentes, d'autres te surprendront.\n\nLe dernier objet paraît anodin, mais sa forme pourrait bien cacher une histoire de sécurité 👀\n\nTu connaissais lequel de ces objets ? 👇\n\n💾 Enregistre ce carrouse
