  concept: Les petites choses que ton cerveau fait pour te protéger sans te prévenir
  contenu:
    titre_couverture: Ton [cerveau] fait des *trucs* dans ton dos
    sous_titre: Les petites protections que tu ne vois jamais venir
    slides:
    - titre: Le [filtre] du regard
      texte: 'Ton cerveau *zappe* une grande partie de ce que tes yeux captent. Tu ne vois pas le monde en entier
        : il trie en silence ce qui mérite ton attention.'
    - titre: Le *réflexe* du mauvais souvenir
      texte: D'après une idée souvent évoquée en psychologie, ton cerveau accorde parfois plus de poids aux mauvais
        moments qu'aux bons. Une remarque vexante peut donc te coller à la peau plus longtemps qu'un compliment.
    - titre: Le *pilote* automatique
      texte: Sur un trajet que tu connais par cœur, tu fermes la porte et tournes la clé sans y penser. Ton cerveau
        économise son énergie, et tu oublies parfois la moitié du trajet.
    - titre: Le [refus] de l'inconnu
      texte: Face à une situation nouvelle, ton cerveau a tendance à préférer le connu, même quand il est moins
        bon. On peut y voir une façon de fuir l'incertitude plus que de chercher le confort.
    - titre: L'alarme *qui se tait*
      texte: Ton cerveau finit par ignorer un bruit répété, comme le ronronnement du frigo ou de la clim. C'est
        pratique, mais il peut aussi filtrer un vrai signal d'alerte.
    - titre: Le *faux* souvenir du passé
      texte: Ta mémoire reconstruit en partie les souvenirs à chaque fois que tu les rappelles. Ce qui te semble
        sûr peut donc être légèrement réécrit, sans que tu t'en rendes compte.
    question_fin: Lequel de ces mécanismes t'a le plus *surpris* ?
  sujet: Mécanismes de protection automatiques de ton cerveau, expliqués simplement
  legende: 'Ton cerveau bosse dans ton dos, et tu ne t''en rends jamais compte 🧠


    Il trie ce que tu vois, accorde parfois plus de poids au négatif, pilote tes gestes et peut réécrire tes souvenirs.
    Six petits mécanismes que tu vas reconnaître tout de suite.


    La dernière slide touche à ta mémoire, et c''est là que ça devient vraiment troublant 👀


    Tu as déjà remarqué un de ces réflexes chez toi ? Dis-le en commentaire 💬


    💾 Enregistre ce carrousel pour pour relire ces mécanismes quand tu te sens bloqué 📌.


    📤 Partage-le à un ami, parce que ton pote fait sûrement exactement le même pilote automatique 😅.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


