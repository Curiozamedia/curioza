  concept: Les règles de la cour de récré que tout le monde connaissait
  contenu:
    titre_couverture: Les [règles] que personne ne t'a jamais écrites à la *récré*
    sous_titre: Les lois secrètes de la cour, version années 90-2000
    slides:
    - titre: Le [ballon] appartient à celui qui l'a apporté
      texte: Tu le ramènes, tu fais les règles. Et si tu perdais le ballon en plein match, tu devenais l'arbitre
        de ta propre punition, jusqu'au prochain goûter.
    - titre: Le *pacte* du chewing-gum partagé
      texte: À l'école, on avait l'impression qu'un chewing-gum se coupait en deux, parfois en trois, et que refuser
        la moitié te mettait direct sur la liste noire. Selon nous, c'était une loi tacite plus stricte qu'un règlement.
    - titre: Le *coin* réservé aux anciens
      texte: Sur le mur du préau, certains espaces semblaient invisibles mais sacrés. Les plus grands décidaient,
        dans les souvenirs de beaucoup, qui pouvait s'asseoir, sans jamais l'expliquer.
    - titre: La *dernière* place au ballon
      texte: 'Le jeu de l''élastique ou du foot, tout se réglait en une phrase : premier arrivé, premier servi.
        Et tant pis pour ceux qui arrivaient en retard.'
    - titre: Le *silence* après la sonnerie
      texte: Quand la cloche sonnait, il fallait se mettre en rang sans un mot. Une règle absurde, qu'on suivait
        presque tous sans jamais la discuter.
    question_fin: Laquelle de ces règles tu appliquais *sans jamais* te poser de question ?
  sujet: Règles non écrites de la cour de récré des années 90-2000
  legende: 'Personne ne t''a jamais expliqué ces règles, pourtant tu les connaissais toutes 🏫


    Le ballon, le chewing-gum, le coin du préau : la cour avait sa propre justice, sans écrit ni prof. Swipe pour
    retrouver les lois secrètes de ta récré.


    La dernière règle est celle qui faisait pleurer tout le monde, et elle arrive en fin de carrousel 👀


    Quelle règle de récré tu respectais encore sans la comprendre ? 💬


    💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux raconter ta récré à tes enfants.


    📤 Partage-le à un ami, il va reconnaître la cour de son école en deux secondes.


