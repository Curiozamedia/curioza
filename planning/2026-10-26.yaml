    a remplacés par des gestes plus rapides, et peut-être moins humains.


    Les deux dernières slides sont celles qui font souvent réagir les plus anciens 👀


    Quel commerce de ton enfance te manque le plus ? 💬


    💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux les raconter à tes proches.


    📤 Partage-le à un ami, qui a grandi avec les mêmes rues et les mêmes boutiques.


