      texte: 'Attendre quelqu''un qui ne vient pas, c''est « poser un lapin ». Une idée souvent citée : au XIXe
        siècle, des parieurs auraient payé en lapins, *une dette impayée*. Ce n''est qu''une hypothèse, pas une
