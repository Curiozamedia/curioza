  concept: Les règles de politesse invisibles que tout le monde suit
  contenu:
    titre_couverture: Les [règles] *invisibles* que tu suis sans le savoir
    sous_titre: Psychologie du quotidien, version sans leçon de morale
    slides:
    - titre: L'[ascenseur] du silence
      texte: Dans un ascenseur, beaucoup de gens fixent les numéros d'étage. Personne ne parle, et personne ne trouve
        ça bizarre. Ta *règle invisible* vient peut-être de s'activer.
    - titre: Le [siège] vide d'abord
      texte: Dans un train presque vide, on s'assoit rarement juste à côté de quelqu'un. Il faut souvent que le
        cadre soit *plein* pour que la règle lâche. À mon avis, ton cerveau calcule la distance avant toi.
    - titre: Le [pas] de côté
      texte: Dans un couloir étroit, deux inconnus ralentissent, puis s'écartent du même côté. Souvent, personne
        ne l'a décidé. C'est une *chorégraphie* sans répétition.
    - titre: Le [cadeau] qu'on ne mérite pas
      texte: Quand quelqu'un dit merci, on répond parfois « de rien » sans y penser. Selon moi, cette réponse est
        une *règle* sociale qui nous échappe. Un petit mécanisme de réciprocité, peut-être.
    - titre: Le [faux] silence au téléphone
      texte: Au téléphone, on attend souvent que l'autre finisse avant de parler, même sans le voir. Le corps ne
        sait pas forcément que l'autre est loin. Ton cerveau garde peut-être les *tours de parole* à distance.
    - titre: Le [conseil] concret
      texte: 'Pour repérer ces règles, observe un seul moment par jour : une porte, une file, un ascenseur. Tu verras
        la *politesse* sans un mot. Avoue, tu viens de la repérer.'
    question_fin: Laquelle de ces règles tu *suis* sans jamais y penser ?
  sujet: Règles de politesse invisibles que tout le monde suit
  legende: 'Tu respectes des règles que personne n''a écrites 👀


    Ascenseur, siège vide, couloir, merci : ton cerveau applique peut-être des codes invisibles tous les jours.
    Swipe pour les repérer et te faire ta propre idée.


    La dernière règle est celle qui te fait le plus réagir dès que tu la remarques 👀


    Tu en connaissais déjà une ? Dis-le en commentaire 👇


    💾 Enregistre ce carrousel pour la prochaine fois que tu remarqueras une règle invisible.


    📤 Partage-le à un ami, celui qui te dit toujours « de rien » sans réfléchir.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


