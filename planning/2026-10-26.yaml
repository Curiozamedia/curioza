      texte: Le mot vient du persan *kuchk*, un pavillon de jardin. Il est passé par le turc avant d'arriver en
        français, au XVIIIe siècle.
    - titre: Le *café* a voyagé par l'Italie
      texte: Le mot est passé par l'italien *caffè*, lui-même issu du turc *kahve*, avec un détour par l'arabe *qahwa*.
        Une boisson qui a fait le tour de la Méditerranée avant nos tasses.
    - titre: Le *bazar* vient de Perse
      texte: Le mot vient du persan *bāzār*, le marché. Il a voyagé jusqu'au turc puis au français, et il désigne
        aujourd'hui aussi le joyeux désordre d'une chambre d'ado.
    - titre: Pourquoi on emprunte des *mots* ?
      texte: Un mot arrive souvent avec un objet, une mode ou une idée nouvelle. Le français a beaucoup emprunté,
        mais il a aussi exporté des mots comme *bureau* ou *restaurant* partout dans le monde.
    question_fin: Quel mot de ta vie *pensais-tu* être français à 100 % ?
