    - titre: Le *cachot* et ses fameux *dix-sept*
      texte: 'Sais-tu que le mot « cachot » est lié à l''idée de cacher ? Et qu''on dit « être dans le pétrin »
        parce que le pétrin est la cuve où l''on pétrit la pâte : une situation collante et coincée.'
    - titre: '[Mettre] les *pieds dans le plat*'
      texte: 'Dire ce qu''on ne doit pas dire, c''est mettre les pieds dans le plat. Une origine souvent évoquée
        : la maladresse à table, *un geste trop brusque*, qui renverse le plat sur la nappe.'
    - titre: Être *sur les dents*
      texte: Épuisé et tendu à la fois, on est « sur les dents ». Les dents évoquent la fatigue et la nervosité
        qui serrent, *un état de tension extrême* que tout le monde a déjà ressenti.
    - titre: Un *coup de pied de l'âne*
      texte: 'Frapper quelqu''un qui est déjà à terre : c''est le coup de pied de l''âne. La fable de La Fontaine
        « L''Âne et le Chien » est souvent citée comme source, *une cruauté gratuite* qu''on critique encore aujourd''hui.'
    question_fin: Laquelle de ces expressions *utilises-tu* sans le savoir ?
  sujet: Origine surprenante d'expressions françaises du quotidien
  legende: 'Tu dis ça tous les jours sans savoir d''où ça vient 🤯


    On a pris cinq expressions françaises ultra courantes et on a remonté leur histoire. Certaines viennent peut-être
    de la boulangerie, d''autres d''une fable de La Fontaine. Tu vas les regarder autrement.


    La dernière expression vient peut-être d''une fable qui n''a rien d''un conte pour enfants 👀


    Tu connaissais laquelle, toi ? 👇


    💾 Enregistre ce carrousel pour tes prochaines discussions autour d''un café 📌.


    📤 Partage-le à un ami, celui qui dit « je suis sur les dents » en ce moment 😅.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


