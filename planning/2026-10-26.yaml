  contenu:
    titre_couverture: Ces [métiers] qui ont *disparu* de nos rues
    sous_titre: Ta ville d'avant, version boutiques oubliées
    slides:
    - titre: Le [rémouleur] ambulant
      texte: Il passait dans les rues avec sa meule au pied et aiguisait couteaux et ciseaux devant ta porte. Un
        *service à domicile* bien avant les applis.
    - titre: Le *marchand de glace* oublié
      texte: Avant les réfrigérateurs dans chaque cuisine, on achetait parfois de la glace en bloc chez un marchand
        qui la coupait à la scie. Un *froid qu'on payait au poids*.
    - titre: Le *porteur d'eau* des villages
      texte: Dans certaines campagnes, l'eau arrivait encore en seaux et en bidons jusqu'à la maison. Une image
        qui semble venir d'un autre siècle, et pourtant elle n'est pas si lointaine.
    - titre: Le *vidéoclub* et ses cassettes
      texte: Tu choisissais ta cassette dans les rayons, puis tu la rapportais au plus vite, sous peine de payer
        une pénalité. Une *ritournelle du samedi soir* qu'on regrette, à notre avis.
    - titre: Le *cordonnier* de quartier
      texte: Un talon qui lâche ? On le faisait réparer en quelques minutes plutôt que de le jeter. Le *réparateur*
        a laissé la place au *jetable*.
    - titre: La *cabine téléphonique* du trottoir
      texte: Pour appeler, il fallait une pièce ou une carte, et parfois patienter dans la file. Un *lieu public*
        où l'on attendait son tour, sans savoir qui répondrait.
    question_fin: Lequel t'a le plus *manqué* en grandissant ?
  sujet: Métiers et commerces disparus de nos rues (1985-2005)
  legende: 'Ta rue d''avant avait des commerces que tu ne reverras plus 🛠️


