  contenu:
    titre_couverture: Et si [UNE SEULE RÈGLE] *changeait* ?
    sous_titre: Cinq petites révolutions qui font tout basculer
    slides:
    - titre: LE *SOLEIL* NE SE COUCHE PLUS
      texte: Imagine une ville où le jour ne finit jamais. Les volets restent ouverts, les insomnies deviennent
        la norme, et les rideaux seraient un luxe pour les plus aisés.
    - titre: LA PLUIE REMONTE AU CIEL
      texte: Et si les gouttes quittaient le sol pour s'envoler vers les nuages ? Les parapluies deviendraient des
        entonnoirs géants, et les flaques se viderait vers le haut.
    - titre: LA MER DEVIENT *SOLIDE*
      texte: Et si les vagues se figeaient en dunes de verre bleu ? On pourrait marcher sur l'océan, les bateaux
        resteraient coincés dans la glace, et les mouettes auraient enfin une piste.
    - titre: LES OBJETS *RESTENT EN L'AIR*
      texte: Si la gravité prenait des vacances, ton café flotterait sans se renverser. Les chaises pourraient danser,
        les livres tourner doucement, et ton lit devenir une montgolfière.
    - titre: LES ARBRES *MARCHENT* ENFIN
      texte: Et si les racines pouvaient se détacher ? Les forêts traverseraient les routes, les champs migreraient
        vers l'eau, et la nature deviendrait une grande balade.
    question_fin: Quelle règle *changerais*-tu en premier, et pourquoi ?
  sujet: Et si une seule règle de la nature changeait
  legende: 'Et si la nature décidait de changer ses règles ? 🌍


    Plus de nuit, pluie qui remonte, mer qui gèle, objets qui flottent, arbres qui marchent : une seule règle qui
    casse, et tout le quotidien suit. Swipe pour voir jusqu''où ça peut aller.


    La dernière idée est celle qui fait le plus vite basculer le monde entier 👀


    Tu choisis quelle règle à changer ? Dis-le en commentaire 👇


