  contenu:
    titre_couverture: 'LE DUEL [CORÉE] : FÊTES ET *ANNIVERSAIRES*, QUI GAGNE LA BOUGIE ?'
    sous_titre: Un Français chambreur face à un Sud-Coréen élégant
    slides:
    - titre: '[ÂGE] : *le gâteau* d''abord'
      texte: En France, on chante souvent pour l'anniversaire et on coupe le gâteau ensemble. En Corée du Sud, l'âge
        compte beaucoup dans les célébrations, et les *cadeaux* peuvent changer selon l'âge.
    - titre: Des *bougies* qui brillent
      texte: Chez nous, on souffle les bougies et on fait un vœu en silence. Là-bas, certaines fêtes misent sur
        des *décors* soignés et des photos, pour que tout le monde immortalise le moment.
    - titre: Le *cadeau* sous enveloppe
      texte: En France, on offre souvent un cadeau emballé, parfois une bouteille ou un livre. En Corée du Sud,
        on offre aussi souvent de l'argent dans une *enveloppe* soignée, selon la relation.
    - titre: Fête à la *maison* ou au *restau* ?
      texte: Chez nous, on aime organiser un dîner à la maison, quitte à tout faire soi-même. Là-bas, on réserve
        souvent une *salle* au restaurant, avec du karaoké possible après le repas.
    - titre: Le *verdict* du duel
      texte: Les deux pays adorent se réunir autour de la nourriture et des rires. Le vrai match ? Savoir qui sera
        le plus généreux avec la *part de gâteau* du voisin.
    question_fin: Lequel de ces rituels te mettrait le plus *mal à l'aise* ?
