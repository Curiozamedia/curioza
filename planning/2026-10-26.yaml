    - titre: '[Mettre] les *pieds dans le plat*'
      texte: 'Dire ce qu''on ne doit pas dire, c''est mettre les pieds dans le plat. Une origine souvent évoquée
        : la maladresse à table, *un geste trop brusque*, qui renverse le plat sur la nappe.'
    - titre: Être *sur les dents*
      texte: Épuisé et tendu à la fois, on est « sur les dents ». Les dents évoquent la fatigue et la nervosité
        qui serrent, *un état de tension extrême* que tout le monde a déjà ressenti.
    - titre: Un *coup de pied de l'âne*
      texte: 'Frapper quelqu''un qui est déjà à terre : c''est le coup de pied de l''âne. La fable de La Fontaine
        « L''Âne et le Chien » est souvent citée comme source, *une cruauté gratuite* qu''on critique encore aujourd''hui.'
    question_fin: Laquelle de ces expressions *utilises-tu* sans le savoir ?
