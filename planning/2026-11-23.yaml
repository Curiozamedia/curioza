        aurait sûrement un goût de vacances.'
    - titre: Une *forêt de brocolis* géants
      texte: Des arbres en brocoli à perte de vue, avec des troncs de carotte. C'est toujours une forêt, mais elle
        serait nettement plus saine, non ?
