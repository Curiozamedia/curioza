  concept: L'origine d'expressions françaises que tu dis tous les jours
  contenu:
    titre_couverture: Tu dis ça tous les jours et tu ne sais pas [d'où] ça vient
    sous_titre: Cinq expressions *françaises* qui cachent des histoires *bizarres*
    slides:
    - titre: Poser un [lapin]
      texte: On dit que ça vient d'un vieux pari ou d'un rendez-vous manqué, mais personne ne peut le prouver. Pour
        l'instant, c'est une piste, pas une certitude.
    - titre: Avoir un *chat* dans la gorge
      texte: L'expression serait ancienne, sans doute médiévale. Elle parle d'une gêne dans la gorge comme si un
        animal s'y était coincé. C'est une image, pas une explication médicale.
    - titre: Être *sur les dents*
      texte: L'expression évoque l'épuisement, comme si on était à bout de forces. Une piste souvent citée la relie
        à un cheval fatigué qui ne tient plus que sur ses dents, mais rien ne le confirme vraiment.
    - titre: Être *à un poil* de
      texte: L'expression parle d'une distance minuscule, presque invisible. On peut penser qu'elle vient du vocabulaire
        de la précision, mais c'est une hypothèse, pas un fait établi.
    - titre: Tomber dans les *pommes*
      texte: Pour s'évanouir, l'expression est familière et très populaire. Certains y voient un lien avec des malaises
        dans les vergers, mais aucune preuve solide ne le confirme.
    question_fin: Laquelle de ces expressions tu utilises le plus *sans y penser* ?
  sujet: Origine d'expressions françaises qu'on dit tous les jours
  legende: 'Tu dis ça tous les jours sans savoir d''où ça sort 🐇


    Un lapin posé, un chat dans la gorge, un cheval sur les dents : des images bizarres qu''on répète sans réfléchir.
    On a choisi cinq expressions aux origines plus ou moins claires, et on te dit ce qui est sûr et ce qui reste
    une hypothèse.


    La dernière expression est sûrement celle que tu utilises le plus, et son origine reste très discutée 👀


    Tu en connaissais combien avant de swiper ? 😏


    💾 Enregistre ce carrousel pour la prochaine fois que quelqu''un te sort une expression bizarre au dîner.


    📤 Partage-le à un ami, celui qui dit « je suis à un poil de craquer » en réunion.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #culturegenerale #expressionsfrancaises #curiosites #francais #etymologie'
