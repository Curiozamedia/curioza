      texte: En Grèce, on se dit souvent *Kalimera* le matin et *Kalispera* le soir, avec un sourire qui vaut une
        présentation. Et si on se tutoie plus vite là-bas qu'en France, c'est peut-être une question de culture,
        pas de politesse.
    - titre: Qui gagne le *round* ?
      texte: 'Pas de vainqueur absolu : la politesse, c''est *la façon* de dire bonjour. Peut-être que le meilleur
        geste est celui qui fait sourire la personne en face.'
