  contenu:
    titre_couverture: Ton cerveau te [MENTIR] chaque jour, et tu *ne t'en rends pas compte*
    sous_titre: Les petits pièges mentaux qui dirigent tes choix sans demander ton avis
    slides:
    - titre: Le biais du [ZAPPING]
      texte: 'Tu gardes le *premier chiffre* que tu vois, même absurde. Un prix barré à 100 € rend 40 € soudain
        « raisonnable » : à ton avis, ton cerveau compare au lieu de calculer ?'
    - titre: Le biais de *l'effort perdu*
      texte: Tu finis un film nul parce que tu as déjà payé ta place. Beaucoup de gens pensent que l'argent déjà
        dépensé les *retient* sur place. Et si lâcher prise coûtait en fait moins cher que l'erreur ?
    - titre: Le piège du *dernier scroll*
      texte: 'Ton pouce scrolle parce que la prochaine vidéo est peut-être la bonne. Certains chercheurs pensent
        que l''*attente incertaine* accroche plus le cerveau que la récompense certaine. Un conseil : pose le téléphone
        à l''autre bout de la pièce.'
    - titre: Le biais de [CONFIRMATION]
      texte: Tu retiens les infos qui te donnent raison et zappes les autres. Pour t'en sortir, cherche une source
        qui *dit le contraire* avant de conclure. Ça change parfois toute l'histoire.
    question_fin: Lequel de ces pièges t'a le plus *fait sourire jaune* ?
  sujet: Biais cognitifs qui te piègent chaque jour, expliqués simplement
  legende: 'Ton cerveau a des failles, et tu tombes dedans tous les jours 🧠


