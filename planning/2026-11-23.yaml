      texte: Et si les falaises étaient en pain d'épice, avec des strates de chocolat en guise de roches ? Le Grand
        Canyon version goûter, ça donne envie de creuser.
    - titre: Un *lac de soupe* qui fume
      texte: 'Imagine un lac immense où la vapeur monte doucement au-dessus d''une soupe de légumes. Une idée qui
