  concept: Mots français qui viennent d'une autre langue (et pourquoi)
  contenu:
    titre_couverture: Ce mot que tu crois [français] vient peut-être d'ailleurs
    sous_titre: 'Culture G : les emprunts cachés de ta langue'
    slides:
    - titre: Le [bistrot] venu de Russie
      texte: 'Une explication souvent racontée veut que « bistro » vienne de soldats russes entrés à Paris en 1814,
        qui auraient crié « vite ! » en russe. L''origine reste discutée : c''est une belle histoire de *comptoir*,
        pas une certitude.'
    - titre: Le *tennis* qui parle français
      texte: « Tennis » vient très probablement du français « tenez ! », lancé avant de servir la balle. Le mot
        a ensuite traversé la Manche avant de revenir sur nos courts, sous une forme anglaise.
    - titre: Le [week-end] des Anglais
      texte: Le mot « week-end » vient de l'anglais, et il s'est installé dans notre quotidien au point que beaucoup
        de Français le pensent *carrément* français. Un vrai tour de passe-passe linguistique.
    - titre: Le *caramel* venu d'Espagne
      texte: Le mot « caramel » vient probablement de l'espagnol « caramelo », dont l'origine exacte reste discutée.
        Dans ton bonbon mou, il y a donc un peu de vocabulaire qui a voyagé.
    - titre: Le [choc] des mots empruntés
      texte: Les emprunts arrivent surtout quand il faut nommer une chose nouvelle, une idée ou un objet venu d'ailleurs.
        Ton vocabulaire ressemble donc à une carte des rencontres, des conflits et des échanges.
    question_fin: Quel mot de ta vie de tous les jours tu *soupçonnais* d'être étranger ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Ton français a des passeports étrangers 🛂


    Bistro, tennis, week-end, caramel : des mots qu''on croit bien de chez nous et qui ont voyagé avant de s''installer.
    Swipe pour voir d''où ils viennent et pourquoi.


    Le dernier mot est le plus surprenant, et il explique tous les autres 👀


    Lequel te surprend le plus, et tu en connais d''autres ? 🤔


    💾 Enregistre ce carrousel pour la prochaine fois que tu croises un mot « tout français » en soirée.


    📤 Partage-le à un ami, il va sûrement te dire que son mot préféré est pourtant bien français 😏.


