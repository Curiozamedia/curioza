        bas : l''eau fait une pause en l''air.'
    - titre: Le [FRIGO] se vide vers le ciel
      texte: Yaourts, œufs et bouteilles de lait quittent le frigo et flottent au plafond. Mieux vaut ne pas être
        pressé pour ranger les courses.
    - titre: Le *canapé* décolle
      texte: 'Le salon devient un ballet : coussins, télécommande et plaid s''élèvent doucement. La vraie question
        : qui va récupérer la télé ?'
    - titre: La *rue* entière se soulève
      texte: Dehors, les feuilles, les pigeons et les poussettes vides montent vers le ciel. Une minute plus tard,
        tout retombe... ou pas ?
    question_fin: Lequel t'aurait le plus *mal à l'aise* ?
