    - titre: Le *silence* du métro
      texte: Dans un wagon à moitié vide, beaucoup évitent de s'asseoir juste à côté de quelqu'un. On dirait que
        les sièges se remplissent en diagonale, comme une partie d'échecs muette.
    - titre: Le [faux] regard
      texte: Quand on croise quelqu'un dans un couloir, on détourne souvent les yeux juste après l'avoir vu. Trop
        longtemps, ça peut paraître *gênant*. Trop court, ça peut paraître *suspect*.
    - titre: La *queue* sans panneau
      texte: À une caisse sans file clairement indiquée, on se range souvent derrière la dernière personne. Pas
        de ticket, pas de chef, juste un accord silencieux.
    - titre: Le *sourire* d'excuse
      texte: Tu marches sur le pied de quelqu'un ? Tu souris souvent avant même de parler. Ce petit geste semble
        dire *pardon* sans un mot.
    question_fin: Laquelle de ces règles tu suis *sans jamais y penser* ?
