    - titre: Le *pique-nique* d'anniversaire
      texte: Un anniversaire en plein air, c'est possible partout. Selon nous, la fête au bord de l'eau ou dans
        un parc est un classique qui met tout le monde d'accord.
    - titre: Les *invités* en retard
      texte: 'Arriver pile à l''heure, c''est parfois impoli, parfois normal. La vraie question : combien de minutes
        de retard sont tolérées avant que l''hôte ne soupire ?'
    - titre: La *fête* finit en barbecue
      texte: Souffler les bougies, c'est bien. Finir la soirée autour du barbecue avec les voisins, c'est peut-être
        encore mieux. Chez nous comme chez eux, la fête se termine souvent dehors, sous les étoiles.
    question_fin: Lequel de ces *rituels* tu adoptes sans hésiter ?
