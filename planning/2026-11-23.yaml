    - titre: Le [round] des *bougies*
      texte: En France, on souffle les bougies et on chante souvent en mode chorale un peu gênée. En Australie,
        le chant d'anniversaire est lui aussi très répandu, mais, selon nous, on le lance avec plus de sourires.
    - titre: Le *cadeau* en pleine lumière
      texte: Chez certains, on ouvre le cadeau tout de suite devant tout le monde, chez d'autres on attend la fin
