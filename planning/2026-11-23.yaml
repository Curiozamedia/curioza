    slides:
    - titre: Le [CAFÉ] remonte
      texte: Dans la cuisine, ta tasse de café se décroche de la table et file vers le plafond. Les *miettes* suivent,
        en procession parfaite.
    - titre: La *salle de bain* à l'envers
