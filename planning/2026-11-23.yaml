  concept: Les galères technologiques d'avant (attendre, rembobiner, charger…)
  contenu:
    titre_couverture: Tu te souviens de ces [galères] qui *rythmaient* ta vie ?
    sous_titre: Le temps où la technologie te faisait patienter
    slides:
    - titre: '[ATTENDRE] en *silence*'
      texte: Avant, pour voir une photo, il fallait finir la pellicule, puis *attendre* le développement, parfois
        plusieurs jours. Le suspense avait un goût de papier glacé.
    - titre: '[REMBOBINER] la *cassette*'
      texte: 'Pas de bouton magique : il fallait *rembobiner* la cassette avec un crayon ou un stylo à bille, en
        tournant la roulette à la main. Mieux valait ne pas la rendre au vidéoclub avec le ruban froissé.'
    - titre: Le [répondeur] et ses *bips*
      texte: Tu rentrais chez toi et le voyant clignotait. Il fallait écouter le message en entier, noter le numéro
        au dos d'une enveloppe, et espérer que la bande ne soit pas pleine.
    - titre: Charger son *téléphone* à 1 %
      texte: Les premiers mobiles tenaient parfois plusieurs jours, mais une batterie vide loin de toute prise,
        c'était la panique. Tu cherchais un coin de mur pour la *prise* comme un trésor.
    - titre: Le *modem* qui chante
      texte: 'Connexion internet : un bip, un grésillement, puis une mélodie stridente. Tu patientais, la ligne
        de la maison était bloquée, et personne ne devait décrocher pendant ce temps-là.'
    question_fin: Laquelle de ces galères te *fait sourire* le plus, ou te donne des frissons ?
  sujet: Galères technologiques d'avant vues par les 85-05
  legende: 'Tu te souviens de la galère qui te rendait fou ? 📼


    Attendre une photo, rembobiner une cassette au crayon, chercher une prise pour charger son téléphone : on vivait
    avec ça sans y penser. Swipe pour replonger dans ces petites épreuves du quotidien.


    Et la dernière slide te rappellera un bruit que tu n''as jamais oublié 👀


    Quelle galère d''avant tu regrettes, et laquelle tu ne regretteras jamais ? 💬


    💾 Enregistre ce carrousel pour te souvenir de ces galères à ressortir au prochain dîner entre amis.


    📤 Partage-le à un ami, il va sûrement reconnaître au moins une galère de sa jeunesse 📱.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


