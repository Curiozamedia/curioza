  concept: 'Le duel : le logement'
  contenu:
    titre_couverture: 'Le duel France vs Corée du Sud : [CHEZ] toi, ça se passe *comment* ?'
    sous_titre: Le logement du quotidien, version surprenante
    slides:
    - titre: Le [seuil] sacré
      texte: En Corée, on retire ses chaussures à l'entrée, et beaucoup de gens évitent même de marcher en chaussettes
        n'importe où. Chez toi, c'est quoi la règle ?
    - titre: Le sol qui *chauffe* en silence
      texte: Le chauffage au sol, appelé ondol en coréen, fait partie de la tradition depuis des siècles. En France,
        on préfère souvent le radiateur, et certains trouvent qu'il fait froid aux pieds. Et toi, tu y crois ?
    - titre: Le *placard* qui se transforme
      texte: 'Dans certains logements coréens, des meubles se replient le soir pour libérer la pièce. L''idée :
        un salon le jour, une chambre la nuit. Pratique, non ?'
    - titre: Le *balcon* devient cuisine
      texte: Dans certains immeubles coréens, le balcon sert parfois d'espace pour les plantes, le séchage du linge
        ou même quelques casseroles. Chez toi, le balcon, c'est plutôt une chaise et un café ?
    - titre: L'ascenseur qui *jongle*
      texte: Dans les grandes villes coréennes, beaucoup d'immeubles modernes ont un ascenseur et un contrôle d'accès.
        Ici, on se demande souvent qui gère les clés chez toi ?
    - titre: Le *tapis* qui raconte tout
      texte: Sur un sol chauffé, le tapis et le coussin deviennent des éléments clés du confort. Certains Coréens
        mangent assis directement au sol. Et toi, tu préfères la chaise ou le plancher ?
    question_fin: Lequel de ces *usages* te ferait le plus hésiter à déménager à Séoul ?
  sujet: 'Le duel France vs Corée du Sud : le logement du quotidien'
  legende: 'Ton chez-toi, il ressemble à quoi en Corée du Sud ? 🏠


    Chaussures à la porte, sol qui chauffe, meubles qui se replient : le logement coréen joue dans une autre cour.
    On compare avec humour, sans jugement.


    La dernière slide risque de te faire réviser ta façon de recevoir des amis 👀


    Tu fais quoi de tes chaussures quand tu rentres chez toi ? 😄


    💾 Enregistre ce carrousel pour retrouver ces idées le jour où tu voudras comparer ton appart.


    📤 Partage-le à un ami, il va sûrement se reconnaître dans le duel 😂.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #cultureG #curiosites #coreedusud #logement #duelFranceCoree'
