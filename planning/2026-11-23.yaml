  contenu:
    titre_couverture: Des [MAISONS] *impossibles* qui défient la gravité
    sous_titre: Tu habiterais là, toi ?
    slides:
    - titre: Maison [sur] l'eau
      texte: Des maisons flottent sur des lacs et des rivières, ancrées par des pilotis ou des pontons. Dans certaines
        villes, des maisons sur pilotis tiennent debout au-dessus de l'eau, comme au Cambodge. Et si on vivait *sur
        l'eau* un jour ?
    - titre: Maison dans la *falaise*
      texte: Dans certaines régions escarpées, des habitations ont été creusées directement dans la roche. Le mur
        devient le toit, la montagne devient le salon. Ça te donnerait envie, ou tu trouves ça trop *claustro* ?
    - titre: Maison [sous] terre
      texte: En Cappadoce, en Turquie, des habitations ont été taillées dans la roche tendre d'origine volcanique.
        Selon nous, la fraîcheur de ces logements est un gros atout face à la *chaleur*.
    - titre: Maison au [sommet] d'un arbre
      texte: Dans une forêt, une cabane peut être suspendue entre des branches. L'arbre devient le pilier, et tu
        dors *perché* au-dessus du sol. Charmant, non ? Ou un peu flippant ?
    - titre: Maison sur [pilier] de *rocher*
      texte: Des bâtiments perchés sur des rochers isolés existent, comme les célèbres monastères des Météores,
        en Grèce. On se demande encore comment on a réussi à monter tout ça.
    - titre: Et si ta maison [flottait] ?
      texte: 'Imagine une maison posée sur un iceberg qui dérive lentement. Pas de voisin, juste la mer et une question
        : et ton *jardin*, il est où ?'
    question_fin: Laquelle de ces maisons tu *habiterais* vraiment ?
  sujet: Maisons construites dans des endroits impossibles
  legende: 'Ta maison, elle tient sur quoi ? 🏠


    Sur l''eau, dans la roche, sous terre ou au sommet d''un arbre : les humains ont construit dans des endroits
    absurdes. Swipe pour voir les plus fous.


    La dernière slide pourrait bien te donner le vertige 👀


    Tu choisis laquelle, toi ? 💬


    💾 Enregistre ce carrousel pour te souvenir de ces endroits les plus fous.


    📤 Partage-le à un ami, lui demander dans quelle maison il vivrait.


