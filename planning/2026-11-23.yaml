        selon qui gagnait ? Une idée qu'on peut tous défendre.
    - titre: La *règle* de l'heure de sieste
      texte: Silence obligatoire après le déjeuner, même si personne ne dormait. Une règle absurde qu'on respectait
        sans jamais la discuter.
