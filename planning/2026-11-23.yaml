      texte: Aux Pays-Bas, on voit souvent des enfants venir à l'école à vélo, parfois avec un petit frère installé
        à l'arrière. Ici, le cartable pèse déjà lourd sur le dos, on dirait.
    - titre: '*PAUSES* ET RÉCRÉ DEHORS'
      texte: Certaines écoles néerlandaises misent sur de longues pauses et une vraie vie dehors. Et si, selon toi,
