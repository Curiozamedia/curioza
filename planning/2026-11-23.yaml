    slides:
    - titre: Le *micro-ondes* par accident
      texte: 'Selon une anecdote souvent racontée, un ingénieur travaillant sur des radars aurait remarqué que sa
        barre de chocolat avait fondu dans sa poche. Le *hasard* a peut-être fait le reste : l''idée d''un four
        à micro-ondes en est née.'
    - titre: Le *Post-it* raté
      texte: Une colle trop faible, créée par erreur, a longtemps semblé inutile. Des années plus tard, elle est
        devenue le *petit papier* collant que tout le monde utilise.
    - titre: La *pénicilline* oubliée
      texte: En 1928, une boîte de cultures laissée ouverte a été contaminée par une moisissure. Ce *désordre* de
        paillasse a donné l'un des premiers antibiotiques de l'histoire.
    - titre: Le *caoutchouc* qui tombe du poêle
      texte: 'Selon le récit le plus connu, Charles Goodyear aurait fait tomber du soufre et du caoutchouc sur un
        poêle brûlant. Le mélange a durci au lieu de fondre : c''est le principe de la *vulcanisation*.'
    - titre: Le *sirop* qui pétille
      texte: Un sirop censé soigner les maux de tête a fini mélangé à de l'eau gazeuse. Selon l'idée la plus répandue,
        c'était une erreur de dosage, pas une recette de génie.
    - titre: Le *ressort* qui marche
      texte: Un ressort tombé d'une étagère s'est mis à descendre les marches tout seul. Cette *chute* ratée est
        devenue, dit-on, l'un des jouets les plus vendus au monde.
    question_fin: Quelle *erreur* du quotidien pourrait devenir ta prochaine grosse idée ?
