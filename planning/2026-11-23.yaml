      texte: Une colonie de pingouins alignée devant un guichet, sans bouger depuis des heures. On peut se demander
        ce qu'ils attendent, mais aucun ne lâche sa place.
    - titre: LE SCROLL *sans fin*
      texte: Un hérisson allongé sur une branche, pouce en mouvement sur un écran, qui fait défiler sa feuille d'arbre.
        Il rit tout seul depuis tout à l'heure.
    - titre: LE KLAXON *en colère*
      texte: Des oies bloquent un carrefour en pleine heure de pointe et s'engueulent à coups de cri. Le feu est
        vert depuis un bon moment, et elles n'avancent toujours pas.
    - titre: LE CHEF DE FILE *impatient*
      texte: Une troupe de fourmis fait la queue au distributeur de miettes et la tension monte. Une d'elles tape
        du pied, bras croisés, en regardant sa montre.
    - titre: LE CAMPING *bruyant*
      texte: Des castors qui râlent parce que le wifi de la rivière est trop lent. Ils tapent sur leur tablette
        en secouant la queue, prêts à tout casser.
    question_fin: Lequel de ces animaux te ressemble le plus *à l'heure de pointe* ?
