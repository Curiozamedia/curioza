    - titre: Le *muguet* du 1er mai
      texte: Offrir du muguet le 1er mai serait lié à une tradition attribuée à Charles IX au XVIe siècle, qui en
        aurait reçu comme porte-bonheur. Une légende plus qu'un fait prouvé, mais la fleur reste un symbole de chance.
    question_fin: Laquelle de ces traditions t'a le plus *surpris* ?
