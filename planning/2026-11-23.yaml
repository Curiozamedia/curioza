  concept: Les règles de la cour de récré que tout le monde connaissait
  contenu:
    titre_couverture: LES [RÈGLES] NON ÉCRITES DE LA *COUR DE RÉCRÉ* QUE TOUT LE MONDE CONNAISSAIT
    sous_titre: Version détaillée, sans pitié pour ta mémoire
    slides:
    - titre: LA [TOUCHE] DU *GENOU* INTERDITE
      texte: 'Dans la cour, toucher le genou de quelqu''un sans le dire, c''était un *contrat* immédiat : tu étais
        « dedans ». Personne n''avait signé, tout le monde savait.'
    - titre: LE *PAS DE TROP* DANS LE CARRÉ
      texte: 'Le carré de marelle ou le bitume du jeu de billes avait ses *frontières* invisibles : un pied qui
        dépasse et tout le jeu s''arrêtait. Une loi physique, pas juridique.'
    - titre: LE [DERNIER] QUI TOUCHE A PERDU
      texte: 'Le *chat* : une règle sans exception, mais avec une clause cachée, celle du « c''est pas juste » qui
        pouvait faire recommencer la partie dix fois. La justice de la cour avait ses *caprices*.'
    - titre: LE *SILENCE* DU PREMIER QUI CRIE
      texte: Dans les jeux de cache-cache sous les préaux, celui qui criait « je suis là » perdait sans appel. Une
        règle jamais écrite, transmise de grand en petit, comme un *secret* de famille.
    question_fin: Laquelle de ces règles t'a le plus *marqué* dans ta cour ?
  sujet: Règles du jeu de la cour de récré, des années 1985 à 2005
  legende: 'Tu appliquais ces règles sans jamais les avoir apprises 🏫


    Toucher un genou, poser un pied dans le carré, crier trop tôt : la cour avait son code, souvent plus strict
    que n''importe quel règlement. Swipe pour retrouver les lois oubliées de ta récré.


    La dernière règle est celle qui faisait le plus de dégâts entre potes 👀


    Tu en connaissais d''autres dans ta cour ? Raconte-les en commentaire 👇


    💾 Enregistre ce carrousel pour le jour où tu veux expliquer les règles de la récré à un enfant.


    📤 Partage-le à un ami, celui qui était dans ta cour en 1995 et qui se souvient encore de la loi du genou.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #nostalgie #annees90 #recre #souvenirs #culturegenerale'
