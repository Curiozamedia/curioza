      texte: 'Quand les gouttelettes sont très fines, l''arc-en-ciel peut apparaître presque blanc. Une idée simple
        : moins de gouttes, moins de couleurs.'
    - titre: LA MER QUI *SE RETIRE*
      texte: Sur certaines plages, la marée peut révéler un chemin de pierres en quelques heures. La mer fait le
        travail, et le résultat ressemble à un décor de cinéma.
    - titre: DES LUEURS *DANS LA NUIT*
      texte: Des lumières vertes ou violettes peuvent danser dans le ciel polaire. C'est l'aurore, liée aux particules
        du vent solaire qui frappent la haute atmosphère.
