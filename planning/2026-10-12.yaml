  contenu:
    titre_couverture: CHEZ MAMIE ET PAPY, [TOUT] ÉTAIT *PERMIS* SAUF…
    sous_titre: Les vacances d'avant, version campagne
    slides:
    - titre: Le [téléphone] à fil du salon
      texte: Chez mamie, on n'appelait pas pour rien. Le combiné était relié au mur par un fil si long qu'on pouvait
        faire les cent pas dans le couloir.
    - titre: Les *volets* fermés à midi
      texte: 'Pour garder la fraîcheur, mamie fermait les volets en plein été. Résultat : une maison dans la pénombre,
        et des siestes qui semblaient durer une éternité.'
    - titre: Le *cahier* de recettes décousu
      texte: 'Pas de blog ni d''appli : la recette du gâteau était écrite à la main, tachée de beurre, coincée entre
        deux pages de vieux journaux.'
    - titre: La *boîte* de jeux qui sentait le grenier
      texte: Le plateau de jeu était incomplet, les dés étaient usés et il manquait toujours un pion. On jouait
        quand même, parce qu'il pleuvait et que l'ennui était le vrai ennemi.
    - titre: Le *baladeur* prêté pour la route
      texte: Sur la départementale, on se disputait la cassette du trajet. Rembobiner au crayon à bille, c'était
        une science que personne n'a jamais vraiment enseignée.
    - titre: Le *jardin* sans écran ni wifi
      texte: Cabanes dans les haies, confitures à la cuisine, lectures sur le transat. Aujourd'hui on appelle ça
        une déconnexion, à l'époque c'était juste l'été.
    question_fin: Quel souvenir de chez mamie te donne le plus *envie de pleurer* ?
  sujet: Vacances chez les grands-parents, ce qu'on y faisait (1985-2005)
  legende: 'Chez mamie, on ne savait pas qu''on était heureux 🏡


    Téléphone à fil, volets fermés, cahier de recettes tâché : les vacances chez les grands-parents avaient leurs
