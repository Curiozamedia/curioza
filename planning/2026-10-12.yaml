        debout, en quelques secondes.
    - titre: Le [croissant] fait la loi
      texte: Le croissant français se mange souvent en pause. Le cornetto italien se savoure volontiers au comptoir,
        avec un *cappuccino*.
    - titre: Sucré ou *salé* ?
      texte: Ici, le petit-déj penche vers le sucré. En Italie aussi, mais manger debout au bar surprend souvent
        les visiteurs.
    - titre: L'orange *pressée* contre le jus
      texte: Le jus d'orange en brique, c'est notre standard. En Italie, beaucoup préfèrent presser l'orange à la
        main, sous les yeux de celui qui la boit.
    - titre: Le petit-déj *en famille* ou *en solo* ?
      texte: Chez nous, on prend souvent son petit-déj seul, les yeux dans le bol. En Italie, la discussion démarre
        parfois avant même le premier café.
    - titre: Le duel est [serré]
      texte: 'Pas de vainqueur absolu : la France aime la tartine, l''Italie aime le café vite fait. Et toi, tu
        fais partie de quel camp ce matin ?'
    question_fin: Tu es team *tartine* ou team *espresso* ?
