    - titre: Le *livreur* passe par la [gamelle]
      texte: Un chien géant aurait besoin d'une gamelle immense, de la taille d'une piscine. Le livreur, lui, devrait
        sortir l'échelle pour déposer les croquettes.
    - titre: Balade en *laisse* géante
      texte: Promener un lapin géant demanderait sans doute un parc entier. Les passants compteraient les *pas*
        et se demanderaient qui promène qui.
    - titre: Le [voisin] se plaint du *ronronnement*
      texte: Un chat de cette taille ronronnerait sans doute comme un moteur. Les vitres trembleraient, les voisins
        lanceraient une *pétition* et le syndic paniquerait.
    - titre: Il faudrait un *permis* pour le [caca]
      texte: Un animal de cette taille ne se nettoierait pas avec une pelle. La mairie devrait sans doute créer
        un *service spécial* et une benne énorme.
    - titre: Le plus [petit] reste le *meilleur* ami
      texte: Au final, c'est peut-être le hamster de ta poche qui te manquerait le plus. Un animal qui tient dans
        la main, c'est déjà un petit *miracle* urbain.
    question_fin: Lequel t'a mis le plus *mal à l'aise* ?
