    titre_couverture: 'Le duel France vs Italie : le *petit-déjeuner* [CAFÉ] à la française'
    sous_titre: Tartine ou biscotti, qui gagne ce matin ?
    slides:
    - titre: Le [café] du matin
      texte: En France, on trempe sa tartine dans un bol de café au lait. En Italie, on avale souvent un *espresso*
