  categorie: nostalgie
  concept: Phrases que tous les parents disaient aux enfants nés entre 1985 et 2005
  contenu:
    titre_couverture: Ces phrases que [TOUS] nos parents nous ont *lancées* (et qu'on a détestées)
    sous_titre: Tu les reconnais ? Swipe 👉
    slides:
    - titre: '[MANGE] ta *soupe* !'
      texte: Le grand classique du dîner. On se demande encore pourquoi la soupe était toujours la meilleure solution
        pour les enfants qu'on était.
    - titre: Va *jouer dehors*, ça te fera du bien
      texte: Pas de téléphone, pas d'écran, juste un trottoir, un ballon et l'heure du goûter comme seule boussole.
        Dehors, c'était la sortie obligatoire, selon nos parents.
    - titre: Tu veux *rembobiner* ou quoi ?
      texte: Une cassette, un crayon dans le trou, et on tournait la petite roue à la main. Parfois, on rembobinait
        plus qu'on n'écoutait.
    - titre: On n'est pas *au restaurant* ici
      texte: 'Le ton qui calme tout quand on râle sur le menu. La vraie question : pourquoi le plat de légumes gagnait-il
        toujours la bataille ?'
    - titre: Pas de *bruit* pendant le film
      texte: 'Le fameux silence de la télé du dimanche soir. Une seule règle : ne pas bouger, ne pas parler, et
        surtout ne pas rater la pub qui donnait envie d''acheter.'
    - titre: Tu *comprendras* quand tu seras grand
      texte: La phrase éternelle, sans explication. On l'a répétée à notre tour, sans trop savoir pourquoi. Et toi,
        tu as déjà dit la phrase ?
    question_fin: Laquelle t'a le plus *fait râler* à l'époque ?
  sujet: Phrases de parents que tous les enfants des années 85-05 ont entendues
  legende: 'Ces phrases, tu les as entendues mille fois 😅


    Des répliques cultes qui sentent le goûter, la cassette et le dimanche soir. Certaines t''ont marqué plus que
    tu ne le pensais. Swipe pour les revoir toutes.


    La dernière est celle que tu as sûrement répétée à ton tour 👀


    Quelle phrase de tes parents tu redis aujourd''hui sans t''en rendre compte ? 👇


    💾 Enregistre ce carrousel pour retrouver ces souvenirs quand tu veux rire en famille.


    📤 Partage-le à un ami, lui demander s''il se reconnaît aussi dans ces phrases.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #nostalgie #annees90 #souvenirsdenfance #culturegenerale #generation2000'
