        pouce pour la *percer* sans tout renverser.
    - titre: LA [boîte] À GOÛTER EN MÉTAL
      texte: Une boîte rigide qui claquait à chaque ouverture, avec un intérieur qui sentait le *pain d'épices*
        et la gomme. On la laissait traîner au fond du cartable.
    - titre: LE *troc* DE LA RÉCRÉ
      texte: Échanger un biscuit contre un bout de pain au chocolat, une sorte de monnaie officieuse. Qui avait
        *le meilleur troc* ? À mon avis, il fallait négocier comme un vrai commerçant.
    - titre: LA *pomme* QUE PERSONNE NE MANGEAIT
      texte: 'Des fruits entiers rangés au fond du sac, ramenés intacts à la maison. Beaucoup finissaient, sans
        doute, à la poubelle : une *petite honte* qu''on oubliait vite.'
    question_fin: Lequel t'a laissé le plus *nostalgique* ?
  sujet: Goûters d'école des années 90-2000, angle inédit
  legende: 'Tu te souviens du goûter de récré ? 🥪


