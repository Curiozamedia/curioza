    sous_titre: Swipe si tu crois que la planète se calme un peu
    slides:
    - titre: Le [pic-vert] au front de béton
      texte: Le *pic-vert* tape le bois des milliers de fois par jour. Pourquoi il ne se fracasse pas le crâne ?
