    slides:
    - titre: '[LE] *PREMIER* geste compte'
      texte: Ta main attrape ton téléphone avant même que tu sois réveillé. Ce réflexe du *matin* décide peut-être
        de ton humeur pour la journée entière.
    - titre: Le *verre d'eau* qui réveille
      texte: Boire un grand verre d'eau au réveil est une habitude simple. Beaucoup de gens se sentent plus lents
        le matin, et un peu d'eau peut aider à démarrer en douceur.
    - titre: Le pouvoir de la *règle des deux minutes*
      texte: Si une tâche prend moins de deux minutes, fais-la tout de suite. Selon nous, cela libère de la place
        dans ta tête pour penser à autre chose.
    - titre: Ranger *une seule chose* le soir
      texte: Poser ses clés au même endroit ou ranger une tasse évite de chercher ses affaires le lendemain. Un
        cadre prévisible rend, à notre avis, la matinée moins stressante.
    - titre: Marcher *dix minutes* après le repas
      texte: 'Une petite balade après manger peut aider à digérer et à relancer l''énergie de l''après-midi. Pas
        besoin de sport : bouger, même un peu, change souvent la sensation de la journée.'
    question_fin: Laquelle de ces habitudes tu *zappes* chaque jour ?
