      texte: Certains *poissons* produisent des sons en faisant vibrer leurs muscles autour de la vessie natatoire.
        Sous l'eau, ce chant porte loin, et on peut se demander jusqu'où il s'entend vraiment.
    - titre: Une plante qui [mange]
      texte: 'La *dionée attrape-mouche* referme ses feuilles en piège quand un insecte touche ses poils sensibles.
        Un seul contact ne suffit pas : il en faut plusieurs, rapprochés.'
    - titre: Le [tonnerre] de la mer
      texte: Le *cachalot* plonge à plus de mille mètres pour chasser et retient son souffle très longtemps. Franchement,
        on peut le considérer comme l'un des plongeurs les plus impressionnants de la planète.
    question_fin: Lequel t'a le plus *surpris* ?
