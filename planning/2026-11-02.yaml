    titre_couverture: Et si les [monuments] du monde étaient faits de *gelée* ou de *pâte à modeler* ?
    sous_titre: Six lieux mous, givrés ou en plastique, prêts à être pétris
    slides:
    - titre: Une [Tour] en *pâte à modeler*
      texte: Imagine une tour de fer géante, mais façonnée à la main comme un enfant qui s'ennuie. Les *empreintes
