    titre_couverture: 'LE DUEL : [TRANSPORTS] DU QUOTIDIEN, FRANCE VS ISLANDE'
    sous_titre: Qui se déplace le mieux quand il pleut, il vente et il fait nuit à 15 h ?
    slides:
    - titre: LE [VÉLO] DU FRANÇAIS
      texte: Le Français pédale à Paris *en plein trafic*. L'Islandais, lui, sort son vélo quand le vent ne le jette
        pas dans le fjord.
    - titre: LE *BUS* QUI DÉBARQUE À L'HEURE ?
      texte: 'À Reykjavik, le bus file *avec sa propre logique* : l''hiver, les horaires s''adaptent à la neige.
        Pas de drame, juste du bon sens.'
    - titre: LE [TRAIN] FANTÔME
      texte: 'En France, le RER ou le TER peut tomber en panne *sans prévenir*. En Islande, pas de train du tout
        : la route est reine, et le 4x4 aussi.'
    - titre: LE *COVOIT'* DE LA NUIT POLAIRE
      texte: Ici on râle contre les grèves, là-bas on se fie à la route et aux *phares* en plein jour gris. Qui
        a le meilleur plan B ?
    question_fin: Lequel de ces deux *trajets* te donnerait le plus envie de *tout quitter* ?
