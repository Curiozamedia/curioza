      texte: Selon l'histoire habituelle, un chimiste tombe en 1938 sur un matériau glissant et très résistant en
        travaillant sur des gaz. Aujourd'hui, on le retrouve dans beaucoup de cuisines.
    - titre: Le *papier* bulle
      texte: Au départ, son motif en relief devait servir à décorer des murs. L'idée de l'utiliser pour protéger
