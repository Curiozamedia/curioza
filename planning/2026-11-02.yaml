    vent glacial et routes sans train, le match est sans doute plus serré qu''on ne le pense.


    La dernière slide change la donne, et tu ne vas pas la voir venir 👀


    Tu prends quoi pour aller bosser, toi : métro, vélo ou voiture ? 🤔


