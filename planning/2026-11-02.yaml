  contenu:
    titre_couverture: Ces mots [français] qui ont voyagé avant toi
    sous_titre: 'Spoiler : ils ne sont pas tous gaulois'
    slides:
    - titre: LE [CHOCOLAT] VIENT D'AILLEURS
      texte: Le mot nous vient de l'espagnol *chocolate*, qui serait issu du nahuatl, la langue de peuples du Mexique.
        Le cacao, lui, a voyagé bien avant le mot.
    - titre: LE *BIDET* A UN PETIT SECRET
      texte: 'Une piste classique : le mot viendrait du verbe français *bider*, qui voulait dire trottiner. Une
        cuvette faite pour un cheval qui trotte, c''est drôle, mais l''origine reste discutée.'
    - titre: LE *KIOSQUE* VIENT DE LOIN
      texte: Ce mot semble venir du turc *köşk*, qui désignait un pavillon de jardin. Il serait arrivé en France
        par les échanges avec l'Empire ottoman et les voyageurs.
    - titre: LE [PYJAMA] EST PERSAN
      texte: Le mot viendrait du persan *pajama*, qui signifie vêtement de jambe. Il s'est répandu en Europe au
        XIXe siècle, à l'époque où les tenues venues d'Orient étaient à la mode.
    question_fin: Quel mot *français* t'a fait le plus *halluciner* ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Ton vocabulaire a fait le tour du monde sans passeport 🌍


