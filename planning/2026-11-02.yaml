    sous_titre: Bises, poignées de main et politesses qui surprennent
    slides:
    - titre: Le [bisou] en mode sport
      texte: En France, on fait souvent *deux bises*, parfois trois selon la région, et on ne sait pas toujours
        combien en donner. Au Mexique, l'*abrazo* chaleureux et la tape amicale dans le dos sont tout aussi courants,
        à ce qu'on raconte. Bref, à toi de juger quelle méthode te met le plus à l'aise.
    - titre: Le *chapeau* qui salue
      texte: Dans certaines régions du Mexique, enlever son chapeau ou toucher son bord reste un geste de respect,
        surtout envers les aînés. Un petit geste qui, selon beaucoup, en dit long sans un mot.
    - titre: Le *tu* ou le *vous* ?
      texte: En français, on hésite souvent entre *vous* et *tu* avant de se présenter. En espagnol, le choix entre
        *usted* et *tú* peut changer le ton d'une conversation, et c'est un vrai casse-tête pour les débutants.
    - titre: Le *café* offert d'office
      texte: Dans beaucoup de foyers mexicains, on propose souvent à boire à un invité, même pour une courte visite.
        En France, on répond volontiers *ça va aller* en refusant poliment, et ça peut vite prêter à confusion.
    question_fin: Lequel de ces gestes tu trouves le plus *difficile* à faire sans gêne ?
