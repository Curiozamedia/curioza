  concept: Lieux de France aux histoires étonnantes
  contenu:
    titre_couverture: Ces lieux de [France] cachent des *histoires* de fou
    sous_titre: 'Tu croyais tout connaître ? Spoiler : pas tout à fait.'
    slides:
    - titre: Le *Mont-Saint-Michel* a été une île
      texte: À marée haute, il est entouré par la mer. Pendant longtemps, les pèlerins devaient traverser les grèves
        au gré des marées, parfois au risque de leur vie. La digue qui le relie aujourd'hui à la terre a été construite
        au XIXe siècle.
    - titre: Une *ville* sous l'ombre des montagnes
      texte: En Norvège, à Rjukan, le soleil ne descend pas dans la vallée pendant une bonne partie de l'hiver.
        Ce n'est pas en France, mais ça donne envie de chercher les lieux français les plus improbables.
    - titre: Le [pont] qui se lève pour les bateaux
      texte: Certains ponts français ont été conçus pour s'ouvrir, pivoter ou se lever afin de laisser passer les
        bateaux. Le savoir-faire des ingénieurs de l'époque reste impressionnant.
    - titre: Une *grotte* qui a gardé son secret
      texte: Plusieurs grottes françaises ont été découvertes par hasard, parfois par des enfants ou des bergers.
        Certaines abritent des peintures très anciennes, qui fascinent encore les chercheurs.
    - titre: Le village qui *change* de nom
      texte: Certaines communes françaises ont changé de nom au fil de l'histoire. Pourquoi ? Une idée à vérifier
        localement. Dans le doute, cherche la mairie !
    question_fin: Quel lieu de France t'a le plus *surpris* ?
  sujet: Lieux de France aux histoires étonnantes, angle inédit
  legende: 'Tu croyais connaître la France ? Pas si sûr 🗺️


    Des îles qui n''en sont plus, des grottes trouvées par hasard, des ponts qui se lèvent pour les bateaux. La
    France regorge d''histoires que personne ne raconte vraiment à l''école.


    Le dernier lieu est celui qu''on traverse sans le voir... 👀


    Tu connaissais lequel de ces lieux, toi ? 🤔


    💾 Enregistre ce carrousel pour retrouver ces lieux le jour où tu prépares un week-end.


    📤 Partage-le à un ami, celui qui rêve de voyager sans quitter son canapé.


