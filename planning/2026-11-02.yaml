    - titre: LE *SALON* QUI SERT À TOUT
      texte: 'Le salon français est souvent sacré : on n''y mange pas, on n''y bricole pas. Dans d''autres logements,
        la pièce de vie devient cuisine, bureau et salle de jeux à la fois.'
    - titre: LA *TERRASSE* EN ATTENTE
      texte: 'Balcon minuscule ou jardin minuscule : la terrasse fait rêver des deux côtés de la frontière. Qui
