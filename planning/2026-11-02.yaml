    - titre: Un *palais* en [glace] fondante
      texte: Un château royal taillé dans la glace, qui perd doucement ses tourelles sous le soleil. Les *gouttes*
        glissent comme des larmes de sucre.
    - titre: Des *briques* géantes [colorées]
      texte: Et si une cathédrale gothique était assemblée en petits blocs colorés ? Il faudrait *des heures* pour
        la reconstruire bloc par bloc.
    - titre: Une *mosquée* en [gelée] tremblante
