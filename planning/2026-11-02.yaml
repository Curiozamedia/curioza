  concept: L'origine d'expressions françaises que tu dis tous les jours
  contenu:
    titre_couverture: Tu dis ça tous les jours, mais tu sais *d'où ça vient* ?
    sous_titre: Les [origines] cachées de nos expressions
    slides:
    - titre: '[Poser] un lapin'
      texte: 'Tu dis *poser un lapin* quand quelqu''un ne vient pas au rendez-vous. Une piste populaire : l''expression
        ferait référence à un lapin qu''on laissait en gage, sans que personne ne vienne le récupérer. L''origine
        exacte reste incertaine.'
    - titre: Être *dans le pétrin*
      texte: Le *pétrin* est la grande cuve où l'on pétrit la pâte à pain. Être dedans, c'est être coincé, sans
        issue, comme une pâte qu'on ne peut plus sortir.
    - titre: Avoir un *chat* dans la gorge
      texte: 'Avoir un chat dans la gorge, c''est être enroué. L''image est très ancienne : on imagine qu''elle
        vient d''une voix rauque comparée à un miaulement coincé. C''est une hypothèse séduisante, pas une certitude.'
    - titre: Rentrer dans le *lard*
      texte: 'Se faire *rentrer dans le lard* signifie se faire frapper ou attaquer violemment. L''expression vient
        d''un vieux mot argot, mais son étymologie exacte reste incertaine : c''est une piste, pas une certitude.'
    - titre: Se *lever du pied gauche*
      texte: Se lever du pied gauche, c'est être de mauvaise humeur toute la journée. Dans la tradition, le pied
        gauche était jugé maladroit, mais cette origine reste une idée populaire, pas un fait prouvé.
    question_fin: Laquelle de ces expressions tu dis sans y penser, et tu *ignorais* son origine ?
  sujet: Origine de 5 expressions françaises du quotidien
  legende: 'Tu dis ça tous les jours sans savoir d''où ça vient 🤯


    On passe en revue cinq expressions françaises du quotidien, avec leur origine connue ou une piste sérieuse.
    Certaines sont plus folles qu''on ne l''imagine.


    La dernière est la plus incertaine, et on te dit pourquoi 👀


    Tu en connaissais combien avant de swiper ? 😏


    💾 Enregistre ce carrousel pour la prochaine fois que quelqu''un te pose un lapin ou te dit que tu es dans le
    pétrin 🐇.


    📤 Partage-le à un ami, celui qui se lève toujours du pied gauche 😂.


