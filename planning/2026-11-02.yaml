        les dômes et colore les murs.
    - titre: Un *pont* en [caramel] qui coule
      texte: Un pont suspendu qui ondule lentement au-dessus d'un fleuve, prêt à s'étirer au moindre vent. Les *câbles*
        ressemblent à des fils de sucre filé.
    - titre: Une *statue* en [neige] qui pousse
      texte: Une statue de héros qui se couvre de givre chaque nuit et repousse en sculptures plus folles. On ne
        sait jamais *à quoi* elle ressemblera demain.
