    titre_couverture: 'Ton cerveau est [paresseux] : 5 raccourcis qui te *jouent des tours*'
    sous_titre: Psychologie express, zéro blabla
    slides:
    - titre: '[Ancrage] du premier chiffre'
      texte: Selon nous, le premier chiffre entendu semble peser sur tout ce qui suit. Ton cerveau s'y raccroche
        comme à un repère, même quand il est absurde. C'est l'effet d'ancrage.
    - titre: Le *mauvais* sprint
      texte: 'Tu jures que la file d''à côté avance plus vite ? Peut-être que ton cerveau retient surtout les moments
        d''attente irritants et oublie les moments fluides. C''est une idée très répandue : le biais de négativité
        en mode caisse.'
    - titre: Le *faux* expert
      texte: 'Une belle mise en page et une voix assurée peuvent suffire à te faire croire un truc. C''est l''effet
        de fluidité : ce qui se lit facilement paraît souvent plus vrai.'
    - titre: Le *réflexe* de la vitrine
      texte: Tu trouves un objet cher ? Il suffit parfois qu'un autre soit encore plus cher pour qu'il paraisse
        une bonne affaire. Ton cerveau compare plus qu'il ne calcule.
    - titre: Le *dernier* souvenir
      texte: Tu as passé une soirée géniale mais tu gardes un souvenir mitigé ? Certains chercheurs pensent que
        le cerveau retient surtout le pic et la fin. Sois conscient de ce raccourci pour mieux choisir tes moments.
    question_fin: Lequel t'a le plus *fait sourire* en te reconnaissant ?
