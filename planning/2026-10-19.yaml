  contenu:
    titre_couverture: Ces mots français qui ont voyagé avant toi
    sous_titre: Le français a fait ses valises… et rapporté des souvenirs
    slides:
    - titre: '[Bistrot] venu d''ailleurs'
      texte: 'Le mot *bistrot* est souvent rattaché au russe « bystro » (vite), mais son origine exacte fait encore
        débat. Ce qui est sûr : il s''est bien installé dans les cafés parisiens.'
    - titre: Le *bazar* venu de Perse
      texte: 'Le mot *bazar* vient du persan « bāzār », le marché. Il a ensuite pris le sens de désordre. Une idée
        qui circule : les marchés sont souvent un joyeux chaos.'
    - titre: '[Toubib] et ses racines arabes'
      texte: Le mot *toubib* vient de l'arabe maghrébin « ṭbīb » (médecin). Il est entré dans le français parlé,
        notamment lors de la période coloniale en Algérie, par les échanges du quotidien.
    - titre: Le *caramel* et ses racines
      texte: 'Le mot *caramel* est passé par l''espagnol et le portugais, et son origine ultime reste débattue.
        Une piste évoquée : le latin médiéval, mais les spécialistes ne sont pas tous d''accord.'
    - titre: Le *yaourt* venu de Turquie
      texte: 'Le mot *yaourt* est issu du turc « yoğurt ». Une question qu''on peut se poser : à quel point ce mot
        a-t-il été adopté avant que le produit ne devienne courant en France ?'
    - titre: Le *kiosque* et l'Empire ottoman
      texte: Le mot *kiosque* vient du turc « köşk », pavillon. Il est entré dans le français au XVIIe siècle et
        désigne aujourd'hui surtout les petits abris de rue où l'on achète journaux et boissons.
    question_fin: Lequel de ces mots t'a le plus *surpris* ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Ton français a fait le tour du monde sans toi 🌍


    Bistrot, bazar, yaourt… ces mots sont arrivés en France après un long voyage. On découvre pourquoi ils ont changé
    de langue et de sens au passage.


    Les dernières slides cachent un mot qu''on utilise tous les jours sans savoir qu''il vient de l''autre bout
    du monde 👀


