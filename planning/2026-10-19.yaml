  contenu:
    titre_couverture: 'Ça n''a pas été [photoshopé] : la nature fait mieux'
    sous_titre: Cinq phénomènes naturels qui défient ton œil
    slides:
    - titre: '[Lacs] *roses* et couleurs impossibles'
      texte: Certains lacs salés virent au rose vif, selon les conditions, à cause de micro-organismes qui adorent
        le sel. Aucune peinture, juste de la chimie *naturelle*.
    - titre: Des *nuages* qui ondulent
      texte: Les nuages en forme de cloques, appelés mammatus, pendent sous certains cumulonimbus. Franchement,
        on dirait des ballons géants suspendus dans le ciel.
    - titre: Des *arcs* dans le ciel
      texte: Les halos solaires forment parfois un cercle lumineux autour du soleil. Le phénomène vient de la lumière
        qui traverse des cristaux de glace en altitude.
    - titre: Une *mer* qui se retire
      texte: Sur certaines côtes, le vent et les marées dégagent de larges bandes de sable à marée basse. Le spectacle
        est impressionnant, et il dépend surtout des courants et de la lune.
    - titre: Des *glaçons* qui roulent
      texte: Sur certains lacs gelés, le vent pousse des plaques de glace qui se fissurent en motifs géométriques.
        On dirait un décor de film, et pourtant tout est naturel.
    question_fin: Lequel te semble le plus *truqué* ?
  sujet: Phénomènes naturels qui semblent truqués mais sont réels
