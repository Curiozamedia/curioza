      texte: Elle ne sert pas à lire ni à voir où tu marches. Elle illumine seulement ce qui est au-dessus de ta
        tête, comme une constellation personnelle.
    - titre: Un *escalier* qui ne mène nulle part
      texte: Quelques marches en spirale qui s'arrêtent net dans le vide, au milieu d'un pré. Tu montes, tu contemples,
        tu redescends. Et si c'était parfait comme ça ?
    - titre: Une [boîte] pour garder le *silence*
      texte: Un coffret en bois censé capturer quelques secondes de calme pour les ressortir plus tard. Personne
        n'a jamais prouvé que ça marche, mais l'idée est magnifique.
    question_fin: Laquelle de ces inventions te *fait rêver* le plus ?
