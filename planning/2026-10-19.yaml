  concept: 'Le duel France vs Allemagne : fêtes et anniversaires'
  contenu:
    titre_couverture: 'Le duel France vs Allemagne : [FÊTES] et *anniversaires* sans ballons'
    sous_titre: Qui fait la fête le mieux, sans se ruiner ?
    slides:
    - titre: Le [GÂTEAU] est déjà là
      texte: 'En Allemagne, le *Kaffee und Kuchen* de l''après-midi est une tradition bien connue : on partage un
        gâteau entre amis, même sans fête particulière.'
    - titre: 'Anniversaire : *fête* ou *corvée* ?'
      texte: Et si certains anniversaires étaient l'occasion de bricoler le jardin ensemble ? Une idée à creuser,
        pas une règle générale.
    - titre: Le [CADEAU] en *enveloppe*
      texte: 'Ici, on offre souvent une enveloppe avec de l''argent : pratique, et on évite de se tromper de taille.
        Ça fait sourire, mais ça surprend moins qu''un vrai cadeau, selon nous.'
    - titre: Chanter *faux* ? Ça se fait
      texte: Le chant d'anniversaire est universel, mais la version du « Happy Birthday » change selon les pays.
        Le rythme varie, l'énergie aussi, et personne ne devrait être jugé.
    - titre: Ta *fête* idéale, tu la fais comment ?
      texte: 'Café-gâteau, jardin partagé ou enveloppe discrète : chaque pays a sa recette. Et toi, tu préfères
        quelle version du duel ?'
    question_fin: Lequel de ces rituels t'irait le mieux pour ton *prochain* anniversaire ?
  sujet: 'Le duel France vs Allemagne : fêtes et anniversaires'
  legende: 'Ton anniversaire, version allemande ou version française ? 🎂


    Entre le café-gâteau de l''après-midi, le jardin partagé et l''enveloppe discrète, la France et l''Allemagne
    ne fêtent pas du tout pareil. Swipe pour voir quel rituel te surprend le plus.


    La dernière slide réserve un détail sur la façon de trinquer 👀


    Tu fêterais ça comment, toi, ton anniversaire ? 🎉


    💾 Enregistre ce carrousel pour les prochaines fêtes et sortir des idées originales.


