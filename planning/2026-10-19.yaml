    titre_couverture: 'Ta [chambre d''ado] : les *objets* que tu as forcément eus'
    sous_titre: Sans marque, juste la nostalgie pure 🧃
    slides:
    - titre: Le [walkman] et ses *piles*
      texte: Tu le trimballais partout, et tu te souviens sûrement de la vitesse à laquelle il avalait des piles.
        Un bon mois de musique, puis retour au fond du sac. Le *son* qui sautait à chaque pas, c'était ton cardio
        perso.
    - titre: Les *cassettes* rembobinées au crayon
      texte: Une cassette enregistrée depuis la radio, un coup de crayon dans la roue dentée pour la rembobiner.
        Les chansons coupées au milieu, c'était une question de patience. Et de *talent* pour appuyer sur Play au
        bon moment.
    - titre: Le [Tamagotchi] à *nourrir*
      texte: Un petit œuf en plastique accroché au sac, et des bips à toute heure. Oublier de le nourrir, c'était
        risquer de le voir disparaître, et ça, ça comptait vraiment. On se sentait *responsable* d'un bébé pixelisé.
    - titre: Le [téléphone à clapet] ...
      texte: Des SMS facturés à la pièce ? Pas toujours, mais on comptait chaque lettre, c'est un fait de mémoire
        collective. Le T9 qui devinait mal, la coque échangeable et le jeu du serpent. Ton *premier* téléphone,
        c'était, à notre avis, un petit outil de liberté.
    - titre: Le *poster* scotché au mur
      texte: Des pages arrachées d'un magazine, du scotch aux quatre coins, et un mur qui gardait la trace pendant
        des années. Ta chambre, c'était ton *musée* perso, sans filtre ni like.
    question_fin: Lequel t'a fait le plus *replonger* ?
  sujet: Objets de chambre d'ado nés entre 1985 et 2005
