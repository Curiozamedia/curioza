  concept: Et si les animaux de compagnie avaient la taille d'un immeuble en pleine ville (malaise drôle garanti)
  contenu:
    titre_couverture: '[ÉNORME] : ton *chat* fait la taille d''un immeuble'
    sous_titre: Et si ton animal dominait ta ville ?
    slides:
    - titre: Le *chien* qui promène les humains
      texte: Imagine un golden retriever géant qui tire sur sa laisse. Les immeubles suivent, et tes voisins s'accrochent
        aux balcons. Une promenade qui ne ressemble à rien.
    - titre: Le *hamster* qui roule la ville
      texte: Sa roue tourne à côté de la gare. Chaque tour fait trembler les rails, et on peut se demander si les
        trains attendent poliment la fin de la course.
    - titre: Le *poisson rouge* au bord du lac
      texte: Il nage dans la rivière du centre-ville. Les ponts lui serviraient presque de rochers, et les touristes
        prennent des photos depuis les quais.
    - titre: Le *perroquet* qui parle au ciel
      texte: Son perchoir est une tour de bureaux. Il répète les annonces de la mairie, et personne ne sait si c'est
        une blague ou un ordre.
    - titre: La *tortue* qui bouche le tunnel
      texte: Elle avance à sa vitesse, et traverser la place prendrait sans doute des jours. Les embouteillages
        deviendraient un nouveau mode de vie.
    - titre: Le *lapin* qui saute par-dessus Paris
      texte: Un seul bond et il franchirait la Seine. Les mairies se demanderaient sûrement s'il faut lui donner
        une amende ou une carotte.
