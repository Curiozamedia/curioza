    - titre: Un lac qui *change de couleur*
      texte: Certains lacs salés, comme le lac Natron en Tanzanie, peuvent virer au rouge vif. Selon les scientifiques,
        la salinité et les micro-organismes présents jouent un rôle clé.
    - titre: Des nuages [lenticulaires] immobiles
      texte: Ces nuages en forme de soucoupe se forment au-dessus des montagnes quand l'air ondule. Ils semblent
        figés alors que le vent souffle fort.
    - titre: Des *cercles* dans le désert
      texte: 'Les cercles de fées de Namibie intriguent les chercheurs : des zones nues entourées d''herbe. Leur
        origine exacte fait encore débat.'
    - titre: Une cascade qui *remonte*
      texte: 'Par grand vent, les chutes d''eau semblent parfois remonter. Ce n''est pas de la magie : c''est une
        illusion créée par les rafales.'
    - titre: Le [ciel] qui brille la nuit
      texte: Les nuages nacrés brillent parfois après le coucher du soleil, avec des couleurs irisées. Ils sont
        formés de minuscules cristaux de glace.
