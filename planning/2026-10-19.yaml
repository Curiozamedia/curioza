  contenu:
    titre_couverture: Et si [UNE SEULE RÈGLE] *changeait* ?
    sous_titre: Cinq petites rébellions de la nature, rien que pour toi
    slides:
    - titre: LA *PLUIE* QUI MONTE
      texte: Imagine des gouttes qui remontent vers le ciel au lieu de tomber. Les parapluies deviendraient des
        *chapeaux* pour les nuages. Personne ne sortirait sans lunettes, par précaution.
    - titre: LA MER [SOLIDE]
      texte: Si l'eau devenait dure comme du verre, on marcherait jusqu'à l'autre continent. Les *poissons* deviendraient
        des sculptures sous nos pieds, figées dans le bleu.
    - titre: LES ARBRES *TOMBENT* DU CIEL
      texte: Et si la gravité ne valait que pour les feuilles ? Les arbres pousseraient vers le bas, racines en
        l'air. Les oiseaux viendraient y *faire leur nid* sous le sol.
    - titre: LE SOLEIL [NE SE COUCHE] JAMAIS
      texte: Plus de nuit, plus d'étoiles visibles. Les *insectes* pourraient perdre leurs repères, et les chauves-souris
        sans doute bien moins de sorties. Le réveil sonnerait toujours au même moment, sans aucun indice.
    - titre: LES OBJETS QUI *FLOTTENT* ENFIN
      texte: Si les objets perdaient leur poids, on ferait la vaisselle en apesanteur. Les *cartons* voleraient
        dans les appartements, les meubles dériveraient comme des bulles.
    question_fin: Laquelle de ces règles voudrais-tu voir *casser* en premier ?
  sujet: Et si une seule règle de la nature changeait
  legende: 'Et si la nature changeait une seule règle ? 🌍


