    sous_titre: Le temps où la technologie te faisait patienter
    slides:
    - titre: Le [répondeur] à cassette
      texte: Pour savoir si quelqu'un t'avait appelé, il fallait *rembobiner* la cassette puis attendre le bip.
        Et parfois, la bande se coinçait.
    - titre: Le *téléchargement* interminable
      texte: Une chanson pouvait mettre une bonne partie de la soirée à arriver, au rythme d'un bruit de modem qu'on
        n'oublie pas. On ne lançait rien sans *patience*.
    - titre: Le [baladeur] et ses piles
      texte: Les piles s'épuisaient au pire moment, et on les rechargeait rarement. Certains emportaient une pochette
        de piles de rechange *au cas où*.
    - titre: Le *tirage* du mois d'après
      texte: Un appareil jetable, 24 poses, et impossible de voir le résultat avant de passer chez le photographe.
        Parfois, une semaine d'attente pour une photo floue.
    - titre: Le téléphone à [fil] du salon
      texte: 'Impossible de parler en marchant : le fil tendu traversait la pièce. Les conversations se passaient
        *debout*, près du couloir, ou carrément assis par terre.'
    question_fin: Laquelle de ces galères t'a le plus *fait enrager* ?
  sujet: 'Galères technologiques d''avant : attendre, rembobiner, charger'
  legende: 'Avant, la techno te faisait attendre… et ça forgeait le caractère 📼


    Cassettes à rembobiner, modem qui chante, piles qui lâchent au pire moment : on passait sans doute plus de temps
