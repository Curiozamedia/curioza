  contenu:
    titre_couverture: Des [maisons] perchées où personne ne devrait *vivre*
    sous_titre: Et si ton salon était au bord du vide ?
    slides:
    - titre: Le [toit] au-dessus des nuages
      texte: Dans les Alpes et les Andes, certaines maisons semblent posées sur des pentes si raides qu'on se demande
        comment elles tiennent. À notre avis, il faut une bonne dose de courage pour y dormir, mais elles sont là
        depuis des générations.
    - titre: Une [cabane] sur l'eau salée
      texte: Sur certains lacs de sel, des habitations en bois se dressent au milieu d'une surface blanche et lisse.
        Quand le reflet du ciel se pose sur le sol, la maison a l'air de flotter, sans une goutte d'eau sous les
        pilotis.
    - titre: Habiter *au fond* d'un canyon
      texte: Dans plusieurs régions du monde, des habitations ont été creusées dans la falaise. Une façade peinte
        à l'entrée, et le reste de la demeure disparaît dans la roche. Franchement, on a envie d'y frapper pour
        vérifier qu'il y a un salon derrière.
    - titre: Un *arbre* comme salon
      texte: Dans certaines forêts tropicales, des cabanes sont installées dans les branches de très grands arbres.
        Pas de sol ferme, juste un plancher suspendu au-dessus de la canopée. Idéal pour les amateurs de vertige,
        moins pour les chats.
    - titre: Une [maison] sur la *mer* gelée
      texte: Dans l'Arctique, des villages vivent sur la glace de mer ou sur le permafrost. Les maisons sont surélevées
        sur pilotis pour limiter la chaleur qui ferait fondre le sol gelé sous elles.
    question_fin: Laquelle de ces maisons te ferait le plus *flipper* au réveil ?
  sujet: Maisons construites dans des endroits impossibles
  legende: 'Ton salon au bord du vide, ça te tente ? 🏠


    Falaises, lacs de sel, canyons, cimes d''arbres et banquise : l''humanité a trouvé des endroits où personne
