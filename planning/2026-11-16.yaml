    titre_couverture: Avant [Wi-Fi], tu faisais *quoi* exactement ?
    sous_titre: Les gestes oubliés de l'époque sans écran partout
    slides:
    - titre: '[Annuaire] en *papier* épais'
      texte: Avant Google, on cherchait un numéro dans les *pages blanches*. Une vraie liasse de papier, qu'on feuilletait
        en mangeant ses tartines.
    - titre: Le *plan routier* déplié par terre
      texte: Pour partir en vacances, papa dépliait une carte routière qui couvrait tout le salon. Impossible de
        la replier correctement, *c'était une épreuve*.
    - titre: Le *répondeur* qu'on rembobinait
      texte: Un message laissé sur le répondeur, c'était une petite cassette à rembobiner. On appuyait sur play
        en retenant son souffle.
    - titre: Attendre la *photo* développée
      texte: On ne savait jamais si la photo était réussie. Il fallait attendre plusieurs jours chez le photographe,
        et *le suspense* était total.
    - titre: Le *téléphone fixe* au bout du fil
      texte: Le téléphone était fixé au mur, le cordon tendu jusqu'au couloir. Pour avoir un peu d'intimité, il
        fallait *s'enfermer* dans les toilettes ou sortir.
    question_fin: Lequel t'a le plus *fait sourire* ?
