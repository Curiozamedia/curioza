  jour: lundi
  date: '2026-11-16'
  heure: '11:00'
  type: carrousel
  statut: a_valider
  categorie: anecdote
  concept: Phénomènes de la nature qui semblent truqués mais sont réels
  contenu:
    titre_couverture: Ces phénomènes ont l'air [truqués] mais la nature les *fabrique* vraiment
    sous_titre: Swipe, tu vas douter de tes yeux
    slides:
    - titre: '[Lumière] qui se ballade'
      texte: 'Les *aurores boréales* ne sont pas un filtre : ce sont des particules du Soleil qui percutent la haute
        atmosphère. Le ciel joue en vrai.'
    - titre: Le lac qui *change de couleur*
      texte: Certains lacs salés passent du rose au vert selon les algues et les micro-organismes présents. Aucun
        colorant n'est ajouté, la nature fait la peinture.
    - titre: Des *nuages* en forme d'onde
      texte: Les nuages en rouleaux, appelés mammatus, ont des formes de poches qui pendent sous l'enclume d'un
        orage. On dirait une sculpture, pourtant c'est de la vapeur d'eau.
    - titre: Une *falaise* qui pleure
      texte: Des sources ferrugineuses colorent certaines chutes d'eau en rouge sang. Le fer oxydé fait tout le
        travail, sans aucune mise en scène.
    - titre: Le *sable* qui chante
      texte: Certaines dunes émettent un grondement grave quand on glisse dessus. Les grains qui roulent et vibrent
        produisent ce son, un phénomène bien documenté.
    question_fin: Lequel t'a fait dire « impossible » en *premier* ?
  sujet: Phénomènes naturels qui semblent truqués mais sont réels
  legende: 'Tu crois que c''est photoshoppé ? Non, c''est la nature 🌍


    Aurores, lacs roses, nuages en poches, cascades rouge sang : la nature a des effets spéciaux sans budget. Chaque
    exemple a une explication scientifique.


    La dune qui chante est la plus bizarre, attends la fin 👀


    Tu en avais déjà vu un en vrai ? 🤔


    💾 Enregistre ce carrousel pour la prochaine fois que quelqu''un dit que c''est photoshoppé.


    📤 Partage-le à un ami, il va douter de tout ce qu''il voit sur les réseaux 😏.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #nature #curiosites #culturegenerale #phenomenesnaturels #saviezvous'
