  statut: a_valider
  categorie: anecdote
  concept: Mots français qui viennent d'une autre langue (et pourquoi)
  contenu:
    titre_couverture: Ce mot que tu dis tous les jours vient de [l'arabe] et du *persan* ?
    sous_titre: Le français a beaucoup emprunté, et il n'a pas fini
    slides:
    - titre: '[Café] et *la Turquie*'
      texte: Le mot *café* vient de l'arabe *qahwa*, passé par le turc *kahve*. Il est entré en français au XVIIe
        siècle, avec la boisson.
    - titre: '[Orange] vient de *la Perse*'
      texte: Le mot *orange* descend du persan *narang*, passé par l'arabe. Au Moyen Âge, le fruit voyageait par
        les routes commerciales.
    - titre: Ton *pyjama* vient d'*Inde*
      texte: Le mot *pyjama* vient de l'hindoustani *pāy-jāma*, un vêtement de jambes porté dans le sous-continent.
        Les Britanniques l'ont ramené en Europe.
    - titre: '[Cravate] et les *Croates*'
      texte: Le mot *cravate* vient de *croate*. Des mercenaires croates portaient un foulard noué au cou au XVIIe
        siècle, et le style a été repris à la cour de Louis XIV. Certains historiens discutent encore de ce lien
        exact.
    - titre: '*Bistrot* : un mot *russe* ?'
      texte: L'origine de *bistrot* reste incertaine. Une histoire parle du russe *bystro*, qui veut dire vite.
        C'est une idée populaire, pas un fait établi.
    - titre: Le *français* emprunte à *tout le monde*
      texte: Des mots viennent de l'anglais, de l'italien, de l'allemand ou du japonais. Une langue qui emprunte,
        c'est une langue qui a voyagé.
    question_fin: Quel mot du quotidien t'a le plus [surpris] ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Ton vocabulaire est un passeport venu d''ailleurs 🌍


    Café, orange, pyjama : ces mots ont voyagé avant toi. Swipe pour découvrir d''où ils viennent et pourquoi le
    français les a adoptés.


    Le dernier mot est celui que tu ne soupçonnes pas du tout 👀


    Tu connaissais lequel de ces mots, ou c''est une découverte pour toi ? 💬


