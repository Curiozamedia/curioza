      texte: Ton message d'absence était gravé sur une bande magnétique. Impossible de l'effacer sans *rembobiner*
        et prier pour ne pas casser le ruban.
    - titre: Le *plan papier* du voyage
      texte: Avant le GPS, on dépliait une carte routière de la taille d'une nappe. Les *pliures* étaient un art,
        et l'itinéraire se préparait des jours avant.
    - titre: Le *carnet* d'adresses
      texte: Les numéros de tes amis étaient notés à la main dans un petit carnet. Le perdre, c'était risquer de
        *tout effacer d'un coup*. Et ça, on y pense encore aujourd'hui.
    - titre: L'*appareil photo* jetable
      texte: On ne voyait jamais le résultat tout de suite. Vingt-sept poses, un développement, et parfois des photos
        floues qu'on gardait quand même.
    - titre: Le *Minitel* et son bip
      texte: Pour chercher un numéro ou réserver un train, il fallait attendre le bip, puis regarder les lettres
        s'afficher une à une sur un écran vert. Patience obligatoire, *aucune autre option*.
    - titre: Le *walkman* à piles
      texte: Une cassette, deux écouteurs à partager, et une pile qui lâchait au pire moment. Rembobiner avec un
        crayon, c'était devenu un *réflexe* de cette époque.
