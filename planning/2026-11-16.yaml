      texte: Il existait un *mur* où personne ne s'appuyait sans permission. Les *grands* l'avaient décrété, et
        personne ne demandait pourquoi.
    - titre: Le *ballon* appartenait à celui qui l'apportait
      texte: 'Dans beaucoup de cours, celui qui amenait le ballon avait un vrai pouvoir pendant la récré. Sans lui,
        pas de match : à toi de juger si c''était de la justice ou du chantage.'
    - titre: Mourir au *jeu du chat* était interdit
      texte: Quand on te touchait, tu étais le chat, point final. Refuser le rôle ou crier "pas comptée" déclenchait
        des procès à rallonge.
    - titre: Le [cordon] de la corde à sauter
      texte: 'Sauter à la corde à deux était une affaire sérieuse : celui qui ratait prenait la place de l''un des
        tourneurs. Les tourneurs, eux, n''avaient pas le droit de rire.'
    question_fin: Laquelle de ces *règles* tu appliquais sans jamais la remettre en question ?
  sujet: Règles non écrites de la cour de récré (1985-2005)
  legende: 'Personne ne t''a jamais expliqué ces règles, pourtant tu les connaissais toutes 🏫


