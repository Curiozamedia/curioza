  contenu:
    titre_couverture: '[CHAUFFAGE] ET *MAISON* : LE DUEL QUI FAIT FROID DANS LE DOS'
    sous_titre: 'France vs Norvège : le logement du quotidien'
    slides:
    - titre: LES *FENÊTRES* DOUBLES
      texte: En Norvège, beaucoup de logements ont des fenêtres doubles, voire triples. Le Français, lui, ouvre
        sa fenêtre pour dire bonjour au courant d'air.
    - titre: LE *CHAUFFAGE* AU BOIS
      texte: Dans les maisons norvégiennes, le poêle à bois sert souvent de point de rencontre. Ici, on se dispute
        surtout la place près du radiateur.
    - titre: CHAUSSONS *OBLIGATOIRES* ?
      texte: Enlever ses chaussures à l'entrée est une habitude très répandue en Norvège. Chez toi, les chaussures
        restent-elles au pied ou au placard ?
    - titre: LE *BALCON* ET LE SOLEIL
      texte: Quand le soleil revient, certains Norvégiens sortent leur chaise sur le balcon pour profiter du moindre
        rayon. Le Français, lui, a déjà sorti son café dehors depuis dix minutes.
    question_fin: Lequel de ces logements te donnerait le plus *envie* de déménager ?
  sujet: 'Le duel France vs Norvège : le logement du quotidien'
  legende: 'Fenêtres doubles contre courant d''air : le duel commence 🏠❄️


    Entre poêle à bois, chaussons obligatoires et balcon qu''on investit au premier rayon de soleil, le logement
    révèle nos petites différences. Un duel léger, sans gagnant officiel !


    La dernière slide pourrait bien te faire réviser ta façon de rentrer chez toi 👀


    Tu es team chaussons à l''entrée ou team chaussures au pied ? 😏


    💾 Enregistre ce carrousel pour tes prochaines discussions sur le logement et les petites habitudes de voisinage.


    📤 Partage-le à un ami, celui qui se croit toujours plus frileux que toi 🥶.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #culturegenerale #curiosites #norvege #france #logement'
