  concept: Les valeurs à transmettre à un enfant (format qui marche chez Opulancia, formulation neuve)
  contenu:
    titre_couverture: Ce que tu transmets [sans le vouloir] à ton enfant
    sous_titre: Les valeurs passent surtout par ce que tu fais, pas par ce que tu dis
    slides:
    - titre: Le [modèle] avant le discours
      texte: Un enfant apprend beaucoup en *imitant*. Ta façon de gérer une file d'attente ou une erreur pèse peut-être
        plus lourd qu'un long sermon.
    - titre: La *gentillesse* qui se voit
      texte: Selon l'idée de l'apprentissage par observation, un enfant qui voit un adulte aider un inconnu retient
        peut-être le geste autant que la leçon.
    - titre: Le *droit à se tromper*
      texte: Dire « je me suis trompé, désolé » montre qu'une erreur ne détruit rien. Une idée simple, et pourtant
        rare dans beaucoup de foyers.
    - titre: L'*ennui* comme valeur
      texte: Laisser un enfant s'ennuyer un peu l'aide peut-être à inventer ses propres idées. C'est une piste souvent
        discutée, à tester à ta façon.
    question_fin: Quelle valeur tu transmets sans [t'en rendre compte] ?
  sujet: Valeurs à transmettre à un enfant, angle cerveau surprenant
  legende: 'Tu n''enseignes pas la politesse avec tes mots, mais avec tes gestes 👀


    Un enfant copie peut-être plus ce qu''il voit qu''il n''écoute ce qu''on lui dit. Quatre pistes concrètes pour
    repérer les valeurs que tu transmets sans le vouloir.


    La dernière slide parle d''un truc que beaucoup de parents évitent 👀


    Tu as une valeur que tu veux transmettre à tes enfants ? 💬


    💾 Enregistre ce carrousel pour relire ces idées quand tu doutes de tes réactions.


    📤 Partage-le à un ami, à celui qui répète toujours la même leçon à ses enfants 😄.


    👉 Abonne-toi à @curiozamedia : de nouvelles curiosités chaque jour !


    #education #parentalite #psychologie #cerveau #culturegenerale'
