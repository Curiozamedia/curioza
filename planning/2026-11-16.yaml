  contenu:
    titre_couverture: Et si la [nature] servait de *cuisine* géante ?
    sous_titre: Six paysages où la nourriture prend toute la place
    slides:
    - titre: Une [pomme] sur la falaise
      texte: Imagine une *pomme rouge* gigantesque posée au bord d'une falaise, face à la mer. À mon avis, elle
        a l'air d'attendre qu'on la croque.
    - titre: Le *croissant* dans la vallée
      texte: Un croissant aussi grand qu'une colline repose dans une vallée d'herbe verte. Les moutons, eux, ont
        sûrement un avis là-dessus.
    - titre: Une [banane] au fond du lac
      texte: Une *banane* géante flotte sur un lac calme, entourée de montagnes enneigées. Qui l'a posée là ? Ça
        reste une belle énigme, et on peut rêver.
    - titre: Des *fraises* sur la dune
      texte: Des fraises énormes poussent comme des rochers sur une dune de sable doré. On dirait qu'elles attendent
        une vague de chaleur, non ?
    - titre: Le *fromage* dans la forêt
      texte: Une meule de fromage géante trône au milieu d'une forêt de sapins, couverte de mousse. Tu imagines
        déjà l'odeur depuis le sentier.
    - titre: Un [burger] sur le glacier
      texte: Un burger géant, couches bien empilées, repose sur un glacier bleuté. Le vent froid n'a pas l'air de
        l'avoir entamé, et ça, c'est presque le plus impressionnant.
    question_fin: Laquelle de ces *fringales* géantes te donne envie de *grignoter* ?
  sujet: Aliments géants posés dans des paysages naturels, angle original
