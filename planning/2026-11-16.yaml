    - titre: Le *droit à se tromper*
      texte: Dire « je me suis trompé, désolé » montre qu'une erreur ne détruit rien. Une idée simple, et pourtant
        rare dans beaucoup de foyers.
    - titre: L'*ennui* comme valeur
      texte: Laisser un enfant s'ennuyer un peu l'aide peut-être à inventer ses propres idées. C'est une piste souvent
