  contenu:
    titre_couverture: Ces [métiers] que tu croisais en bas de chez toi et qui ont *disparu*
    sous_titre: Le carnet de rue des années 85-05, version souvenirs
    slides:
    - titre: Le [rémouleur] du marché
      texte: Il affûtait couteaux et ciseaux sur sa meule à pédale, en sifflant dans la rue. Aujourd'hui, on jette
        et on rachète. Peut-être qu'on aurait intérêt à réparer davantage.
    - titre: Le *marchand de journaux* du coin
      texte: Il vendait aussi des cartes postales, des bonbons et des piles. Le kiosque faisait un peu office de
        petite épicerie de quartier.
    - titre: La *cabine* téléphonique
      texte: Pièces dans la fente, numéro composé à la main, et la file derrière. Attendre son tour, c'était une
        règle non écrite que tout le monde respectait.
    - titre: Le *vidéoclub* et ses cassettes
      texte: On choisissait une cassette en rembobinant la précédente, avec la crainte de payer une pénalité. Le
        samedi soir, c'était presque un rituel.
    - titre: Le *cordonnier* en deux minutes
      texte: 'Talon refait, semelle recollée, lacet remplacé : il réparait au lieu de remplacer. Une leçon de sobriété
