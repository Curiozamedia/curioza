  contenu:
    titre_couverture: Tu dis ça tous les jours et tu ne sais pas [d'où] ça vient
    sous_titre: Les expressions françaises ont des origines bien plus folles que tu crois
    slides:
    - titre: Avoir la *gueule de bois*
      texte: On parle de gueule de bois pour la sensation après une cuite, et l'expression est ancienne. Une piste
        la rattache au bois mal dégrossi, rugueux, un peu comme une bouche pâteuse au réveil. C'est une idée qu'on
        aime bien, pas une certitude.
    - titre: Poser un *lapin*
      texte: Le lapin pourrait venir des anciens rendez-vous manqués, où l'on attendait quelqu'un en vain. Certains
        racontent même des histoires de lapins laissés à des personnes. L'origine exacte reste discutée, alors on
        la prend avec humour.
    - titre: Tirer le *diable* par la queue
      texte: L'expression parle d'une lutte pour survivre, comme si l'on tirait le diable par la queue pour le retenir.
        On l'utilise pour la pauvreté de tous les jours, toujours là. Son origine exacte reste à creuser.
    - titre: Un *coup de pied* de l'âne
      texte: On dit coup de pied de l'âne pour une attaque lâche contre quelqu'un déjà à terre. Certains y voient
        un écho des fables de La Fontaine, mais le lien précis reste une piste à creuser, pas un fait établi.
    - titre: Mettre les *points sur les i*
      texte: L'image de la précision vient sans doute des manuscrits anciens, où le point sur le i évitait les confusions.
        L'histoire est souvent racontée, mais elle reste plausible sans être totalement prouvée. Elle parle à tout
        le monde.
    - titre: Avoir un *poil* dans la main
      texte: Cette expression sert à dire qu'on ne veut rien faire, et son origine reste une histoire populaire,
        pas une certitude. Tu la ressors quand ton canapé t'appelle.
    question_fin: Laquelle de ces expressions tu utilises sans même y penser ?
  sujet: Origine surprenante d'expressions françaises qu'on dit tous les jours
  legende: 'Tu dis ça tous les jours sans savoir d''où ça sort 🤯


    Gueule de bois, coup de pied de l''âne, poser un lapin... Ces expressions ont des origines bien plus étranges
    que ce qu''on imagine, et souvent elles restent un mystère. Swipe pour découvrir les histoires derrière les
    mots.


    Les deux dernières expressions sont celles que tu ressors quand tu veux éviter l''effort 👀


