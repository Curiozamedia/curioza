    - titre: Chambre pleine de *gelée* tremblante
      texte: Le lit devient une masse rose qui oscille quand tu t'assois. Les murs brillent et la lampe fait des
        reflets *bizarres*. Dormir, à ce stade, ressemble surtout à une question d'équilibre.
    - titre: Entrée remplie de *ballons* rouges
      texte: Tu pousses la porte et une vague de ballons rouges te tombe dessus. Le couloir est bouché jusqu'au
        plafond. Quelqu'un a sûrement oublié la fête d'anniversaire.
    question_fin: Laquelle de ces invasions te *ferait* le plus flipper au réveil ?
