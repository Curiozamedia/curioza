  contenu:
    titre_couverture: Tes parents te disaient [ça] pour une *raison* précise
    sous_titre: Ce qu'ils voulaient vraiment dire
    slides:
    - titre: « Tu vas attraper froid »
      texte: 'Et si ce n''était pas vraiment une question de température ? Peut-être était-ce le *rituel* qui te
        forçait à mettre un manteau, même par 20 degrés. Une hypothèse : on ne savait pas toujours quoi faire d''autre.'
    - titre: « Va jouer dehors ! »
      texte: 'Pas de téléphone, pas de Wi-Fi, juste une porte et des *heures* de liberté. Le sens caché, à mon avis
        : fiche-moi la paix deux heures, s''il te plaît.'
    - titre: « Tu verras quand tu seras grand »
      texte: La phrase qui clôturait toutes les discussions. Elle cachait peut-être une *réponse* que nos parents
        n'avaient pas toujours eux-mêmes. Une opinion simple et un peu provocatrice.
    - titre: « Pose ce couteau, c'est dangereux ! »
      texte: Chaque goûter était une négociation. Derrière l'inquiétude, il y avait sans doute la *peur* de voir
        la cuisine transformée en zone de guerre. Tu avoueras que ça arrivait souvent.
    question_fin: Laquelle t'a fait dire *mot pour mot* à tes propres enfants ?
  sujet: Phrases que tous les parents disaient aux 85-05, angle décodé
