      texte: Imagine ouvrir la douche et découvrir une mousse de savon qui déborde jusqu'au couloir. Le lavabo disparaît,
        la baignoire aussi. Il ne reste que des bulles qui *tremblent* à chaque pas.
    - titre: Cuisine remplie de *billes* colorées
      texte: Le frigo est coincé derrière un mur de billes en plastique. Les placards ne s'ouvrent plus, la cuisinière
