  contenu:
    titre_couverture: Ce mot que tu dis en *français* vient peut-être d'[ailleurs]
    sous_titre: Les emprunts qui ont voyagé avant toi
    slides:
    - titre: Le [café] a voyagé en *Turquie*
      texte: Le mot *café* passe par l'italien, et il pourrait venir du turc *kahve*, lui-même issu de l'arabe.
        Une boisson qui a fait un long détour avant d'arriver dans nos tasses.
    - titre: Le *caramel* a des racines *latines*
      texte: Le mot vient probablement de l'espagnol *caramelo*, qui serait lié à un mot latin désignant le sucre.
        Le bonbon a donc une étiquette linguistique bien plus ancienne que lui.
    - titre: Le [pyjama] vient d'*Inde*
      texte: Le mot vient du hindi-ourdou *pajama*, qui désigne un pantalon ample porté en Asie du Sud. Les Européens
        l'ont adopté à l'époque moderne, puis l'ont transformé en tenue de nuit.
    - titre: Le *bistrot* et les *soldats* russes ?
      texte: 'L''origine du mot est débattue : certains y voient le russe « bystro », vite, lié aux soldats russes
        entrés à Paris en 1814. C''est une hypothèse, pas une certitude, donc à prendre avec humour.'
    - titre: Le *ketchup* venu de [Chine] ?
      texte: Selon une hypothèse, le mot viendrait d'une sauce de poisson fermentée d'Asie du Sud-Est, que des marins
        européens auraient découverte. Le nom a survécu, mais la recette a beaucoup changé au fil des voyages.
    question_fin: Quel mot de ta vie de tous les jours a le plus de *voyages* dans son passé ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Tu parles une langue de voyageurs sans le savoir 🌍


