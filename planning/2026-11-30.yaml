    sous_titre: 'Bus, voiture, vélo : deux façons de se déplacer'
    slides:
    - titre: LE *métro* OU LE BUS ?
      texte: À Paris, on se serre dans le métro aux heures de pointe. En Islande, le bus semble être un bon allié
        quand il pleut à l'horizontale, à condition d'aimer les horaires souples.
    - titre: LE *vélo* SOUS LA PLUIE
      texte: Chez nous, le vélo demande du courage et un bon œil sur la météo. Là-bas, on pédale face aux vents
        violents, et on se dit que le sourire est un bon équipement d'hiver.
    - titre: LA *voiture* TOUT-TERRAIN
      texte: Une petite citadine suffit souvent pour traverser Paris. En Islande, beaucoup de gens préfèrent un
        4x4 pour affronter les gravillons, les gués et les routes qui changent d'humeur.
    - titre: LE *cheval* ISLANDAIS ?
      texte: En Islande, le cheval islandais reste un animal très apprécié, connu pour ses allures particulières.
        Chez nous, on le voit surtout comme un loisir. Et si on le voyait comme un moyen de transport ?
    - titre: LE *gagnant* DU TRAJET ?
      texte: 'Le métro est rapide, le bus est fiable, le vélo est sportif. Et toi, ton trajet idéal ressemble à
        quoi : le tramway parisien ou la route volcanique ?'
    question_fin: Lequel de ces trajets te paraît le plus *aventureux* ?
  sujet: 'Le duel France vs Islande : les transports du quotidien'
  legende: 'Le métro contre la route volcanique, qui gagne ? 🚌


    Entre bus sous la pluie, vélo face au vent et 4x4 dans les gués, les transports révèlent deux façons très différentes
    de se déplacer. Swipe pour voir le duel complet.


