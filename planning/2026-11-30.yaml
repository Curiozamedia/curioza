    slides:
    - titre: Une [trousse] de 40 étages
      texte: Imagine une trousse scolaire grande comme une tour de bureaux, ouverte au milieu d'une place. Les *crayons*
        seraient des mâts de grue et la fermeture éclair un viaduc.
    - titre: Un *grille-pain* qui tremble
      texte: Un grille-pain géant poserait ses deux fentes sur deux immeubles. Et la tartine, grande comme un bus
        à impériale, *sortirait* lentement dans un bruit de moteur.
    - titre: La [clé] qui bloque la ville
      texte: Une clé de 200 mètres enfoncée dans la serrure d'une cathédrale. Personne ne sait si elle ouvre ou
        *ferme* le quartier, et c'est sans doute le plus inquiétant.
    - titre: Des *chaussettes* en guise de collines
      texte: Une paire de chaussettes dépliée sur une vallée devient une colline douce. On se demande qui a perdu
        la seconde, et surtout *pourquoi* elle est encore là.
    - titre: Le [savon] qui flotte sur le port
      texte: Un bloc de savon gros comme un paquebot flotte dans le port. Les mouettes l'utilisent comme *perchoir*
        et la mer mousse doucement autour de lui.
    - titre: Une *pile* de 300 mètres
      texte: Une pile AA géante plantée au milieu d'une place alimenterait tout un quartier en silence. Mais qui
        a décidé qu'elle serait *déchargée* juste avant le dîner ?
    question_fin: Quel objet *géant* te ferait le plus *flipper* en bas de chez toi ?
