  contenu:
    titre_couverture: Ça a l'air [truqué] ? Pourtant c'est *la nature* qui fait tout
    sous_titre: Swipe, tu vas douter de tes yeux
    slides:
    - titre: Le sol qui *reflète* le ciel
      texte: Sur le salar d'Uyuni, en Bolivie, une fine couche d'eau transforme le sol en miroir géant. Après la
        pluie, le ciel semble se trouver sous tes pieds.
    - titre: Des halos *autour du soleil*
      texte: Le halo est ce cercle lumineux qui entoure parfois le soleil. Il est causé par la lumière qui traverse
        des cristaux de glace en suspension dans l'air. Certains forment des anneaux presque parfaits, qu'on jurerait
        retouchés.
    - titre: Une *cascade* qui remonte
      texte: En Islande, le Háifoss tombe d'environ 120 mètres. Par grand vent, la brume d'eau peut être soufflée
        vers le haut, et on a parfois l'impression que la cascade remonte.
    - titre: Des nuages en *forme d'ondes*
      texte: Les nuages en rouleaux, appelés nuages en ressaut, se forment quand l'air ondule au-dessus des montagnes.
        On dirait une vague figée dans le ciel, et pourtant c'est bien la nature qui dessine ça.
    question_fin: Lequel te paraît le plus *faux* alors qu'il est vrai ?
  sujet: Phénomènes naturels qui semblent truqués mais sont réels
  legende: 'Non, ce n''est pas Photoshop 😳


