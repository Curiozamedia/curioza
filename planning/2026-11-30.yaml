  concept: L'origine d'expressions françaises que tu dis tous les jours
  contenu:
    titre_couverture: Tu dis ça tous les jours, mais tu sais *d'où ça vient* ?
    sous_titre: Les expressions françaises et leurs origines étonnantes
    slides:
    - titre: Poser un [lapin] à quelqu'un
      texte: 'Ça veut dire donner un rendez-vous et ne pas venir. Une piste parmi d''autres : au marché, on vendait
        parfois des lapereaux en sac, et l''idée d''un sac qu''on refile à la place d''un *gibier* prête à sourire.
        Une hypothèse, pas une certitude.'
    - titre: Avoir une *faim de loup*
      texte: L'expression est ancienne et renvoie à une époque où les loups rôdaient autour des villages. On peut
        imaginer une faim assez forte pour braver le froid et la peur. L'image, elle, est plus vieille que tes tartines.
    - titre: Mettre les [pieds dans le plat]
      texte: 'Dire tout haut ce qu''on devrait taire, au pire moment. Une idée répandue : l''expression viendrait
        des repas d''autrefois, où l''on posait les plats au centre de la table. Un convive maladroit pouvait tout
        renverser.'
    - titre: Tomber dans les [pommes]
      texte: S'évanouir, tout simplement. Une hypothèse la rattache aux sels ou au vinaigre qu'on faisait respirer
        aux personnes malades, parfois posés sur une pomme. Rien n'est sûr, mais l'image reste.
    - titre: Avoir un *poil* dans la main
      texte: Être paresseux, ne rien vouloir faire. Une vieille expression qui imagine quelqu'un tellement mou qu'il
        ne bouge même pas un poil. Et toi, tu en as combien dans la main aujourd'hui ?
    question_fin: Laquelle de ces expressions tu *utilises* sans jamais y avoir réfléchi ?
  sujet: Origine d'expressions françaises qu'on dit tous les jours
  legende: 'Tu dis ça tous les jours sans savoir d''où ça vient 🐇


    Des expressions qui sortent toutes seules, mais dont l''origine est bien plus étrange qu''on croit. Entre lapins,
    loups et pommes, il y a de quoi te griller en soirée. Swipe pour tout découvrir.


    La dernière expression vient des repas de famille, et elle te concerne directement 👀


    Quelle expression tu vas *dire autrement* désormais ? 😏


    💾 Enregistre ce carrousel pour la prochaine fois que tu veux briller à table.


