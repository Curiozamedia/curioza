    - titre: Frites *au rayon* surgelés
      texte: Le rayon surgelés, c'est le terrain de jeu des amateurs de frites. Ici, chacun défend sa recette préférée
        avec beaucoup de conviction, et on peut passer dix minutes devant un seul sachet.
    - titre: Le [sac] à emporter
      texte: 'À la caisse, la question du sac fait sourire : on le paie ou on l''apporte de chez soi ? À notre avis,
        chaque pays a sa petite routine, et c''est ce qui rend le duel amusant.'
    - titre: Le *frigo* en vitrine
      texte: Les produits frais se rangent parfois dans des allées réfrigérées très visibles, parfois au fond du
        magasin. Selon nous, c'est une question d'organisation plus que de grande vérité.
    - titre: Le *ticket* de caisse
      texte: Garder son ticket ou le jeter direct ? Certains le scrutent comme un trésor, d'autres le laissent au
        fond du sac. Et toi, tu fais partie de quel camp ?
