      texte: Patienter est une valeur qui se transmet, selon nous, surtout par l'exemple. Quand tu attends ton tour
        sans t'agacer devant lui, il voit la patience en action.
    - titre: Donne-lui *le choix* du jeu
      texte: Laisser un enfant choisir une petite chose, comme l'ordre des activités, nourrit à notre avis son autonomie.
        Une valeur qui se construit à coups de petites décisions.
    question_fin: Quelle valeur tu *regrettes* de ne pas avoir vue chez tes parents ?
