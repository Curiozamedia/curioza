    - titre: '*Erreurs* montrées, valeur *gagnée*'
      texte: 'À ton avis, un enfant qui te voit t''excuser après une erreur apprend-il la réparation ? Essaie de
        dire tout haut : « je me suis trompé, je corrige ».'
