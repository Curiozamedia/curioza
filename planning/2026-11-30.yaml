  concept: Lieux de France aux histoires étonnantes
  contenu:
    titre_couverture: Les [lieux] qui cachent des *histoires* de fou en France
    sous_titre: Six endroits bien réels qui font douter de tout
    slides:
    - titre: '[Oradour] et son *silence*'
      texte: Le village d'Oradour-sur-Glane, en Haute-Vienne, est resté en ruines depuis 1944 et sert aujourd'hui
        de mémorial. On y entre comme dans une ville figée dans le temps, et on sent que le silence pèse lourd.
    - titre: Le village *englouti* du lac
      texte: En France, des villages ont été noyés sous des lacs de barrage. Quand la sécheresse fait baisser le
        niveau de l'eau, certains clochers peuvent réapparaître à la surface.
    - titre: Une ville [sous] la terre
      texte: Sous Paris, d'anciennes carrières de calcaire forment un immense réseau. Les *catacombes* abritent
        les ossements de nombreux Parisiens, transférés au XVIIIe siècle depuis les cimetières saturés.
    - titre: La maison *pendue* au rocher
      texte: Sur la côte bretonne et ailleurs, certaines maisons ont été bâties à flanc de falaise ou de pente rocheuse.
        Vues d'en bas, on jurerait qu'elles défient la gravité.
    - titre: Le château des *ruines* romantiques
      texte: Les ruines de châteaux médiévaux sont partout en France. Au XIXe siècle, les romantiques les peignaient
        souvent pour leur côté mélancolique, et on peut penser qu'elles inspirent encore aujourd'hui.
    - titre: Le lieu qui *n'existe* pas
      texte: Certains lieux n'existent que sur les cartes. Pour repérer les copies, des cartographes glissent parfois
        de fausses rues ou villes, appelées *villes fantômes* ou *fausses villes*.
    question_fin: Quel endroit de cette liste irait dans ta *prochaine* balade ?
  sujet: 'Lieux de France aux histoires étonnantes : villes fantômes et lieux insolites'
  legende: 'Des villages qui dorment, des villes sous terre : la France a des secrets 🏚️


    Entre mémoire tragique, villages engloutis et catacombes, les lieux de France ont des histoires dignes d''un
    film. Swipe pour découvrir les six plus étonnants.


    La dernière slide parle d''une ville qui n''existe peut-être que sur le papier, et pourtant elle figure sur
    les cartes 👀


    Tu connaissais lequel de ces lieux ? 🤔


