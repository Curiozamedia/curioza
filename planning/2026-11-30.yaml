  contenu:
    titre_couverture: Tu suis des [règles] invisibles sans le savoir, et *personne* ne te les a apprises
    sous_titre: Psychologie au quotidien, version bizarre
    slides:
    - titre: Le [silence] de l'ascenseur
      texte: Dans un ascenseur, la plupart des gens fixent les numéros d'étage. Personne n'a signé ce pacte, et
        pourtant beaucoup le respectent. On peut y voir une *norme sociale* que chacun semble suivre sans la discuter.
    - titre: Le *faux* chemin du couloir
      texte: Dans un couloir étroit, on se décale souvent du même côté, comme si une règle invisible traçait une
        voie. À mon avis, c'est un petit ballet de coordination que personne n'a jamais appris en classe.
    - titre: Le [rire] qui arrive trop tôt
      texte: Quand quelqu'un raconte une blague qui tombe à plat, on rit quand même, souvent par politesse. Peut-être
        que le cerveau préfère *éviter le malaise* à un silence gênant.
    - titre: Le conseil [anti-malaise] à tester
      texte: Au prochain ascenseur, change de place une fois, juste pour voir. Remarquer ces règles, c'est déjà
        *reprendre le pouvoir* sur elles.
    question_fin: Laquelle de ces règles t'a fait sourire en te reconnaissant ?
  sujet: Règles de politesse invisibles que tout le monde suit
  legende: 'Tu obéis à des règles que personne n''a écrites 🤫


    Ascenseur, couloir, blague ratée : ton cerveau suit peut-être des codes invisibles au quotidien. Swipe pour
    voir pourquoi tu fais tout ça sans réfléchir.


    La dernière slide te propose un petit test à faire dès ta prochaine sortie 👀


    Tu connais une règle invisible que tout le monde suit ? 😏


    💾 Enregistre ce carrousel pour la prochaine fois que tu te surprends à faire comme tout le monde.


    📤 Partage-le à un ami, à celui qui se place toujours dos à la porte dans l''ascenseur 😅.


