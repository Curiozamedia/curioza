  contenu:
    titre_couverture: 'LE DUEL *France vs Mexique* : [FÊTES] et anniversaires'
    sous_titre: Qui fait la fête le mieux ? Round 1 de CURIOZA
    slides:
    - titre: Le [gâteau] ou la piñata ?
      texte: En France, on souffle les bougies et on coupe le gâteau. Au Mexique, on peut casser une *piñata* pleine
        de bonbons. Deux façons de fêter, aucune n'est meilleure par défaut !
    - titre: Chanter *fort* ou chanter *ensemble* ?
      texte: Le *Joyeux anniversaire* se chante vite, parfois faux, et tout le monde se demande quand il s'arrête.
        Au Mexique, les *Las Mañanitas* se chantent traditionnellement à l'aube, parfois accompagnées de mariachis.
        Réveille-toi, la fête commence !
    - titre: Cadeaux *tout de suite* ou *à la fin* ?
      texte: Chez nous, on ouvre les cadeaux devant tout le monde, parfois avec du papier qui vole partout. Dans
        certaines familles mexicaines, la fête se prolonge avec les *posadas* en décembre, une tradition de Noël
        qui se vit en groupe.
    - titre: Un gâteau *ou* une table *XXL* ?
      texte: 'Chez nous, la pièce montée a son charme. Au Mexique, les tables de fête sont souvent bien garnies,
        avec tamales, guacamole et fruits frais. Notre idée : que personne ne reparte le ventre vide.'
    - titre: Souhaiter *un vœu* ou *en faire un* ?
      texte: Certains disent que souffler les bougies d'un seul coup porte chance. Pour nous, c'est une tradition
        populaire, pas une science. Et toi, tu gardes ton vœu secret ou tu le racontes ?
    question_fin: Lequel de ces rituels te donnerait le plus *envie* de fêter ton prochain anniversaire ?
  sujet: 'Le duel France vs Mexique : les fêtes et anniversaires'
  legende: 'Anniversaire à la française ou à la mexicaine ? 🎂


