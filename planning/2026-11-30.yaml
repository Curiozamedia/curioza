  contenu:
    titre_couverture: LE [PASSÉ] VERSION *FUTUR* ABSURDE
    sous_titre: Et si ta grand-mère avait eu un grille-pain quantique ?
    slides:
    - titre: LE [GRILLE-PAIN] *quantique*
      texte: Ton vieux grille-pain ne se contente plus de griller. Il *transforme* la tartine en pur délire, et
        on se demande encore où passe le beurre.
    - titre: LA [CARTE POSTALE] *hologramme*
      texte: Fini le timbre qui traîne dans un tiroir. Et si ta carte postale d'autrefois sortait en *hologramme*,
        pour te montrer la plage en trois dimensions ?
    - titre: LE [TOURNE-DISQUE] *anti-gravité*
      texte: Le vinyle tourne en lévitation, au-dessus de la platine. Est-ce un *progrès* ou juste une excuse pour
        ne plus jamais changer de face ?
    - titre: LA [MACHINE À ÉCRIRE] *robot*
      texte: Ta vieille machine à écrire refuse de taper seule. Elle préfère *dicter* ses vers aux *mouches* qui
        passent, c'est plus poétique.
    question_fin: Lequel de ces objets tu *garderais* tel quel, sans rien changer ?
  sujet: Objets d'autrefois réinventés en version futuriste absurde
  legende: 'Ton grille-pain du futur transforme ta tartine 🍞


    On a pris des objets d''autrefois et on les a envoyés dans le futur, version absurde. Grille-pain quantique,
    carte postale holographique, vinyle en lévitation : et si on les voyait un jour dans nos cuisines ?


    La dernière slide est une machine à écrire qui dicte aux mouches, on ne sait pas trop pourquoi 👀


    Quel objet d''autrefois tu aimerais voir revenir en version futuriste ? 💬


    💾 Enregistre ce carrousel pour te moquer de ton grille-pain la prochaine fois que tu le sors du placard 📌.


    📤 Partage-le à un ami, lui demander si son téléphone fixe a aussi fait une mise à jour 📞.


