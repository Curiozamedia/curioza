    slides:
    - titre: '[Carcassonne] : le château refait à sa façon'
      texte: La cité médiévale que tu vois sur les cartes a été largement *restaurée* au XIXe siècle. À mon avis,
        une bonne partie de ce qu'on admire est une *interprétation* du passé, plus qu'une copie exacte.
    - titre: Le *Mont-Saint-Michel* était une île
      texte: Ce rocher était entouré de *marées* spectaculaires. Au fil des siècles, des digues et l'ensablement
        ont changé son rapport à la mer, au point de le relier à la terre par une route.
    - titre: Le *gouffre* de Padirac, rivière sous terre
      texte: Sous le Lot, une rivière coule dans des galeries immenses. Le lieu est connu pour ses *grottes* et
        ses cours d'eau souterrains, et se visite encore aujourd'hui.
    - titre: Une *ville* entière construite sur l'eau
      texte: Sur le bassin d'Arcachon, les cabanes tchanquées sont perchées sur leurs pilotis. Une architecture
        *typique* qui raconte les métiers de la mer et de l'ostréiculture.
    question_fin: Lequel de ces lieux t'a le plus *surpris* ?
