    sous_titre: Personne ne les a écrites, beaucoup les respectent sans y penser
    slides:
    - titre: Le [silence] de l'ascenseur
      texte: Tu montes, tu te tournes face à la porte, et personne ne dit rien. Aucune loi ne l'impose, pourtant
        *tout le monde* semble s'y plier.
    - titre: Le [faux] regard qui évite
      texte: Dans le métro, tu fixes le vide ou ton téléphone. Croiser un regard trop longtemps devient *gênant*,
        sans que personne ne l'ait décidé.
    - titre: Le [pas de côté] discret
      texte: Sur un trottoir étroit, deux personnes qui marchent face à face s'écartent souvent au même moment.
        Une *chorégraphie* jamais répétée.
    - titre: Le [délai] avant de répondre
      texte: Quand quelqu'un te dit « ça va ? », tu réponds « ça va, et toi ? » presque sans réfléchir. Le script
        social tourne tout seul, *automatiquement*.
    - titre: Le [sourire] de l'inconnu
      texte: Tu tiens une porte, la personne derrière sourit ou dit merci. Ce petit échange ne coûte presque rien,
        mais il *reste gravé* dans la journée.
    question_fin: Laquelle de ces règles te paraît la plus *absurde* quand tu y penses ?
