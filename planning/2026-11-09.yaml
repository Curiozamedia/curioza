  contenu:
    titre_couverture: Ces mots *français* qui ne le sont pas du tout
    sous_titre: Le [vrai] passeport de nos mots
    slides:
    - titre: Le [bistrot] a voyagé
      texte: 'Le mot viendrait probablement du russe « bystro », qui signifie « vite ». L''histoire des soldats
        russes pressés dans les cafés parisiens de 1814 est racontée souvent, mais reste une légende : à toi de
        la prendre comme une anecdote, pas comme une certitude.'
    - titre: Le *yaourt* venu de Turquie
      texte: Le mot turc « yoğurt » désigne ce lait épaissi par des ferments. Il est entré dans notre langue au
        XXe siècle, bien après que le produit a traversé les frontières.
    - titre: Le *caramel* a une origine floue
      texte: Le mot vient probablement de l'espagnol « caramelo » ou du latin médiéval « calamellus ». Les linguistes
        ne tranchent pas totalement, et c'est déjà une belle énigme.
    - titre: Le [bazar] vient du persan
      texte: Le mot persan « bāzār » désignait le marché couvert. Il a voyagé jusqu'à nous via l'Empire ottoman,
        avant de devenir synonyme de désordre dans la bouche des Français.
    - titre: Le *toboggan* vient du Canada
      texte: Le mot viendrait d'une langue algonquienne, peut-être « odabaggan », qui désignait un traîneau. Il
        a été adopté en français au XIXe siècle, lors des échanges avec les peuples autochtones d'Amérique du Nord.
    - titre: Le [kiosque] vient de Perse
      texte: Le mot persan « kōshk » désignait un pavillon ouvert. Il a pris le sens de petit édifice de jardin
        et de vente de journaux, comme un clin d'œil à l'architecture voyageuse.
    question_fin: Quel mot *français* t'a le plus [surpris] ?
  sujet: Mots français venus d'autres langues, et pourquoi
  legende: 'Ton mot préféré est peut-être venu du russe 🇷🇺


    Le français a emprunté à des dizaines de langues. Ces six mots montrent que notre vocabulaire a beaucoup voyagé,
    parfois sans passeport.


    La dernière slide ouvre un mot qui viendrait d''une langue amérindienne 👀


    Lequel de ces mots tu croyais vraiment français ? 🤔


    💾 Enregistre ce carrousel pour les retrouver quand tu brilleras en soirée culture G.


