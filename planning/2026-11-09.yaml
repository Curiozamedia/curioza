    slides:
    - titre: Le [baladeur] et ses piles
      texte: Des piles qui s'épuisaient vite, et une pochette qu'on remplissait de *CD* gravés à la main. Le *mixtape*
        du dimanche soir, version 2003.
    - titre: Le *tamagotchi* qu'on cachait
      texte: Un petit œuf numérique qu'il fallait nourrir, nettoyer et consoler, même pendant le cours de maths.
        Les plus malins le gardaient sous la table en *classe*.
    - titre: La *boîte à souvenirs* de l'ado
      texte: Les petits mots pliés en triangle, les photos d'identité en double, la chambre transformée en *musée*
        de soi-même. Rien d'officiel, tout sentimental.
    - titre: Le *téléphone à clapet* sacré
      texte: Pas d'écran tactile, juste des SMS payés au caractère et une sonnerie choisie avec soin. Le *prix*
        du message donnait déjà une leçon de discipline.
    - titre: Le *radioréveil* qui te faisait lever
      texte: Un bip strident, un bouton snooze qu'on martyrisait, et la radio qui te réveillait en plein refrain.
        Tu te levais souvent avec *un tube* dans la tête.
    question_fin: Lequel t'a *le plus marqué* ?
