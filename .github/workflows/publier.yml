name: Publier sur Instagram

on:
  schedule:
    # toutes les heures à hh:40 de 5h40 à 20h40 UTC (couvre 7h-22h à Paris, été comme hiver)
    - cron: "40 5-20 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Publier tout de suite ce post (id), vide = mode normal"
        required: false

concurrency:
  group: depot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer le site (calendrier + médias)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/_site.sh recuperer
      - name: Publication
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          URL_PAGES: ${{ vars.URL_PAGES }}
          SITE_DIR: ${{ github.workspace }}/_site
        run: |
          if [ -n "${{ github.event.inputs.post }}" ]; then
            python publier.py --maintenant "${{ github.event.inputs.post }}"
          else
            python publier.py
          fi
      - name: Republier le site
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/_site.sh publier
      - name: Enregistrer les statuts
        if: always()
        run: |
          git config user.name "curioza-bot"
          git config user.email "curioza-bot@users.noreply.github.com"
          git add -A planning
          git diff --cached --quiet || (git commit -m "Publication : mise à jour des statuts" && git pull --rebase && git push)
