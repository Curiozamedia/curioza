name: Préparer les 7 prochains jours

on:
  schedule:
    # chaque jour à 1h UTC (juste après la remise à zéro du quota gratuit Cloudflare) :
    # complète les 7 prochains jours -> toujours une semaine d'avance pour vérifier
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      semaine:
        description: "Lundi de la semaine à préparer (AAAA-MM-JJ), vide = semaine prochaine"
        required: false
      refaire:
        description: "Id d'un post à régénérer (optionnel)"
        required: false
      forcer:
        description: "Écraser la semaine si elle existe déjà (oui/non)"
        default: "non"

concurrency:
  group: depot
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  planifier:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Connexion Google Cloud (sans clé)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: pip install -r requirements.txt
      - name: Récupérer le site (calendrier + médias)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/_site.sh recuperer
      - name: Génération des contenus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_SA_JSON: ${{ secrets.VERTEX_SA_JSON }}
          URL_PAGES: ${{ vars.URL_PAGES }}
          SITE_DIR: ${{ github.workspace }}/_site
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.semaine }}" ] && ARGS="$ARGS --semaine ${{ github.event.inputs.semaine }}"
          [ -n "${{ github.event.inputs.refaire }}" ] && ARGS="$ARGS --refaire ${{ github.event.inputs.refaire }}"
          [ "${{ github.event.inputs.forcer }}" = "oui" ] && ARGS="$ARGS --forcer"
          PYTHONUNBUFFERED=1 GENERATION_MINUTES=150 timeout 175m python planifier.py $ARGS
      - name: Republier le site
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/_site.sh publier
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "curioza-bot"
          git config user.email "curioza-bot@users.noreply.github.com"
          git add -A planning
          git diff --cached --quiet || (git commit -m "Planning : nouvelle semaine" && git pull --rebase && git push)
