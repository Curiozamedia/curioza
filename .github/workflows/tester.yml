name: Tester les clés

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Connexion Google Cloud (sans clé)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: pip install -r requirements.txt
      - name: Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_SA_JSON: ${{ secrets.VERTEX_SA_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python tester_cles.py 2>&1 | tee resultat.txt || true
          python diagnostic.py 2>&1 | tee -a resultat.txt || true
          git config user.name "curioza-bot"; git config user.email "curioza-bot@users.noreply.github.com"
          git checkout -q --orphan diagnostic
          git rm -rq --cached . ; git add resultat.txt test_cles 2>/dev/null || git add resultat.txt
          git commit -qm "Diagnostic" && git push -fq origin diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-de-test
          path: test_cles/
          if-no-files-found: ignore
